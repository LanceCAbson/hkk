 after the papers were signed."),parkStory:T("Rumble spent the picnic stalking a paper bag that kept rustling in the breeze. After twenty minutes he pounced, disappeared inside it, and emerged wearing a sandwich wrapper. The ducks were the only witnesses. They were unkind about it."),secretStory:T("The little hunter has a collection behind the garden shed: feathers, a lost mitten, and a toy mouse with one ear. He brings Biscuit there sometimes. She inspects everything carefully, and he stands beside her looking absurdly pleased."),prefer:{boxes:1,bin:1,washer:1,stove:1,counter:1,dresser:1,toolbox:1,bookshelf:1,wheeliebin:1},rooms:{garage:1,utility:1,kitchen:1,garden:1,street:1},outdoor:1},cat_stretch:{name:"Noodle",coat:"#F6E4C4",ph:30,anchor:"floor",trait:T("The Sunbather"),bio:T("Occupies four times her own length. Finds the one warm stripe on the floor and claims it."),hides:T("Stretched out flat where the light lands"),likes:T("Butter, off the counter, when nobody is looking"),vet:T("Spine like a slinky. The vet was visibly impressed."),sleeps:T("Along the whole back of the sofa. All of it."),storm:T("Under the sofa. All four metres of her."),arrived:T("A neighbour moved away and could not take her. She was asleep in a sunbeam when we met, and has not meaningfully changed since."),parkStory:T("Noodle found a stripe of sunlight between two picnic blankets. As the shadows moved, she stretched a little further to stay in it. By the time we packed up, she had one paw on each blanket. Both families waited."),secretStory:T("On cloudy days she follows the sound of the kettle instead of the sun. We finally realised why: whoever makes the tea sits in the old armchair afterwards. Noodle gets there first and leaves exactly enough room for company."),rooms:{cons:1,living:1,bed:1,garden:1},outdoor:.8},cat_flop:{name:"Pudding",coat:"#E58A45",ph:32,anchor:"floor",trait:T("The Puddle"),bio:T("Has no bones. Melts onto soft furnishings and cannot be picked up in one piece."),hides:T("Poured over something soft"),likes:T("Supper. Then second supper."),vet:T("Heart rate low. Everything about her is low."),sleeps:T("The middle of the bed. You get the edge."),storm:T("Did not move. Storms are not her problem."),arrived:T("The last of her litter to be chosen, on the grounds that she had not moved once. We took that as a recommendation."),parkStory:T("We carried Pudding to the park in a basket and set it beneath a shady tree. She slept through the picnic, the kite flying and a brass band rehearsal. On the way home she opened one eye, as if checking whether the outing had begun."),secretStory:T("Pudding seems to sleep through everything, but she knows the sound of a suitcase. Before we can pack it, she settles inside with her chin on the handle. The smaller the case, the more determinedly she makes herself fit."),prefer:{rug:1,sofa:1,bed:1,armchair:1,cushion:1},rooms:{living:1,bed:1,kids:1},outdoor:.15},cat_playing:{name:"Pickle",coat:"#9FB49E",ph:34,anchor:"floor",trait:T("The Menace"),bio:T("If a thing can be knocked off an edge it already has been, and he watched it land."),hides:T("Wherever the trouble is"),likes:T("The bag the food came in"),vet:T("Claws extremely sharp. We have the evidence."),sleeps:T("In the washing basket, on the clean things."),storm:T("Thought the thunder was for him, and answered it."),arrived:T("Retrieved from a drainpipe, loudly, by three people and a ladder. He has been repaying the attention ever since."),parkStory:T("Pickle discovered that the drinking fountain could be operated with a paw. He pressed it, jumped at the water, and pressed it again. A queue formed behind him. Nobody was entirely sure whether they were watching a game or a scientific experiment."),secretStory:T("Every night he pushes his favourite crinkly ball underneath Shadow’s hiding place. Every morning it comes rolling back. We have never seen them play together. Pickle looks scandalised whenever anybody suggests that they might be friends."),prefer:{toybox:1,coffeetable:1,desk:1,bunkbed:1},rooms:{kids:1,living:1,study:1,attic:1},outdoor:.55},cat_peek:{name:"Shadow",coat:"#8C8895",ph:48,anchor:"edge",trait:T("The Spy"),bio:T("Watches from behind things. Has seen everything you have ever done in this house."),hides:T("Behind the big furniture, one eye showing"),likes:T("Eating alone, in the dark"),vet:T("Would not leave the carrier. Examined through the door."),sleeps:T("Somewhere upstairs. He will be down once you are asleep."),storm:T("Not seen since the first flash."),arrived:T("Nobody saw him arrive. He was simply in the house one evening, behind the bookcase, and stayed."),parkStory:T("Shadow watched the picnic from behind the park sign. Each time we counted the cats, one grey ear appeared around the post. When we pretended to leave without him, he reached the gate before anybody else, apparently by a route known only to shadows."),secretStory:T("He spends the first few minutes of every morning beside the bedroom door. If nobody gets up, he gives one very quiet chirrup. Then he retreats behind the bookcase. He would prefer us to believe the house itself said good morning."),prefer:{wardrobe:1,fridge:1,bookshelf:1,counter:1,dresser:1},rooms:{garage:1,attic:1,utility:1,study:1},outdoor:.35},cat_curled:{name:"Biscuit",coat:"#E8C79A",ph:34,anchor:"top",trait:T("The Cuddler"),bio:T("A perfect circle. Starts purring before you have touched her."),hides:T("Curled on whatever is softest"),likes:T("Cream, and being asked nicely"),vet:T("Purred throughout. The vet got almost nothing done."),sleeps:T("On your feet, and she is not moving."),storm:T("On your lap before the second one."),arrived:T("Handed over in a cardboard box by somebody who cried. She purred the entire way home."),parkStory:T("Biscuit climbed into the lap of a stranger reading on a park bench. They finished one chapter, then another, afraid to disturb her. When we arrived to collect her, the stranger asked very politely whether the book could come along too."),secretStory:T("She has worn a little hollow in the cushion beside the oldest person in the house. When their chair is empty, she sits facing the door. The instant they return, she begins purring, before either of them has quite reached the cushion."),prefer:{sofa:1,armchair:1,bed:1,bunkbed:1,chair:1,cushion:1},rooms:{living:1,bed:1,kids:1},outdoor:0},cat_loaf:{name:"Crumpet",coat:"#DFAE78",ph:30,anchor:"top",trait:T("The Radiator Thief"),bio:T("Tucks every paw away and becomes a loaf. Knows where every warm thing in the house is."),hides:T("On top of anything warm"),likes:T("Toast. Just the corner."),vet:T("Slightly toasted down one side. Otherwise perfect."),sleeps:T("On the boiler cupboard, naturally."),storm:T("Moved one inch closer to the radiator."),arrived:T("Found asleep on a builder's bag of sand, the warmest thing in the street. He came quietly."),parkStory:T("Crumpet tested every bench along the sunny side of the pond. The stone one was too cool; the wooden one was promising. He eventually selected a picnic blanket that had been folded over four times. We carried the picnic to him."),secretStory:T("When the heating clicks off, Crumpet goes looking for Duchess. He settles a respectful paw’s length away from her, then shuffles closer whenever she looks elsewhere. She always notices. She has stopped moving away."),must:{radiator:1},prefer:{radiator:1,tv:1,counter:1,stove:1,washer:1,dresser:1},rooms:{living:1,kitchen:1,utility:1,bath:1},outdoor:0},cat_highsit:{name:"Duchess",coat:"#EFEBE4",ph:50,anchor:"top",trait:T("The Aristocrat"),bio:T("Sits at the highest available point and looks down on the entire household."),hides:T("The top of the tallest thing in the room"),likes:T("Served on a saucer. Not the floor."),vet:T("Refused the scales. A figure was estimated."),sleeps:T("The top of the wardrobe. Obviously."),storm:T("Was not frightened. Merely relocated. Twice."),arrived:T("Arrived in a wicker carrier with a name already on it. We were not
