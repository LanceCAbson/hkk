e="translate" values="0 0;60 -35;110 5;0 0" dur="'+(12+i)+'s" begin="-'+i*2+'s" repeatCount="indefinite"/>'),r+='<g transform="translate('+(n[0]*t).toFixed(1)+" "+(n[1]*a).toFixed(1)+') scale(.65)"><g>'+o+"</g></g>"}),e.appendChild(D("g",{class:"park-pond-life","pointer-events":"none"},r))}function vr(e){if(V.id==="onsen")return HKKOnsen.hides(e);if(V.id==="harbour")return HKKHarbour.hides(e);if(V.id==="shopping")return HKKStreet.hides(e);if(V.id!=="park")return z[e].hides;var t={cat_loaf:"On a sun-warmed bench or picnic table",cat_highsit:"Perched on a park sign or pavilion roof",cat_curled:"Curled on a bench or picnic table",cat_peek:"Behind blossom trees, flower arches or the playground frame",cat_playing:"Near the swings and climbing playground",cat_flop:"Sprawled beside picnic blankets and tables",cat_walking:"Low down beside the bushes and flowerbeds"};return t[e]||"Along the paths, beside benches and bushes"}function Ni(e){var t={cat_loaf:{bench:1,picnic:1,parkSeat:1,parkRefreshmentCart:1},cat_highsit:{parkSign:1,parkGazebo:1},cat_curled:{bench:1,picnic:1,parkSeat:1},cat_peek:{tree:1,treeSm:1,parkBlossom:1,parkSign:1,swing:1,parkFlowerArch:1},cat_playing:{slide:1,swing:1,parkPlayCastle:1},cat_flop:{bench:1,picnic:1,parkPicnicBlanket:1,parkSeat:1},cat_walking:{bush:1,bin:1,flowerbed:1,parkWildflowers:1}};return Object.assign({},z[e],{rooms:null,must:null,prefer:t[e]||{bush:1,bench:1,parkSeat:1,flowerbed:1}})}var Ie=1180,Ue=-1,Y=_a.w,me=_a.h,ie=_a.rooms,qe=0,Be=_a.w,de=0,Di=["frameSq","frameLand","framePortrait","clock","mirror","shelf","hooks","window","sconce","calendar","artZig","artWave"],Vi=["pendant","fan","hangplant"],z={cat_sitting:{name:"Marmalade",coat:"#F0A055",ph:28,anchor:"floor",trait:"The Doorstop",bio:"Lies precisely where you need to walk, and looks genuinely wounded when you step over him.",hides:"Out in the open, in the way",likes:"Whatever you are having",vet:"A little rounder than last year. We agreed not to discuss it.",sleeps:"On the landing, lengthways across the top step.",storm:"Slept through the entire thing.",arrived:"Turned up at the back door in the rain and walked straight past us to the fire. Nobody remembers agreeing to it.",parkStory:"Marmalade chose the narrowest part of the park path and lay across it. Prams went round. A jogger apologised. By lunchtime, somebody had placed a little stick beside him as a diversion sign. He regarded this as proper recognition.",secretStory:"He waits on the landing until the last light in the house goes out. Only then does he go to bed. We thought he was blocking the stairs again, until one evening everyone stayed downstairs and he came to fetch us.",rooms:{hall:1,landing:1,living:1,kitchen:1},outdoor:.5},cat_walking:{name:"Rumble",coat:"#A89078",ph:44,anchor:"floor",trait:"The Hunter",bio:"Brings you things. Live things, mostly, and always at four in the morning.",hides:"Low down, wherever a mouse would go",likes:"Whatever he caught. It is a gift, and you must look pleased.",vet:"One ear notched, both eyes sharp. A menace to local wildlife.",sleeps:"By the skirting board, facing the gap. On duty.",storm:"Out in the worst of it. Came back soaked, and proud.",arrived:"Came with the house. The previous owners mentioned him in passing, after the papers were signed.",parkStory:"Rumble spent the picnic stalking a paper bag that kept rustling in the breeze. After twenty minutes he pounced, disappeared inside it, and emerged wearing a sandwich wrapper. The ducks were the only witnesses. They were unkind about it.",secretStory:"The little hunter has a collection behind the garden shed: feathers, a lost mitten, and a toy mouse with one ear. He brings Biscuit there sometimes. She inspects everything carefully, and he stands beside her looking absurdly pleased.",prefer:{boxes:1,bin:1,washer:1,stove:1,counter:1,dresser:1,toolbox:1,bookshelf:1,wheeliebin:1},rooms:{garage:1,utility:1,kitchen:1,garden:1,street:1},outdoor:1},cat_stretch:{name:"Noodle",coat:"#F6E4C4",ph:30,anchor:"floor",trait:"The Sunbather",bio:"Occupies four times her own length. Finds the one warm stripe on the floor and claims it.",hides:"Stretched out flat where the light lands",likes:"Butter, off the counter, when nobody is looking",vet:"Spine like a slinky. The vet was visibly impressed.",sleeps:"Along the whole back of the sofa. All of it.",storm:"Under the sofa. All four metres of her.",arrived:"A neighbour moved away and could not take her. She was asleep in a sunbeam when we met, and has not meaningfully changed since.",parkStory:"Noodle found a stripe of sunlight between two picnic blankets. As the shadows moved, she stretched a little further to stay in it. By the time we packed up, she had one paw on each blanket. Both families waited.",secretStory:"On cloudy days she follows the sound of the kettle instead of the sun. We finally realised why: whoever makes the tea sits in the old armchair afterwards. Noodle gets there first and leaves exactly enough room for company.",rooms:{cons:1,living:1,bed:1,garden:1},outdoor:.8},cat_flop:{name:"Pudding",coat:"#E58A45",ph:32,anchor:"floor",trait:"The Puddle",bio:"Has no bones. Melts onto soft furnishings and cannot be picked up in one piece.",hides:"Poured over something soft",likes:"Supper. Then second supper.",vet:"Heart rate low. Everything about her is low.",sleeps:"The middle of the bed. You get the edge.",storm:"Did not move. Storms are not her problem.",arrived:"The last of her litter to be chosen, on the grounds that she had not moved once. We took that as a recommendation.",parkStory:"We carried Pudding to the park in a basket and set it beneath a shady tree. She slept through the picnic, the kite flying and a brass band rehearsal. On the way home she opened one eye, as if checking whether the outing had begun.",secretStory:"Pudding seems to sleep through everything, but she knows the sound of a suitcase. Before we can pack it, she settles inside with her chin on the handle. The smaller the case, the more determinedly she makes herself fit.",prefer:{rug:1,sofa:1,bed:1,armchair:1,cushion:1},rooms:{living:1,bed:1,kids:1},outdoor:.15},cat_playing:{name:"Pickle",coat:"#9FB49E",ph:34,anchor:"floor",trait:"The Menace",bio:"If a thing can be knocked off an edge it already has been, and he watched it land.",hides:"Wherever the trouble is",likes:"The bag the food came in",vet:"Claws extremely sharp. We have the evidence.",sleeps:"In the washing basket, on the clean things.",storm:"Thought the thunder was for him, and answered it.",arrived:"Retrieved from a drainpipe, loudly, by three people and a ladder. He has been repaying the attention ever since.",parkStory:"Pickle discovered that the drinking fountain could be operated with a paw. He pressed it, jumped at the water, and pressed it again. A queue formed behind him. Nobody was entirely sure whether they were watching a game or a scientific experiment.",secretStory:"Every night he pushes his favourite crinkly ball underneath Shadow’s hiding place. Every morning it comes rolling back. We have never seen them play together. Pickle looks scandalised whenever anybody suggests that they might be friends.",prefer:{toybox:1,coffeetable:1,desk:1,bunkbed:1},rooms:{kids:1,living:1,study:1,attic:1},outdoor:.55},cat_peek:{name:"Shadow",coat:"#8C8895",ph:48,anchor:"edge",trait:"The Spy",bio:"Watches from behind things. Has seen everything you have ever done in this house.",hides:"Behind the big furniture, one eye showing",likes:"Eating alone, in the dark",vet:"Would not leave the carrier. Examined through the door.",sleeps:"Somewhere upstairs. He will be down once you are asleep.",storm:"Not seen since the first flash.",arrived:"Nobody saw him arrive. He was simply in the house one evening, behind the bookcase, and stayed.",parkStory:"Shadow watched the picnic from behind the park sign. Each time we counted the cats, one grey ear appeared around the post. When we pretended to leave without him, he reached the gate before anybody else, apparently by a route known only to shadows.",secretStory:"He spends the first few minutes of every morning beside the bedroom door. If nobody gets up, he gives one very quiet chirrup. Then he retreats behind the bookcase. He would prefer us to believe the house itself said good morning.",prefer:{wardrobe:1,fridge:1,bookshelf:1,counter:1,dresser:1},rooms:{garage:1,attic:1,utility:1,study:1},outdoor:.35},cat_curled:{name:"Biscuit",coat:"#E8C79A",ph:34,anchor:"top",trait:"The Cuddler",bio:"A perfect circle. Starts purring before you have touched her.",hides:"Curled on whatever is softest",likes:"Cream, and being asked nicely",vet:"Purred throughout. The vet got almost nothing done.",sleeps:"On your feet, and she is not moving.",storm:"On your lap before the second one.",arrived:"Handed over in a cardboard box by somebody who cried. She purred the entire way home.",parkStory:"Biscuit climbed into the lap of a stranger reading on a park bench. They finished one chapter, then another, afraid to disturb her. When we arrived to collect her, the stranger asked very politely whether the book could come along too.",secretStory:"She has worn a little hollow in the cushion beside the oldest person in the house. When their chair is empty, she sits facing the door. The instant they return, she begins purring, before either of them has quite reached the cushion.",prefer:{sofa:1,armchair:1,bed:1,bunkbed:1,chair:1,cushion:1},rooms:{living:1,bed:1,kids:1},outdoor:0},cat_loaf:{name:"Crumpet",coat:"#DFAE78",ph:30,anchor:"top",trait:"The Radiator Thief",bio:"Tucks every paw away and becomes a loaf. Knows where every warm thing in the house is.",hides:"On top of anything warm",likes:"Toast. Just the corner.",vet:"Slightly toasted down one side. Otherwise perfect.",sleeps:"On the boiler cupboard, naturally.",storm:"Moved one inch closer to the radiator.",arrived:"Found asleep on a builder's bag of sand, the warmest thing in the street. He came quietly.",parkStory:"Crumpet tested every bench along the sunny side of the pond. The stone one was too cool; the wooden one was promising. He eventually selected a picnic blanket that had been folded over four times. We carried the picnic to him.",secretStory:"When the heating clicks off, Crumpet goes looking for Duchess. He settles a respectful paw’s length away from her, then shuffles closer whenever she looks elsewhere. She always notices. She has stopped moving away.",must:{radiator:1},prefer:{radiator:1,tv:1,counter:1,stove:1,washer:1,dresser:1},rooms:{living:1,kitchen:1,utility:1,bath:1},outdoor:0},cat_highsit:{name:"Duchess",coat:"#EFEBE4",ph:50,anchor:"top",trait:"The Aristocrat",bio:"Sits at the highest available point and looks down on the entire household.",hides:"The top of the tallest thing in the room",likes:"Served on a saucer. Not the floor.",vet:"Refused the scales. A figure was estimated.",sleeps:"The top of the wardrobe. Obviously.",storm:"Was not frightened. Merely relocated. Twice.",arrived:"Arrived in a wicker carrier with a name already on it. We were not consulted about any of this.",parkStory:"Duchess climbed to the top of the park noticeboard and surveyed the duck pond. A duck looked up. She looked down. This continued for some time. We were eventually permitted to lift her down, provided nobody described it as a rescue.",secretStory:"We once found her asleep in the smallest cardboard box in the house, with one ear folded and all four paws in the air. She woke, stepped out, and sat on the wardrobe. The box disappeared later that afternoon. Nobody has admitted moving it.",prefer:{wardrobe:1,bookshelf:1,fridge:1},rooms:{bed:1,study:1,living:1,attic:1},outdoor:0},cat_tortie:{name:"Sixpence",coat:"#BE8468",ph:50,anchor:"floor",rare:1,trait:"The Rare One",bio:"Not strictly yours. Comes when it suits her, which is rarely.",hides:"Somewhere new every single time",likes:"Whatever she has decided is hers",vet:"No records. No microchip. No comment.",sleeps:"Gone by morning. Back on Thursday.",storm:"Came in. That is the remarkable part.",arrived:"She has not arrived. She visits, and the distinction matters a great deal to her.",parkStory:"Sixpence appeared at the picnic without travelling there with us. She inspected the blanket, sat beside the basket, and vanished when we started packing. At the gate, another family greeted her by a completely different name. She answered to neither.",secretStory:"There is one evening each month when she waits on our doorstep before anyone comes home. She brings nothing, asks for nothing, and stays until morning. We leave the same chair free for her. She has never missed that evening.",outdoor:.7}},$t={foodbowl:{name:"Food bowl",clue:"Wherever supper was served.",ph:20,anchor:"floor",ground:1,max:2,rooms:{kitchen:1,utility:1,hall:1},lines:["A bowl, licked to a shine. Pudding says it came like that.","Half a bowl of biscuits. Marmalade has been told they are not his.","Supper, or the end of it. Second supper was Pudding's idea."]},waterbowl:{name:"Water bowl",clue:"Somewhere with a tap nearby.",ph:17,anchor:"floor",ground:1,max:1,rooms:{kitchen:1,utility:1,bath:1},lines:["Fresh water, untouched. They all prefer the tap.","The water bowl. Duchess will only drink from a saucer."]},toymouse:{name:"Toy mouse",clue:"Low down, mostly, where a real one would run.",ph:19,anchor:"floor",alt:"top",max:2,rooms:{living:1,kids:1,kitchen:1,hall:1,landing:1},lines:["One of Rumble's. He caught it fair and square.","A toy mouse, one ear missing. Rumble will not discuss it."]},yarn:{name:"Ball of wool",clue:"Wherever Pickle last lost interest in it.",ph:23,anchor:"floor",alt:"top",max:2,rooms:{living:1,kids:1,bed:1},lines:["Pickle's wool. Most of it is now in the hall.","A ball of wool, partly unwound, entirely Pickle's fault."]},furball:{name:"Furball",clue:"Somewhere soft underfoot.",ph:19,anchor:"floor",ground:1,max:2,rooms:{landing:1,hall:1,living:1,bed:1,kids:1},lines:["Pickle's. He would like it noted that he feels much better.","A furball. Nobody is owning up to this one."]},litter:{name:"Litter tray",clue:"Somewhere out of the way, and private.",ph:20,anchor:"floor",ground:1,side:1,max:1,rooms:{utility:1,bath:1,garage:1,landing:1},lines:["Somebody has been. Nobody is saying who.","The litter tray. Duchess will not use it while anyone is watching."]},scratcher:{name:"Scratching post",clue:"Near the furniture it is meant to save.",ph:66,anchor:"floor",ground:1,side:1,max:1,rooms:{living:1,hall:1,landing:1,kids:1,study:1},lines:["The scratching post, in perfect condition. The sofa took the damage.","Untouched. Biscuit prefers the stair carpet."]},collar:{name:"Collar",clue:"On a surface, left by whoever took it off.",ph:22,anchor:"top",alt:"floor",max:1,rooms:{hall:1,bed:1,study:1,living:1},lines:["Shadow's collar, bell and all. A spy does not wear a bell.","A collar with a bell on it. Shadow took it off. Obviously."]},sock:{name:"Sock",clue:"Rumble leaves his gifts where you will tread on them.",ph:23,anchor:"floor",alt:"top",max:2,rooms:{bed:1,bath:1,kids:1,landing:1},lines:["One sock, brought in by Rumble as a gift. Look pleased.","A single sock. The other one is Rumble's business."]},feather:{name:"Feather wand",clue:"Leaning where the last game ended.",ph:44,anchor:"floor",ground:1,side:1,max:1,rooms:{living:1,kids:1,cons:1,bed:1},lines:["The feather wand. Biscuit is waiting to be asked nicely.","Two feathers left on it. There were six."]},fishbone:{name:"Fishbone",clue:"Wherever supper went missing. Possibly outside.",ph:18,anchor:"floor",ground:1,max:1,outdoor:1,rooms:{kitchen:1,garden:1,street:1},lines:["What is left of the kipper. Nobody is confessing.","Supper, formerly. Noodle smells faintly of it."]}},Jn=$t,$n={parkAcorn:{name:"Acorn",clue:"Under the trees, beside trunks and bushes.",ph:33,anchor:"floor",ground:1,outdoor:1,max:2,rooms:{parkGrove:1,parkFlowers:1},lines:["A tiny acorn. Shadow checked it for suspicious activity.","An acorn with its little hat still on."]},parkPinecon
