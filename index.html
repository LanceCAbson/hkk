/* Step the menu down until it fits above the banner. `fresh` starts again from
   full size, on opening or when the screen or banner changes; otherwise it only
   ever tightens, so a cat with a longer bio cannot make the page jump back and
   forth as the parade goes round. */
/* Measured by where the buttons actually end, not by whether the page
   scrolls: WebKit leaves a scroller's bottom padding out of its scroll height,
   so on an iPhone the last row could sit in the padding kept for the banner,
   under the ad, while the menu reported that it fitted. */
var MENU_TIGHT = ["tight1", "tight2", "tight3", "tight4"];
function menuOverrun(m){
  var last = m.querySelector(".m-secondary") || m.querySelector(".m-buttons");
  if(!last) return 0;
  var top = m.getBoundingClientRect().top;
  var bottom = last.getBoundingClientRect().bottom - top + m.scrollTop;
  var limit = m.clientHeight - (parseFloat(getComputedStyle(m).paddingBottom) || 0);
  return bottom - limit;
}
function fitMenu(fresh){
  var m = document.getElementById("menu");
  if(!m || m.hidden) return;
  if(fresh) MENU_TIGHT.forEach(function(c){ m.classList.remove(c) });
  for(var i = 0; i < MENU_TIGHT.length && menuOverrun(m) > 1; i++){
    if(!m.classList.contains(MENU_TIGHT[i])) m.classList.add(MENU_TIGHT[i]);
  }
}
window.addEventListener("resize", function(){ fitMenu(true) });

function closeMenu(){
  menuOpen = false;
  syncMenuMotion();
  syncSceneMotion();
  MUSIC.to("play");
  clearInterval(paradeTimer);
  document.getElementById("menu").hidden = true;
}

/* ---- what the game remembers ---- */
function loadStats(){
  try{ return JSON.parse(localStorage.getItem("wtc-stats")) || {} }catch(e){ return {} }
}
function saveStats(v){
  try{ localStorage.setItem("wtc-stats", JSON.stringify(v)) }catch(e){}
}

/* ---- what a cat is worth learning ----
   Finding a cat once tells you its name. The rest of its page is handed over
   a line at a time, and only to somebody who keeps picking that same cat out
   of the house — which is the one reason to go on looking properly after you
   can already win. The tease is deliberate: it names the subject, never the
   answer, exactly as the "where they turn up" line does. */
var UNLOCKS = [
  {at:1, key:"sleeps", label:"Where they sleep",
   tease:"where they put themselves down at night"},
  {at:3, key:"vet",    label:"Last year at the vet",
   tease:"what the vet wrote down last year"},
  {at:6, key:"storm",  label:"The night of the storm",
   tease:"how they took the night of the storm"},
  {at:10, key:"arrived", label:"How they arrived",
   tease:"how they came to live here"},
  {at:15, key:"parkStory", label:"A day in the park",
   tease:"what happened on their day in the park"},
  {at:20, key:"secretStory", label:"Their little secret",
   tease:"the little secret they have been keeping"}
];
var unlockedTonight = [];

function findCount(kind){
  var st = loadStats();
  return (st.finds && st.finds[kind]) || 0;
}
/* Written the moment the cat is found rather than at the end of the night, so
   the new line is already on the page if the player opens it straight away. */
function recordFind(kind){
  var st = loadStats();
  st.finds = st.finds || {};
  if(isDaily){
    st.dailyFinds=st.dailyFinds||{};
    if(st.dailyFinds[kind]===seed)return null;
    st.dailyFinds[kind]=seed;
    /* what the Ranks count: cats found on the daily search, once a day each */
    st.catTotal = (st.catTotal || 0) + 1;
    if(st.firstDay === undefined) st.firstDay = seed;
  }
  var n = st.finds[kind] = (st.finds[kind] || 0) + 1;
  saveStats(st);
  var got = UNLOCKS.filter(function(u){ return u.at === n })[0];
  if(got) unlockedTonight.push({kind:kind, label:got.label});
  return got || null;
}
/* The bonus things a daily search has given up so far. Replaying the same day
   finds the same things, so each day only ever adds what it has not already:
   the best count for a date, not a running sum of every look. */
function recordThing(){
  if(!isDaily) return;
  var st = loadStats();
  var by = st.thingsByDay = st.thingsByDay || {};
  var had = by[seed] || 0;
  if(thingsFound <= had) return;
  st.thingTotal = (st.thingTotal || 0) + thingsFound - had;
  by[seed] = thingsFound;
  Object.keys(by).forEach(function(d){ if(+d < seed - 90) delete by[d] });
  if(st.firstDay === undefined) st.firstDay = seed;
  saveStats(st);
}
function recordNight(secs){
  var st = loadStats();
  st.played = (st.played || 0) + 1;
  st.cats = st.cats || {};
  targets.forEach(function(t){ st.cats[t.kind] = (st.cats[t.kind] || 0) + 1 });
  if(!st.best || secs < st.best) st.best = secs;
  if(isDaily && !completedDay(st,seed)){
    /* yesterday's house keeps the run going, and so does one quiet day in a
       week; a longer gap starts it again at one */
    if(st.lastDay === undefined || seed > st.lastDay){
      var gap = st.lastDay === undefined ? 0 : seed - st.lastDay;
      if(gap === 1){
        st.streak = (st.streak || 0) + 1;
      } else if(gap === 2 && restReady(st, seed - 1)){
        st.streak = (st.streak || 0) + 1;
        st.restDay = seed - 1;
      } else {
        st.streak = 1;
      }
      st.lastDay = seed;
    }
    st.nights = (st.nights || 0) + 1;
    if(st.streak > (st.bestStreak || 0)) st.bestStreak = st.streak;
    st.dailyDays=(st.dailyDays||[]).filter(function(d){return d>=seed-90});
    if(st.dailyDays.indexOf(seed)<0)st.dailyDays.push(seed);
    st.locationVisits=st.locationVisits||{};
    st.locationVisits[currentLocation.id]=(st.locationVisits[currentLocation.id]||0)+1;
  }
  saveStats(st);
}

/* Keep keyboard navigation inside the visible panel, including a profile
   opened on top of the Catbook, and return focus to its opener on close. */
function panelFocus(layer, dialog, close){
  var opener = document.activeElement;
  var dismiss = document.createElement("button");
  dismiss.type = "button"; dismiss.className = "panel-dismiss";
  dismiss.setAttribute("aria-label", "Close panel");
  dismiss.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  dialog.appendChild(dismiss);
  dismiss.addEventListener("click", close);
  function key(e){
    if(document.querySelector(".sheet") && !layer.classList.contains("sheet")) return;
    if(e.key !== "Tab") return;
    var items = Array.prototype.filter.call(dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), a[href], [tabindex="0"]'), function(n){ return n.getClientRects().length });
    var first = items[0], last = items[items.length - 1];
    if(!dialog.contains(document.activeElement) || (e.shiftKey && document.activeElement === first)){
      e.preventDefault(); (e.shiftKey ? last : first).focus({preventScroll:true});
    } else if(!e.shiftKey && document.activeElement === last){
      e.preventDefault(); first.focus({preventScroll:true});
    }
  }
  document.addEventListener("keydown", key);
  dismiss.focus({preventScroll:true});
  return function(){
    document.removeEventListener("keydown", key);
    if(opener && opener.isConnected) opener.focus({preventScroll:true});
  };
}

function openPanel(inner){
  var wrap = document.createElement("div");
  wrap.className = "overlay top";
  wrap.innerHTML = '<div class="card pnl" role="dialog" aria-modal="true">' + inner +
    '<div class="cardrow" style="margin-top:18px">' +
    '<button class="primary wide" data-close>Close</button></div></div>';
  document.body.appendChild(wrap);
  var card = wrap.querySelector(".card");
  var title = card.querySelector("h2");
  if(title) card.setAttribute("aria-label", title.textContent);
  var releaseFocus = panelFocus(wrap, card, close);
  function close(){ wrap.remove(); document.removeEventListener("keydown", onKey); releaseFocus() }
  function onKey(e){ if(e.key === "Escape" && !document.querySelector(".sheet")) close() }
  wrap.addEventListener("click", function(e){ if(e.target === wrap) close() });
  wrap.querySelector("[data-close]").addEventListener("click", close);
  document.addEventListener("keydown", onKey);
}

/* The pages were reachable only from a tally face during a run, and a face is
   not obviously a button. This is the front door: it is on the menu, it works
   between games, and it shows the whole household at once — including the cats
   who are not in tonight's house. */
function openCatbook(){
  var cards = roster().map(function(k){
    var c = CATS[k], n = findCount(k);
    var top = UNLOCKS[UNLOCKS.length-1].at;
    var got = UNLOCKS.filter(function(u){ return n >= u.at }).length;
    return '<button type="button" class="bookcat' + (n ? " known" : "") +
      (n >= top ? " done" : "") + '" data-kind="' + k + '" ' +
      'aria-label="' + c.name + ', ' + (n ? got + " of " + UNLOCKS.length + " discovered" : "not found yet") + '">' +
      (c.rare ? '<span class="book-rare" aria-label="Rare visitor">&#10022;</span>' : '') +
      '<span class="bf">' + faceSvg(k, n ? "found" : "hide", true) + '</span>' +
      '<b>' + (n ? c.name : "?????") + '</b>' +
      '<span class="book-progress" aria-hidden="true">' + UNLOCKS.map(function(u){ return '<span' + (n >= u.at ? ' class="on"' : '') + '></span>' }).join("") + '</span>' +
      '<i>' + got + "/" + UNLOCKS.length + ' stories</i></button>';
  }).join("");

  openPanel(
    '<p class="eyebrow">The Catbook</p><h2>The household</h2>' +
    '<p class="lede">Find a cat and its page opens. Keep finding the same one ' +
    'and it tells you more \u2014 six stories for every cat, from their first ' +
    'night here to their little secret.</p>' +
    '<div class="bookgrid">' + cards + '</div>');
  MEASURE.screen("Catbook");

  var wrap = document.querySelector(".overlay.top");
  if(!wrap) return;
  wrap.querySelectorAll(".bookcat").forEach(function(b){
    b.addEventListener("click", function(){ openCatCard(b.dataset.kind) });
  });
}

/* Rank is what you have found: every cat and every bonus thing on the daily
   search, added up. It only ever goes up and it needs nobody else, which is why
   it is the first thing on the panel and the only thing on it for as long as
   there is no board worth drawing. */
var TIERS = [
  {at:0,    name:"Visitor"},
  {at:30,   name:"Cat Spotter"},
  {at:100,  name:"Cat Sitter"},
  {at:250,  name:"Housemate"},
  {at:500,  name:"Cat Whisperer"},
  {at:1000, name:"Keeper"},
  {at:2000, name:"Head Keeper"},
  {at:4000, name:"Friend of the House"}
];
function tierFor(total){
  var i = 0;
  while(i + 1 < TIERS.length && total >= TIERS[i + 1].at) i++;
  return i;
}
/* today's time, for somebody who gives a name after they have already finished:
   from this session if the night is just done, otherwise from what finish() wrote down */
function todaysRun(){
  if(done && isDaily && seed === houseNo) return {secs:nightSecs, hints:hints};
  try{
    var r = JSON.parse(localStorage.getItem("wtc-" + houseNo));
    if(r && r.t) return {secs:r.t, hints:r.h || 0};
  }catch(e){}
  return null;
}

function openRanks(){
  var me = RANKS.mine();
  var ti = tierFor(me.total), tier = TIERS[ti], nxt = TIERS[ti + 1];
  var pct = nxt ? Math.round((me.total - tier.at) / (nxt.at - tier.at) * 100) : 100;
  openPanel(
    '<p class="eyebrow">Ranks</p><h2>' + tier.name + '</h2>' +
    '<div class="rk-bar" role="img" aria-label="' + (nxt ? pct + ' percent of the way to ' + nxt.name : 'The top rank') + '"><i style="width:' + pct + '%"></i></div>' +
    '<p class="rk-next"><b>' + me.total + '</b> found' + (nxt ? ' · ' + (nxt.at - me.total) + ' to ' + nxt.name : '') + '</p>' +
    '<div id="boardWrap"></div><div id="nameWrap"></div>');
  MEASURE.screen("Ranks");
  fillName();
  /* the finds are brought up to date first, so the board has you on it as you are */
  RANKS.sync().then(fillBoards);
}

/* Drawn after the panel so a slow network never delays it, and drawn only when
   there is something worth showing: a board with too few people on it, or one
   the network cannot reach, is simply not on the page. */
var boardTab = "found";
function fillBoards(){
  var wrap = document.getElementById("boardWrap");
  if(!wrap) return;
  Promise.all([RANKS.found(), RANKS.quickest()]).then(function(r){
    if(!wrap.isConnected) return;
    var f = r[0], q = r[1];
    if(!f && !q){ wrap.innerHTML = ""; return }

    function who(n){ return escapeText(NAMES.display(n)) }
    function row(pos, name, value, me, gap){
      /* gold, silver and bronze for the first three places on either board */
      var medal = !gap && pos <= 3 ? ' medal m' + pos : '';
      return '<li' + (me ? ' class="me' + (gap ? ' gap' : '') + '"' : '') + '><span class="pos' + medal + '">' + pos +
        '</span><span class="who"><b>' + who(name) + '</b></span><span class="t">' + value + '</span></li>';
    }
    var panes = [];
    if(f) panes.push({id:"found", label:"Most found", html:
      '<ul class="board">' + f.rows.map(function(x, i){ return row(i + 1, x.name, x.total, x.me) }).join("") +
        (f.you ? row(f.you.rank, f.you.name, f.you.total, true, true) : "") + '</ul>'});
    function timeRow(pos, x, me, gap){
      return row(pos, x.name, fmt(x.secs), me, gap);
    }
    if(q) panes.push({id:"quick", label:"Today's speed run", html:
      '<p class="rk-sub">Today\u2019s daily \u00b7 <b>' + locationFor(houseNo).name + '</b> \u00b7 ' + dailyDateLabel(houseNo) + '</p>' +
      '<ul class="board">' + q.rows.map(function(x, i){ return timeRow(i + 1, x, x.me) }).join("") +
        (q.you ? timeRow(q.you.rank, q.you, true, true) : "") + '</ul>'});
    if(!panes.some(function(x){ return x.id === boardTab })) boardTab = panes[0].id;

    wrap.innerHTML =
      (panes.length > 1
        ? '<div class="rk-tabs" role="tablist">' + panes.map(function(x){
            return '<button type="button" role="tab" data-pane="' + x.id + '" aria-selected="' + (x.id === boardTab) + '">' + x.label + '</button>';
          }).join("") + '</div>'
        : '<h3>' + panes[0].label + '</h3>') +
      panes.map(function(x){
        return '<div role="tabpanel" data-pane="' + x.id + '"' + (x.id === boardTab ? '' : ' hidden') + '>' + x.html + '</div>';
      }).join("");

    wrap.querySelectorAll(".rk-tabs button").forEach(function(b){
      b.addEventListener("click", function(){
        boardTab = b.dataset.pane;
        wrap.querySelectorAll(".rk-tabs button").forEach(function(o){ o.setAttribute("aria-selected", String(o === b)) });
        wrap.querySelectorAll("[role=tabpanel]").forEach(function(p){ p.hidden = p.dataset.pane !== boardTab });
      });
    });
  });
}

/* The name is what the boards show you as: CatFinder and a number to begin
   with, and whatever you change it to after. */
function fillName(){
  var wrap = document.getElementById("nameWrap");
  if(!wrap) return;
  var who = RANKS.name();
  wrap.innerHTML =
    '<div class="namerow">' +
      '<input id="rkName" maxlength="' + NAMES.MAX + '" placeholder="Your name" value="' +
        who.replace(/"/g, "&quot;") + '" aria-label="Your name on the boards">' +
      '<button class="primary" id="rkSave">Change</button></div>' +
    '<p class="namewarn" id="rkWarn" role="status" hidden></p>';

  var btn = document.getElementById("rkSave"), inp = document.getElementById("rkName");
  var warn = document.getElementById("rkWarn");
  function say(msg){
    if(!warn) return;
    warn.textContent = msg || "";
    warn.hidden = !msg;
  }
  /* Characters outside the whitelist never make it into the box, so the name
     being typed and the name that would be saved are the same thing. The
     caret is put back by hand because rewriting value moves it to the end. */
  inp.addEventListener("input", function(){
    var at = inp.selectionStart, was = inp.value;
    var now = was.split("").filter(NAMES.allowedChar).join("").slice(0, NAMES.MAX);
    if(now !== was){
      inp.value = now;
      try{ inp.setSelectionRange(at - 1, at - 1) }catch(e){}
    }
    say("");
  });

  btn.addEventListener("click", function(){
    var v = (inp.value || "").trim();
    if(!v) return;
    var why = NAMES.reject(v);
    if(why){ say(why); return }
    say("");
    inp.value = RANKS.name(v);
    /* the new name goes up with the finds and today's time */
    RANKS.sync().then(fillBoards);
    var run = todaysRun();
    if(run) RANKS.submit(run.secs, run.hints, houseNo).then(fillBoards);
    btn.textContent = "Saved";
    setTimeout(function(){ if(btn.isConnected) btn.textContent = "Change" }, 1200);
  });
}

/* the board prints names people chose, so they are text and never markup */
function escapeText(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

/* ============================ 7. the native shell ============================
   The game is a web page first. It runs in a plain browser with no Capacitor
   anywhere, so every call in here is behind a guard and the whole module is a
   silent no-op off-device. Nothing in the game may ever wait on an ad or
   change because one failed to load: an ad that does not arrive is a normal
   Tuesday, not an error path. */
var ADS = (function(){
  var ready = false, loaded = {}, privacyOpts = false, measure = false;
  /* A consent request that fails is not a player saying no, and the difference
     is invisible from inside the game: ads simply never start and nothing is
     counted. Keeping the reason makes that answerable on a device. */
  var consentError = null;
  /* the SDK's last word on status, and whether the player said no on the form */
  var status = null, allowed = false, refused = false;
  /* the SDK is started once; a second go at the consent step must not start it
     again, and two goes must never overlap */
  var started = false, inflight = null;

  /* Where a consent form was shown, Google requires a permanent way back to it,
     and only the SDK knows whether this player is somewhere that counts. Both
     the first look and the answered form report it, so both are recorded. */
  function note(info){
    if(info && info.privacyOptionsRequirementStatus){
      privacyOpts = info.privacyOptionsRequirementStatus === "REQUIRED";
    }
    if(info){
      status = info.status;
      allowed = info.status === "NOT_REQUIRED" || !!info.canRequestAds;
    }
    return info;
  }

  /* What the player actually answered, which the SDK cannot say: status reads
     OBTAINED whichever button was pressed, and canRequestAds is true either
     way because a "no" still gets non-personalised ads. UMP keeps the answer
     natively as a TCF string, read by the shell's own Tcf plugin. Personalised
     ads need purposes 1, 3 and 4; anything short of all three is a no. Never
     asked ("") is not a no, but an answer that cannot be read from somewhere a
     form may have been shown is treated as one. A no means nothing is counted
     and ATT does not ask again. */
  function answer(){
    return Promise.resolve()
      .then(function(){ return window.Capacitor.Plugins.Tcf.purposeConsents() })
      .then(function(r){ return r && typeof r.value === "string" ? r.value : null })
      .catch(function(){ return null })
      .then(function(v){
        refused = v === null ? status !== "NOT_REQUIRED"
                : v !== "" && !(v.charAt(0) === "1" && v.charAt(2) === "1" && v.charAt(3) === "1");
        measure = allowed && !refused;
      });
  }

  /* Capacitor's native layer registers plugins on window at runtime, which is
     why this file still needs no bundler and no build step. */
  function plugin(){
    var c = window.Capacitor;
    if(!c || !c.isNativePlatform || !c.isNativePlatform()) return null;
    return (c.Plugins && c.Plugins.AdMob) || null;
  }

  /* The one place ad unit ids live. iOS and Android are two separate apps in
     the AdMob console with two separate sets of units, and Capacitor is what
     tells us which of them we are running as.

     An empty LIVE id falls back to Google's sample unit for that slot and asks
     the SDK for a test ad. That is deliberately also what a half-configured
     build does: the failure mode of a missing id is test ads, not real ads
     served to nobody, and never a real impression raised by whoever is holding
     the debug build. */
  var LIVE = {
    ios:     { rewarded:     "ca-app-pub-2195840682659233/2367859560",
               interstitial: "ca-app-pub-2195840682659233/7394534542",
               banner:       "ca-app-pub-2195840682659233/5425267746" },
    android: { rewarded:     "ca-app-pub-2195840682659233/9292360564",
               interstitial: "ca-app-pub-2195840682659233/1803743625",
               banner:       "ca-app-pub-2195840682659233/2990676094" }
  };

  /* Google's own sample units. They serve a test ad to anybody who asks. */
  var TEST = {
    rewarded:     "ca-app-pub-3940256099942544/5224354917",
    interstitial: "ca-app-pub-3940256099942544/1033173712",
    banner:       "ca-app-pub-3940256099942544/6300978111"
  };

  /* The unit to ask for and whether to flag the request as a test, which are
     one decision and not two: a real unit id with isTesting true earns nothing,
     and a sample unit with it false is a malformed request that gets no fill.
     Returning them together is what stops those two drifting apart.

     A development build, the kind installed straight from the Mac, always asks
     for Google's test ads. Real ones do not fill until the store listing
     exists, so the banner could not be judged on a phone, and a real ad shown
     to the person building the game is exactly the traffic AdMob closes
     accounts over. Capacitor sets DEBUG in debug builds only; a release
     build, the one the stores get, asks for the real units. */
  function unit(kind){
    var c = window.Capacitor;
    var os = (c && c.getPlatform && c.getPlatform()) || "";
    var live = !(c && c.DEBUG) && (LIVE[os] || {})[kind];
    return live ? {adId: live,        isTesting: false}
                : {adId: TEST[kind],  isTesting: true};
  }

  /* Resolves true when ads may be requested. False covers two things that look
     alike and are not: the consent step failed (consentError is set, and
     another go is worth having), or it worked and the answer is that no ad may
     be requested (consentError stays null, and asking again would only nag). */
  function init(){
    if(inflight) return inflight;
    var p = plugin();
    if(!p) return Promise.resolve(false);
    inflight = Promise.resolve()
      /* The plugin wires its consent code up inside initialize(), so this has to
         come first. No ad is requested until the consent step below has said
         it may be. */
      .then(function(){ return started ? null : p.initialize() })
      /* An ad is part of the game's sound: if the speaker is off, Google's
         SDK is told the app is muted, so a video ad starts silent. */
      .then(function(){
        started = true;
        try{ return p.setApplicationMuted({muted: !soundOn}).catch(function(){}) }catch(e){}
      })
      /* Consent first, before a single request goes out. Outside the UK and
         EEA this answers NOT_REQUIRED and costs one round trip; inside it is
         the law, and AdMob will not serve without it. */
      .then(function(){ return p.requestConsentInfo() })
      .then(function(info){
        note(info);
        if(info && info.isConsentFormAvailable && info.status === "REQUIRED"){
          return p.showConsentForm().then(note);
        }
      })
      .then(answer)
      /* iOS App Tracking Transparency. Android settles immediately, and a
         refusal here is fine — it means non-personalised ads, not no ads.
         Never after a no on the form: asking twice is what App Review rejects
         under 5.1.1(iv), and an unasked ATT already means no tracking. Nor when
         no ad may be requested at all, since there is nothing to track for. */
      .then(function(){ return allowed ? p.trackingAuthorizationStatus() : null })
      .then(function(t){
        if(!refused && t && t.status === "notDetermined") return p.requestTrackingAuthorization();
      })
      .then(function(){
        consentError = null;
        /* The SDK's own verdict on whether an ad request may go out. A player in
           the EEA who switched every purpose off gets false here, and that is
           the one case where asking for a banner anyway breaks Google's EU
           consent policy. The hint button then simply behaves as it always has. */
        // Keep the existing ads working while dashboard identifiers are blank.
        // Once configured, LevelPlay owns every banner/rewarded ad request.
        if(allowed && HKKLevelPlay.configured())return HKKLevelPlay.initialize().then(function(ok){ready=ok;if(!ok)consentError="LevelPlay initialization failed";return ok});
        ready = allowed;
        return ready;
      })
      .catch(function(e){
        ready = false;
        consentError = (e && (e.message || e.errorMessage)) || "consent step failed";
        return false;
      })
      .then(function(ok){ inflight = null; return ok });
    return inflight;
  }

  /* Always settles, with one of three words:
       "earned"   the player watched it through
       "skipped"  an ad was on screen and they closed it first
       "none"     there was no ad to show: no plugin, no fill, a failure
     Only "skipped" is the player's doing, which is why it is not folded into
     "none": a hint is owed to somebody on a bad connection and not to somebody
     who closed the ad.

     The plugin resolves showRewardVideoAd only when the reward is earned, on
     both platforms. A player who closed the ad early left that promise pending
     for good, the "Finding an ad" toast on screen, and the clock not handed back.
     The dismissed and failed-to-show events are what end it. */
  function rewarded(){
    if(HKKLevelPlay.configured())return ready ? HKKLevelPlay.rewarded() : Promise.resolve("none");
    var p = plugin();
    if(!p || !ready) return Promise.resolve("none");
    return new Promise(function(resolve){
      var handles = [], settled = false, showing = false;
      function finish(word){
        if(settled) return;
        settled = true;
        clearTimeout(cap);
        handles.forEach(function(h){ try{ h.remove() }catch(e){} });
        resolve(word);
      }
      function on(name, fn){
        try{
          Promise.resolve(p.addListener(name, fn))
            .then(function(h){ if(settled) { try{ h.remove() }catch(e){} } else handles.push(h) })
            .catch(function(){});
        }catch(e){}
      }
      /* the reward is always reported before the close; the beat is for a bridge
         that delivers the two the wrong way round */
      on("onRewardedVideoAdDismissed", function(){
        if(showing) setTimeout(function(){ finish("skipped") }, 400);
      });
      on("onRewardedVideoAdFailedToShow", function(){ finish("none") });
      on("onRewardedVideoAdReward", function(){ finish("earned") });
      /* nothing in here may leave the toast up for good */
      var cap = setTimeout(function(){ finish("none") }, 5 * 60 * 1000);

      p.prepareRewardVideoAd(unit("rewarded"))
        .then(function(){ showing = true; return p.showRewardVideoAd() })
        .then(function(item){ finish(item ? "earned" : "none") })
        .catch(function(){ finish("none") });
    });
  }

  /* The layout has always reserved #adslot, so the banner has somewhere to
     land and nothing moves when it arrives. All this does is make the reserved
     height agree with the height the network actually served — adaptive banners
     are taller on a wide screen, and a slot that guesses wrong either clips the
     ad or leaves a stripe of dead paper under it. A hidden, removed or failed
     banner reports zero, which collapses the slot on its own. */
  function setAdSpace(h){
    var root = document.documentElement.style;
    root.setProperty("--ad-h", h > 0 ? h + "px" : "0px");
    root.setProperty("--ad-clear", h > 0 ? h + "px" : "0px");
    /* the banner's height plus the safe-area strip it sits above (see :root) */
    root.setProperty("--ad-foot", h > 0 ? "calc(" + h + "px + env(safe-area-inset-bottom))" : "0px");
  }
  function banner(){
    if(HKKLevelPlay.configured())return ready ? HKKLevelPlay.banner(function(size){
      var h=(size&&size.height)||0;
      setAdSpace(h);
      app.classList.toggle("no-ads",h<=0);fitMenu(true);
    }) : Promise.resolve(false);
    var p = plugin();
    if(!p || !ready) return Promise.resolve(false);
    try{
      p.addListener("bannerAdSizeChanged", function(size){
        var h = (size && size.height) || 0;
        /* overlays are drawn over the whole screen and the banner is a native
           view on top of them, so they need to know to keep clear of it */
        setAdSpace(h);
        app.classList.toggle("no-ads", h <= 0);
        fitMenu(true);
      });
    }catch(e){}
    var u = unit("banner");
    return p.showBanner({
      adId: u.adId,
      isTesting: u.isTesting,
      position: "BOTTOM_CENTER",
      margin: 0
    }).then(function(){ return true }).catch(function(){
      /* No fill is the common case, not an error. Give the space back. */
      app.classList.add("no-ads");
      setAdSpace(0);
      return false;
    });
  }

  // Full-screen ads remain opt-in through hints.
  function interstitial(){return Promise.resolve(false)}

  return {
    init: init,
    banner: banner,
    rewarded: rewarded,
    interstitial: interstitial,
    native: function(){ return !!plugin() },
    isReady: function(){ return ready },
    /* true when the consent step itself broke, as opposed to ending in a no:
       the one case where trying again later is worth doing */
    failed: function(){ return consentError !== null },
    /* the speaker button, passed on to the ads */
    muted: function(m){
      var p = plugin();
      if(p) try{ p.setApplicationMuted({muted: !!m}).catch(function(){}) }catch(e){}
    },
    /* the Credits screen asks before it draws the button: outside the UK and
       EEA there is no form to reopen, and an entry point to nothing is worse
       than none at all */
    canShowPrivacyOptions: function(){ return !!(plugin() && privacyOpts) },
    /* what the consent step decided about measurement, for MEASURE to act on */
    measurementAllowed: function(){ return measure },
    state: function(){
      return {provider:HKKLevelPlay.configured()?"LevelPlay":"AdMob",native: !!plugin(), ready: ready, measure: measure, refused: refused,
              status: status, canRequestAds: allowed,
              privacyOptions: privacyOpts, consentError: consentError};
    },
    /* Resolves true once the form has closed and the new answer is read, so
       measurementAllowed() is current again for whoever passes it on. */
    showPrivacyOptions: function(){
      var p = plugin();
      if(!p || !privacyOpts) return Promise.resolve(false);
      ready=false;
      var stop=HKKLevelPlay.configured()?HKKLevelPlay.removeBanner():p.removeBanner();
      return Promise.resolve(stop).catch(function(){})
        .then(function(){return p.showPrivacyOptionsForm()})
        .then(function(){return p.requestConsentInfo()}).then(note).then(answer)
        .then(function(){return allowed&&HKKLevelPlay.configured()?HKKLevelPlay.initialize():allowed})
        .then(function(ok){ready=!!ok;return banner()})
        .then(function(){return true}).catch(function(){allowed=false;measure=false;return false});
    },
    /* what this build would actually ask for, so a device can be checked
       without guessing which set of ids it was compiled with */
    units: function(){
      if(HKKLevelPlay.configured())return HKKLevelPlay.units();
      return {banner: unit("banner"), interstitial: unit("interstitial"),
              rewarded: unit("rewarded")};
    }
  };
})();

/* ========================== 7b. what gets counted ==========================
   Firebase Analytics, and a deliberately short list of things to send it: how
   many nights are started, how many are finished, how long they took, how often
   somebody needed a hint, and which screens get opened. Enough to tell whether
   the game is being played and where it loses people; nothing that describes
   the person playing. Names typed for the board are never sent here.

   Collection is switched OFF in both native configs and only turned on once the
   consent step has spoken, so a player in the EEA or the UK who refuses is not
   counted while the form is still on screen. Off-device the whole module is a
   no-op, exactly like the ads. */
var MEASURE = (function(){
  var on = false, decided = false, queue = [];
  var QMAX = 40;

  function plugin(){
    var c = window.Capacitor;
    if(!c || !c.isNativePlatform || !c.isNativePlatform()) return null;
    return (c.Plugins && c.Plugins.FirebaseAnalytics) || null;
  }

  /* The first house is dealt behind the menu, long before the consent round
     trip comes back, so the night the player is actually looking at would be
     the one night never counted. Anything logged before the answer waits in
     here instead: sent if the answer is yes, thrown away if it is no. */
  function hold(kind, name, params){
    if(queue.length < QMAX) queue.push({kind: kind, name: name, params: params});
  }

  function flush(){
    var q = queue; queue = [];
    if(!on) return;
    q.forEach(function(it){
      if(it.kind === "screen") screen(it.name); else event(it.name, it.params);
    });
  }

  function init(allowed){
    var p = plugin();
    if(!p){ queue = []; decided = true; return Promise.resolve(false) }
    on = !!allowed;
    return p.setConsent({type:"ANALYTICS_STORAGE", status: on ? "GRANTED" : "DENIED"})
      .then(function(){ return p.setEnabled({enabled: on}) })
      .then(function(){ decided = true; flush(); return on })
      /* A counter that throws is still only a counter: the game does not care
         and must never find out. Nothing held is sent, because nothing here
         knows any more whether it was allowed to be. */
      .catch(function(){ on = false; decided = true; queue = []; return false });
  }

  function event(name, params){
    var p = plugin();
    if(!p) return;
    if(!decided){ hold("event", name, params); return }
    if(!on) return;
    try{
      var r = p.logEvent({name: name, params: params || {}});
      if(r && r.catch) r.catch(function(){});
    }catch(e){}
  }

  function screen(name){
    var p = plugin();
    if(!p) return;
    if(!decided){ hold("screen", name); return }
    if(!on) return;
    try{
      var r = p.setCurrentScreen({screenName: name});
      if(r && r.catch) r.catch(function(){});
    }catch(e){}
  }

  return {init: init, event: event, screen: screen,
          /* for a look at the plumbing on a device, where there is no console */
          state: function(){
            return {native: !!plugin(), on: on, decided: decided, held: queue.length};
          }};
})();

/* ============================ 8. the record player ============================
   Two pieces by Kevin MacLeod, credited on the Credits screen as CC BY 4.0
   requires. Everything else this game makes a noise with is synthesised on the
   spot; these are the only two files it ships, so they are treated as a luxury
   and never as a dependency. Nothing waits for them, nothing breaks without
   them, and they are not fetched at all until a real gesture says the player is
   here — which is also the only moment a browser will let them play. */
var MUSIC = (function(){
  var SRC = {menu:"audio/late-night-radio.mp3", play:"audio/evening.mp3"};
  var VOL = 0.34;                       /* under the game, not over it */
  var els = {}, wanted = null, unlocked = false;

  function make(key){
    if(els[key]) return els[key];
    var a = new Audio();
    a.src = SRC[key];
    a.loop = true;
    a.preload = "none";                 /* 3MB is not a launch cost */
    a.volume = 0;
    els[key] = a;
    return a;
  }

  /* Volume rather than pause, so a track that is already in the player's ear
     leaves gently instead of being cut off mid-bar. */
  function fade(a, to, ms, thenPause){
    if(a.__f) cancelAnimationFrame(a.__f);
    var from = a.volume, t0 = performance.now();
    (function step(now){
      var t = Math.min(1, (now - t0) / ms);
      try{ a.volume = from + (to - from) * t }catch(e){}
      if(t < 1){ a.__f = requestAnimationFrame(step); return }
      a.__f = null;
      if(thenPause && to === 0){ try{ a.pause() }catch(e){} }
    })(t0);
  }

  function apply(){
    for(var k in els){
      if(k !== wanted && !els[k].paused) fade(els[k], 0, 600, true);
    }
    if(!wanted || !soundOn || !unlocked) return;
    var a = make(wanted);
    if(a.paused){
      a.volume = 0;
      /* A refused play() is a normal outcome, not an error: no gesture yet, a
         locked tab, a phone on a call. Try again at the next state change. */
      var pr = a.play();
      if(pr && pr.catch) pr.catch(function(){});
    }
    fade(a, VOL, 900);
  }

  return {
    /* the first real gesture is both the browser's condition and ours */
    unlock: function(){ unlocked = true; apply() },
    to: function(key){ if(wanted !== key){ wanted = key; apply() } },
    refresh: apply
  };
})();

/* ===================== 8b. the name filter =====================
   A board name is the one piece of free text this game publishes, and it is
   shown to every player who opens Ranks. This is the port of NameFilter from
   the Unity games, so the household rule is the same wherever a name is typed:

     1. a character whitelist — anything outside [A-Za-z0-9 _-.] is dropped
     2. a word list — matched on a letters-only collapsed form, so spacing and
        basic leet ("sh1t", "f u c k") do not get a name past it

   The whitelist is the half that matters most here. This game is an unminified
   page, so the console can call RANKS.name() straight past everything below;
   the same whitelist is therefore repeated in firestore.rules, which is the
   only copy a modified client cannot talk its way around. The word list stays
   here alone because rules have no collapsed form to match against — it is a
   politeness filter, not a border. */
var NAMES = (function(){
  var MAX    = 16;
  var STRIP  = /[^A-Za-z0-9 _\-.]/g;
  var LETTER = /[^a-z]/g;
  /* Its own un-global twin: .test() on a /g regex carries lastIndex between
     calls, which quietly lets every other character through. */
  var ONE    = /^[A-Za-z0-9 _\-.]$/;

  /* Digits and symbols people substitute for letters, undone before the word
     list runs so "5h1t" is read as what it is. Only ever applied to the copy
     being tested — never to the name that gets stored. */
  var LEET = {"0":"o", "1":"i", "3":"e", "4":"a", "5":"s", "7":"t", "8":"b"};

  /* Matched anywhere in the collapsed form: long enough, and odd enough, that
     they do not turn up inside a name somebody actually has. */
  var BANNED = [
    "fuck", "motherfuck", "shit", "bullshit", "bitch", "asshole", "arsehole",
    "nigger", "nigga", "faggot", "whore", "slut", "bastard", "retard",
    "wank", "twat"
  ];

  /* The rest match only as a word of their own, because as substrings they eat
     innocent names: "ass" lives inside Cassie, "cunt" inside Scunthorpe, and
     "pussy" inside Pussycat, which in this of all games is a name somebody is
     going to want. */
  var BANNED_WORD = ["ass", "arse", "cunt", "pussy", "fag", "cock", "dick",
                     "piss", "sex", "anus"];

  function sanitize(v){
    return String(v == null ? "" : v).replace(STRIP, "").trim().slice(0, MAX);
  }

  function allowedChar(c){ return ONE.test(c) }

  function rude(v){
    var name = sanitize(v).toLowerCase().replace(/[01345780]/g, function(c){
      return LEET[c] || c;
    });
    var collapsed = name.replace(LETTER, "");
    var i;
    for(i = 0; i < BANNED.length; i++){
      if(collapsed.indexOf(BANNED[i]) !== -1) return true;
    }
    var words = name.split(/[^a-z]+/);
    for(i = 0; i < BANNED_WORD.length; i++){
      if(collapsed === BANNED_WORD[i]) return true;
      if(words.indexOf(BANNED_WORD[i]) !== -1) return true;
    }
    return false;
  }

  /* null when the name is fine, otherwise the sentence to show under the box. */
  function reject(v){
    var name = sanitize(v);
    if(!/[A-Za-z0-9]/.test(name)) return "A name needs a letter or a number in it.";
    if(rude(name)) return "That one is not going on the board. Try another.";
    return null;
  }

  /* Names already stored before this filter existed, or written by a client
     that went around it, still have to be drawn. Anything that fails now is
     shown as a cat rather than repeated. */
  function display(v){
    var name = sanitize(v);
    return (!name || rude(name)) ? "Someone" : name;
  }

  return {MAX:MAX, sanitize:sanitize, allowedChar:allowedChar, rude:rude,
          reject:reject, display:display};
})();

/* ===================== 8c. the regulars =====================
   A board with nobody on it makes a game look empty, so each one starts with a
   few regulars, the way Astro-X seeds its boards with rivals: somebody to climb
   past on the first day, and the board is never a blank page. Every row is a
   function of the date alone, so every device draws the identical board, and
   nothing is written anywhere: real players are merged in as they join and push
   the regulars off one at a time until there are none left.
   What keeps them from looking made up: scores are never round, the names are
   ordinary handles, the Most found regulars each have a pace and a day they
   started, so they grow day by day instead of sitting still, and the Speed run
   ones are re-drawn from the pool every day. */
var RIVAL_NAMES = [
  "Mochi_Mum", "TabbyTom", "catlady.jen", "Whiskers88", "NoodleFan", "sleepy.biscuit",
  "PawsOnPaper", "LunaLoaf", "Mr Pickles", "FelixF", "kittykat77", "Tiny_Tigress",
  "MarmaladeMax", "ShadowKit", "PuddingPaws", "Crumpet_Kim", "DuchessD", "SixpenceSam",
  "RumbleRoo", "BiscuitBea", "Purrfessor", "NapTimeNat", "CosyCorner", "WoolBallWill",
  "Teapot.Tess", "RainyDayRiz", "InkyTheCat", "Hazel and Co", "SofaSurfer", "LittleLeo",
  "PeachyPaws", "OldTomcat", "Moonbeam_M", "ClaraCat", "SleepyJoe", "DotTheTabby",
  "Whisper_W", "ButterbeanB", "GingerGus", "Pebble.Paws", "MrsMittens", "CatNapCarl",
  "Fluffernut", "YarnYasmin", "Toastie_T", "Pip and Poppy", "TwilightTab", "CuriousCleo",
  "SnugglesS", "HeathersCats"
];
var FOUND_REGULARS = 24, SPEED_REGULARS = 8;

/* a small seeded generator, so a given day always draws the same board */
function seeded(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(list, rnd){
  var a = list.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* Most found: each regular has a fixed name, a pace (finds a day, from about
   fourteen at the top down to a few), a day they joined in the fortnight before
   the daily route began, so nobody starts from nothing, and how many of their
   days they actually play. `keep` of them are returned,
   dropped in a fixed order that has nothing to do with their score. */
function rivalsFound(day, keep){
  var rnd = seeded(0x4b1d), names = shuffled(RIVAL_NAMES, rnd), rows = [], i;
  for(i = 0; i < FOUND_REGULARS; i++){
    var pace = 2.5 + 11.5 * Math.pow(1 - i / (FOUND_REGULARS - 1), 1.4);
    var from = 270 + Math.floor(rnd() * 14);
    var plays = 0.55 + rnd() * 0.4, wobble = 0.94 + rnd() * 0.12;
    rows.push({name:names[i], total:Math.round(pace * wobble * plays * Math.max(0, day - from + 1))});
  }
  var order = shuffled(rows.map(function(r, k){ return k }), rnd).slice(0, Math.max(0, keep));
  return rows.filter(function(r, k){ return order.indexOf(k) >= 0 && r.total > 0 });
}
/* Speed run: a handful of times for the day's house, spread from quick to
   leisurely with a hint or two here and there (a hint is fifteen seconds on
   the clock), and a different handful of names every day. */
function rivalsSpeed(day, keep){
  var rnd = seeded(day * 7919 + 17), names = shuffled(RIVAL_NAMES, rnd);
  var base = [105, 150, 190, 240, 300, 380, 470, 600], spread = [45, 60, 70, 90, 110, 140, 160, 200];
  var rows = base.map(function(b, i){
    var r = rnd(), hints = r < 0.62 ? 0 : r < 0.88 ? 1 : 2;
    return {name:names[i], hints:hints, secs:Math.round(b + rnd() * spread[i]) + hints * 15};
  });
  var order = shuffled(rows.map(function(r, k){ return k }), rnd).slice(0, Math.max(0, keep));
  return rows.filter(function(r, k){ return order.indexOf(k) >= 0 })
             .sort(function(x, y){ return x.secs - y.secs });
}

/* ========================= 9. the boards =========================
   Two of them, and neither is the point of the game.

   The normal-play board ranks cats found and bonus things found, added up over
   every daily search somebody has played. It is a tally of looking, so nothing
   in it rewards hurrying, and anybody can climb it by turning up.
   The speed board is the clock, for the people who want one: every player has a
   name (CatFinder and a number to start with), and it puts their time on the
   board automatically. Everybody plays
   the same generated house on the same day, so a time is only comparable inside
   one house number, which is why those scores live under /boards/{house}.

   Neither is ever shown empty: each starts with the regulars from section 8c,
   and real players are merged in and take their places. The player's own rank is
   on the panel regardless, and does not need anyone else.

   No Firebase SDK. The SDK is about 100KB and would be the first framework in
   a game whose credits claim there isn't one; the REST endpoints it would
   wrap are a POST and a PATCH. Everything here is fetch, and the whole module
   is optional: if the network is out, or the project is misconfigured, or the
   player has never set a name, the game carries on exactly as it did before
   there was a board. */
var RANKS = (function(){
  var KEY  = "AIzaSyA4TOo4JZr57lRbQL15M7lAX4TJvee9GBk";
  var PROJ = "cat-attack-game";
  var DB   = "https://firestore.googleapis.com/v1/projects/" + PROJ +
             "/databases/(default)/documents";
  var LS   = "wtc-board";
  /* House #283 is the first of the daily route. Nothing counts from before it,
     and firestore.rules refuses a start day earlier than this. */
  var LAUNCH_DAY = 283;

  function load(){ try{ return JSON.parse(localStorage.getItem(LS)) || {} }catch(e){ return {} } }
  function save(v){ try{ localStorage.setItem(LS, JSON.stringify(v)) }catch(e){} }

  function jf(url, opts){
    return fetch(url, opts).then(function(r){
      return r.json().then(function(j){
        if(j && j.error) throw new Error(j.error.message || "request failed");
        return j;
      });
    });
  }

  /* One anonymous account per install, kept in localStorage. It is not a login:
     it exists so the rules can say "you may only ever write your own row". */
  function auth(){
    var st = load();
    if(st.idToken && st.exp && Date.now() < st.exp - 60000){
      return Promise.resolve(st);
    }
    if(st.refreshToken){
      return jf("https://securetoken.googleapis.com/v1/token?key=" + KEY, {
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"grant_type=refresh_token&refresh_token=" + encodeURIComponent(st.refreshToken)
      }).then(function(j){
        st.idToken = j.id_token; st.refreshToken = j.refresh_token;
        st.uid = j.user_id || st.uid;
        st.exp = Date.now() + (parseInt(j.expires_in,10) || 3600) * 1000;
        save(st); return st;
      }).catch(function(){ st.refreshToken = null; save(st); return auth() });
    }
    return jf("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + KEY, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({returnSecureToken:true})
    }).then(function(j){
      st.idToken = j.idToken; st.refreshToken = j.refreshToken; st.uid = j.localId;
      st.exp = Date.now() + (parseInt(j.expiresIn,10) || 3600) * 1000;
      save(st); return st;
    });
  }

  /* Everybody has a name from the first time anything asks for it: CatFinder and
     four digits, which they can change on the Ranks screen. It is what puts a
     player on the boards, finds and time both, from their first daily search, so
     nobody has to join anything. The filter reads digits as the letters they
     resemble, so a handful of numbers (2455 reads as "ass") are refused; the draw
     is repeated until it gets one that is not. */
  function name(v){
    var st = load();
    if(v === undefined){
      if(!st.name){
        var fresh;
        do { fresh = "CatFinder" + (1000 + Math.floor(Math.random() * 9000)) } while(NAMES.rude(fresh));
        st.name = fresh;
        st.auto = true;
        save(st);
      }
      return st.name;
    }
    /* The setter is the last gate before a name is stored or sent, so it
       filters rather than trusting the panel to have done it. A name that
       cannot pass is not saved at all. */
    var clean = NAMES.sanitize(v);
    if(!clean || NAMES.rude(clean)) return st.name || "";
    st.name = clean;
    st.auto = false;
    save(st);
    return st.name;
  }

  /* what the game has counted for this player, from the daily searches only */
  function mine(){
    var st = loadStats();
    var cats = st.catTotal || 0, things = st.thingTotal || 0;
    return {cats:cats, things:things, total:cats + things,
            since:Math.max(LAUNCH_DAY, st.firstDay === undefined ? houseNo : st.firstDay)};
  }

  function iso(){ return new Date().toISOString().replace(/\.\d+Z$/, "Z") }
  function num(f){ return parseInt((f && f.integerValue) || "0", 10) }
  function str(f){ return (f && f.stringValue) || "\u2014" }
  function isMe(docName, uid){ return docName.slice(-(uid.length + 1)) === "/" + uid }

  function ask(path, body){
    return auth().then(function(st){
      return jf(DB + path, {
        method:"POST",
        headers:{"Authorization":"Bearer " + st.idToken, "Content-Type":"application/json"},
        body:JSON.stringify(body)
      }).then(function(res){ return {uid:st.uid, res:res} });
    });
  }

  /* how many documents match, without downloading them */
  function count(parent, coll, where){
    return ask(parent + ":runAggregationQuery", {structuredAggregationQuery:{
      structuredQuery:{from:[{collectionId:coll}], where:where},
      aggregations:[{alias:"n", count:{}}]
    }}).then(function(a){
      var f = a.res && a.res[0] && a.res[0].result && a.res[0].result.aggregateFields;
      return num(f && f.n);
    });
  }

  /* The finds go up for anybody with a name, and only when they have changed
     since the last time. Nobody is put on a public list because they happened
     to play. */
  function sync(){
    var who = name(), t = mine();
    if(!who || NAMES.rude(who) || !t.total) return Promise.resolve(false);
    var sig = who + "|" + t.cats + "|" + t.things;
    if(load().sent === sig) return Promise.resolve(true);
    return auth().then(function(st){
      return jf(DB + "/players/" + st.uid, {
        method:"PATCH",
        headers:{"Authorization":"Bearer " + st.idToken, "Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          name:   {stringValue: who},
          since:  {integerValue: String(t.since)},
          cats:   {integerValue: String(t.cats)},
          things: {integerValue: String(t.things)},
          total:  {integerValue: String(t.total)},
          at:     {timestampValue: iso()}
        }})
      });
    }).then(function(){
      var st = load(); st.sent = sig; save(st);
      return true;
    }).catch(function(){ return false });
  }

  /* A time is posted only for somebody who has given a name. */
  function submit(secs, hints, day){
    var who = name();
    if(!who || NAMES.rude(who)) return Promise.resolve(false);
    if(!(secs >= 10 && secs <= 3600)) return Promise.resolve(false);
    return auth().then(function(st){
      return jf(DB + "/boards/" + day + "/scores/" + st.uid, {
        method:"PATCH",
        headers:{"Authorization":"Bearer " + st.idToken, "Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          name:  {stringValue: who},
          secs:  {integerValue: String(Math.round(secs))},
          hints: {integerValue: String(Math.max(0, Math.min(30, hints|0)))},
          at:    {timestampValue: iso()}
        }})
      });
    }).then(function(){ return true }).catch(function(){ return false });
  }

  function rowsOf(res, uid, read){
    return (res || []).filter(function(r){ return r.document }).map(function(r){
      var row = read(r.document.fields || {});
      row.me = isMe(r.document.name, uid);
      return row;
    });
  }

  /* Normal play: cats and bonus things found, most first, with the regulars
     standing in for whoever has not joined yet. Outside the top twenty your own
     place is worked out and handed back, so the board never leaves you looking
     for yourself. null only when the network said no. */
  function found(){
    return count("", "players").then(function(n){
      var regulars = rivalsFound(houseNo, FOUND_REGULARS - n);
      var t = mine(), who = name();
      return (n ? ask(":runQuery", {structuredQuery:{
        from:[{collectionId:"players"}],
        orderBy:[{field:{fieldPath:"total"}, direction:"DESCENDING"}],
        limit:20
      }}).then(function(a){
        return rowsOf(a.res, a.uid, function(f){ return {name:str(f.name), total:num(f.total)} });
      }) : Promise.resolve([])).then(function(real){
        /* real players first, so on a tie the person outranks the regular */
        var all = real.concat(regulars.map(function(r){ return {name:r.name, total:r.total, me:false} }))
                      .sort(function(x, y){ return y.total - x.total });
        var mineAt = all.findIndex(function(r){ return r.me });
        var out = {rows:all.slice(0, 20), you:null};
        if(!who || !t.total || (mineAt >= 0 && mineAt < 20)) return out;
        if(mineAt >= 20){
          out.you = {rank:mineAt + 1, name:who, total:t.total};
          return out;
        }
        return count("", "players", {fieldFilter:{
          field:{fieldPath:"total"}, op:"GREATER_THAN", value:{integerValue:String(t.total)}
        }}).then(function(ahead){
          var passed = regulars.filter(function(r){ return r.total > t.total }).length;
          var rank = ahead + passed + 1;
          /* a place inside the twenty is shown in its place, not as a row stuck on the end */
          if(rank <= 20){
            out.rows.splice(rank - 1, 0, {name:who, total:t.total, me:true});
            out.rows = out.rows.slice(0, 20);
          } else {
            out.you = {rank:rank, name:who, total:t.total};
          }
          return out;
        });
      });
    }).catch(function(){ return null });
  }

  /* Speed: today's house only, quickest first, the regulars filling in for
     whoever has not finished yet. Your own time is placed the same way as on the
     other board: in its place inside the twenty, or a row under the list. */
  function quickest(){
    var day = houseNo, parent = "/boards/" + day;
    return count(parent, "scores").then(function(n){
      var regulars = rivalsSpeed(day, SPEED_REGULARS - n);
      var who = name(), run = who && todaysRun();
      return (n ? ask(parent + ":runQuery", {structuredQuery:{
        from:[{collectionId:"scores"}],
        orderBy:[{field:{fieldPath:"secs"}, direction:"ASCENDING"}],
        limit:20
      }}).then(function(a){
        return rowsOf(a.res, a.uid, function(f){ return {name:str(f.name), secs:num(f.secs), hints:num(f.hints)} });
      }) : Promise.resolve([])).then(function(real){
        var all = real.concat(regulars.map(function(r){ return {name:r.name, secs:r.secs, hints:r.hints, me:false} }))
                      .sort(function(x, y){ return x.secs - y.secs });
        var mineAt = all.findIndex(function(r){ return r.me });
        var out = {rows:all.slice(0, 20), you:null};
        if(!run || (mineAt >= 0 && mineAt < 20)) return out;
        if(mineAt >= 20){
          out.you = {rank:mineAt + 1, name:who, secs:run.secs, hints:run.hints};
          return out;
        }
        return count(parent, "scores", {fieldFilter:{
          field:{fieldPath:"secs"}, op:"LESS_THAN", value:{integerValue:String(Math.round(run.secs))}
        }}).then(function(ahead){
          var passed = regulars.filter(function(r){ return r.secs < run.secs }).length;
          var rank = ahead + passed + 1;
          if(rank <= 20){
            out.rows.splice(rank - 1, 0, {name:who, secs:run.secs, hints:run.hints, me:true});
            out.rows = out.rows.slice(0, 20);
          } else {
            out.you = {rank:rank, name:who, secs:run.secs, hints:run.hints};
          }
          return out;
        });
      });
    }).catch(function(){ return null });
  }

  return {name:name, mine:mine, sync:sync, submit:submit,
          found:found, quickest:quickest};
})();

/* ========================= 10. spreading the word =========================
   A game with no advertising budget has to bring its own players, and the way
   it does that is by being worth passing on and worth coming back to:

     share     what a finished night sends has a link and a picture in it, and a
               cat's page can be sent on its own;
     reminders one quiet notification a day, if the player says yes, written from
               the day's own search (which is known days ahead, so nothing here
               needs a server);
     review    the store's own prompt, asked once at a moment that has gone well;
     more      the other games, from the same list every one of them reads.

   Everything native goes through the plugins by name and does nothing in a
   browser, so the web build and the apps are the same page. */
var GROW = (function(){
  /* Where a shared result points: the browser build, which anybody can open
     without installing anything, and which says where the apps are once they
     are live. */
  var SHARE_URL  = "https://lancecabson.github.io/hkk/";
  var SHARE_SHOW = "lancecabson.github.io/hkk";
  var STORE = {
    ios:     "https://apps.apple.com/app/id6813514866",
    android: "https://play.google.com/store/apps/details?id=com.iphonegamesapps.herekittykitty"
  };
  /* Flip this when the apps are in the stores: until then the browser build
     does not advertise pages that do not exist yet. */
  var STORE_LIVE = false;
  var APP_ID   = "com.iphonegamesapps.herekittykitty";

  /* ---------- sharing ---------- */
  function canShare(){
    return !!plugin("Share") || !!(navigator.share && /Mobi|Android/i.test(navigator.userAgent));
  }
  function dataFile(url, name){
    var p = url.split(","), mime = p[0].match(/:(.*?);/)[1], bin = atob(p[1]), n = bin.length, a = new Uint8Array(n);

  /* o: {text, title, png (a data URL, optional)}. Resolves "shared", "copied", "cancelled" or "failed". */
  function share(o){
    var text = o.text, url = SHARE_URL, title = o.title || "Here Kitty Kitty";
    var Share = plugin("Share"), Fs = plugin("Filesystem");
    MEASURE.event("share", {what: o.what || "result", picture: o.png ? 1 : 0});
    if(Share){
      var plain = function(){ return Share.share({title:title, text:text, url:url, dialogTitle:"Share"}) };
      if(o.png && Fs){
        return Fs.writeFile({path:"hkk-share-" + Date.now() + ".png", data:o.png.slice(o.png.indexOf(",") + 1), directory:"CACHE"})
          .then(function(r){ return Share.share({title:title, text:text + "\n" + url, files:[r.uri], dialogTitle:"Share"}) })
          .then(function(){ return "shared" })
          .catch(function(e){
            if(/cancel/i.test(String(e && e.message))) return "cancelled";
            return plain().then(function(){ return "shared" }).catch(function(){ return "cancelled" });
          });
      }
      return plain().then(function(){ return "shared" }).catch(function(){ return "cancelled" });
    }
    var file = null;
    try{
      if(o.png){
        var f = dataFile(o.png, "here-kitty-kitty.png");
        if(navigator.canShare && navigator.canShare({files:[f]})) file = f;
      }
    }catch(e){}
    if(file && navigator.share){
      return navigator.share({files:[file], text:text + "\n" + url, title:title})
        .then(function(){ return "shared" }).catch(function(){ return "cancelled" });
    }
    if(navigator.share && /Mobi|Android/i.test(navigator.userAgent)){
      return navigator.share({text:text, url:url, title:title})
        .then(function(){ return "shared" }).catch(function(){ return "cancelled" });
    }
    return navigator.clipboard.writeText(text + "\n" + url)
      .then(function(){ return "copied" }).catch(function(){ return "failed" });
  }

  /* ---------- picture cards ----------
     A card is drawn rather than screenshotted, so it is always the right shape
     (4:5 fits every feed) and never has a button or a scrollbar in it. */
  var INK = "#2B2430", PAPER = "#FFF4DC", PINK = "#E0455F", AMBER = "#F2B33D", BLUE = "#3B6FD8";
  function font(px, w){ return (w || 800) + " " + px + 'px "Dela Gothic One","Zen Maru Gothic",system-ui,sans-serif' }
  function loadFonts(){
    if(!(document.fonts && document.fonts.load)) return Promise.resolve();
    return Promise.all([document.fonts.load('60px "Dela Gothic One"'), document.fonts.load('700 40px "Zen Maru Gothic"')]).catch(function(){});
  }
  function svgImage(xml){
    return new Promise(function(res, rej){
      var im = new Image();
      im.onload = function(){ res(im) }; im.onerror = rej;
      im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
    });
  }
  function headXml(kind, px){
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '" viewBox="0 0 104 104">' +
      HKKCatArt.renderHead(kind, CATS[kind].coat, "found", 3) + '</svg>';
  }
  function base(w, h){
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var x = c.getContext("2d");
    x.fillStyle = PAPER; x.fillRect(0, 0, w, h);
    x.fillStyle = "rgba(43,36,48,.07)";                       /* screentone, the way the game is printed */
    for(var yy = 24; yy < h; yy += 34) for(var xx = (yy / 34 % 2 ? 41 : 24); xx < w; xx += 34){ x.beginPath(); x.arc(xx, yy, 3.2, 0, 7); x.fill() }
    x.lineWidth = 22; x.strokeStyle = INK; x.strokeRect(11, 11, w - 22, h - 22);
    return {c:c, x:x};
  }
  function wrapLines(x, text, maxW){
    var words = String(text).split(/\s+/), lines = [], cur = "";
    words.forEach(function(wd){

      if(x.measureText(t).width > maxW && cur){ lines.push(cur); cur = wd } else cur = t;
    });
    if(cur) lines.push(cur);
    return lines;
  }
  function paragraph(x, text, cx, y, maxW, lh, maxLines){
    var lines = wrapLines(x, text, maxW);
    if(lines.length > maxLines){ lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].replace(/[\s,.;:]*\S*$/, "") + "…" }
    lines.forEach(function(l, i){ x.fillText(l, cx, y + i * lh) });
    return y + lines.length * lh;
  }
  function footer(x, w, h){
    x.textAlign = "center"; x.fillStyle = INK; x.font = font(46);
    x.fillText("Here Kitty Kitty", w / 2, h - 118);
    x.fillStyle = "#6E6275"; x.font = font(30, 700);
    x.fillText("Nine hidden cats. A new search every day.", w / 2, h - 74);
    x.fillText(SHARE_SHOW, w / 2, h - 38);
  }
  function catCard(kind){
    var c = CATS[kind];
    return loadFonts().then(function(){ return svgImage(headXml(kind, 470)) }).then(function(head){
      var b = base(1080, 1350), x = b.x;
      x.textAlign = "center"; x.fillStyle = PINK; x.font = font(34);
      x.fillText("THE HOUSEHOLD", 540, 118);
      x.fillStyle = "#FFFFFF"; x.strokeStyle = INK; x.lineWidth = 12;
      x.beginPath(); x.arc(540, 410, 262, 0, 7); x.fill(); x.stroke();
      x.drawImage(head, 305, 175, 470, 470);
      x.fillStyle = INK; x.font = font(110); x.fillText(c.name, 540, 790);
      x.fillStyle = PINK; x.font = font(38); x.fillText(c.trait.toUpperCase(), 540, 858);
      x.fillStyle = "#4A3F50"; x.font = font(44, 700);

  /* o: {place, cats, things, own: [true when spotted unaided, per cat], line} */
  function resultCard(o){

      x.textAlign = "center"; x.fillStyle = PINK; x.font = font(40);

      x.fillStyle = INK; x.font = font(150); x.fillText(o.cats, 540, 420);

  /* ---------- reminders ---------- */
  var HOURS = [["off", "Off", 0], ["morning", "Morning, 9am", 9], ["midday", "Lunchtime, 12pm", 12], ["evening", "Evening, 6pm", 18], ["night", "Bedtime, 9pm", 21]];
  var REMIND_ID = 91000, REMIND_DAYS = 14;
  var TITLES = ["Today’s search is ready", "A new walk awaits", "The cats are hiding again"];
  function rstate(){ var s = load(); return s.remind || {on:false, hour:18, asked:0} }
  function rsave(r){ var s = load(); s.remind = r; save(s) }
  function canRemind(){ return !!plugin("LocalNotifications") }
  /* Cancel what is pending and schedule the next fortnight again from today's
     state. Cheap, so it runs on every launch, every return to the app and every
     finished night: that is what stops a reminder for a search that is already done. */
  function refresh(){
    var LN = plugin("LocalNotifications"), r = rstate();
    if(!LN) return Promise.resolve(false);
    var ids = []; for(var i = 0; i <= REMIND_DAYS; i++) ids.push({id: REMIND_ID + i});
    return LN.cancel({notifications: ids}).catch(function(){}).then(function(){
      if(!r.on) return false;
      var now = Date.now(), st = loadStats(), items = [];
      for(var k = 0; k < REMIND_DAYS; k++){
        var d = new Date(); d.setHours(r.hour, 0, 0, 0); d.setDate(d.getDate() + k);
        if(d.getTime() <= now + 60000) continue;
        var day = Math.floor((d.getTime() - EPOCH) / 86400000);
        if(completedDay(st, day)) continue;
        var loc = locationFor(day), brief = dailyBrief(day, loc.id);
        items.push({id: REMIND_ID + k, title: TITLES[day % TITLES.length],
                    body: loc.name + " · " + brief.goalName + ". Whenever you are ready.",
                    schedule: {at: d, allowWhileIdle: true}});
      }
      return items.length ? LN.schedule({notifications: items}).then(function(){ return true }) : false;
    }).catch(function(){ return false });
  }
  /* hour: 0 turns it off. Resolves true when reminders are on. */
  function remindAt(hour){
    var LN = plugin("LocalNotifications"), r = rstate();
    if(!LN) return Promise.resolve(false);
    if(!hour){ r.on = false; rsave(r); return refresh().then(function(){ return false }) }
    return LN.requestPermissions().then(function(p){
      if(p && p.display === "granted"){
        r.on = true; r.hour = hour; r.denied = false; rsave(r);
        MEASURE.event("remind_on", {hour: hour});
        return refresh().then(function(){ return true });
      }
      r.on = false; r.denied = true; rsave(r);
      return false;
    }).catch(function(){ return false });
  }
  /* Asked on the result card of the first finished night, and once more on the
     fourth if the answer was "not now"; never after that. The switch in Credits is always there. */
  function shouldAsk(nights){
    var r = rstate();
    return canRemind() && !r.on && !r.denied && ((nights === 1 && !r.asked) || (nights === 4 && r.asked < 2));
  }
  function asked(){ var r = rstate(); r.asked = (r.asked || 0) + 1; rsave(r) }

  /* ---------- the store's own review prompt ---------- */
  function maybeReview(nights){

  }

  /* ---------- the other games ---------- */
  var moreCache = null;
  function moreGames(){
    if(moreCache) return Promise.resolve(moreCache);
    function mine(g){ return g.id === "herekittykitty" || g.id === "hkk" || (g.bundleIds || []).indexOf(APP_ID) >= 0 }
    function link(g){
      var p = platform();
      return g.url || (p === "ios" ? g.iosUrl : p === "android" ? g.androidUrl : (g.iosUrl || g.androidUrl)) || "";
    }
    function tidy(list){
      var seen = {};
      /* the catalog can list a game once per store entry: one tile each */
      return (list || []).filter(function(g){
        if(!g || !g.name || mine(g) || !link(g) || seen[g.name]) return false;
        return (seen[g.name] = true);
      }).map(function(g){ return {id:g.id, name:g.name, tagline:g.tagline || "", icon:g.iconUrl || "", url:link(g)} });
    }
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctl) ctl.abort() }, 4000);
    return fetch(MORE_URL, ctl ? {signal: ctl.signal} : undefined)
      .then(function(r){ return r.json() })
      .then(function(j){ clearTimeout(timer); moreCache = tidy(j && j.games); return moreCache })

/* ---- wiring ---- */
/* iOS keeps audio asleep until a real gesture touches it */
window.addEventListener("pointerdown", function unlock(){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
  }catch(e){}
  MUSIC.unlock();
  window.removeEventListener("pointerdown", unlock, true);
}, true);

document.getElementById("hintBtn").addEventListener("click", useHint);
document.getElementById("shuffleBtn").addEventListener("click", function(){
  start(Math.floor(Math.random()*1e9), false, currentLocation.id);
});
function showSound(){
  var b = document.getElementById("soundBtn");
  b.setAttribute("aria-pressed", String(soundOn));
  b.title = soundOn ? "Sound on" : "Sound off";
  /* waves when it is on, a cross when it is off: faint waves read as "on" */
  document.getElementById("wave1").style.display = soundOn ? "" : "none";
  document.getElementById("wave2").style.display = soundOn ? "" : "none";
  document.getElementById("soundX").style.display = soundOn ? "none" : "";
}
showSound();
document.getElementById("soundBtn").addEventListener("click", function(){
  soundOn = !soundOn;
  try{ localStorage.setItem("wtc-sound", soundOn ? "1" : "0") }catch(e){}
  ADS.muted(!soundOn);
  MUSIC.refresh();
  showSound();
  if(soundOn) beep(660,.1,"sine",.06);
});

/* SMIL ignores prefers-reduced-motion, so stop the clocks and fans by hand */
if(REDUCED){ try{ scene.pauseAnimations() }catch(e){} }

/* gradients for the light; they follow each cone's own bounding box */
document.getElementById("defs").innerHTML =
  '<linearGradient id="glowDown" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="var(--glow)" stop-opacity="1"/>' +
    '<stop offset=".45" stop-color="var(--glow)" stop-opacity=".55"/>' +
    '<stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>' +
  '</linearGradient>' +
  '<radialGradient id="glowPool">' +
    '<stop offset="0" stop-color="var(--glow)" stop-opacity=".95"/>' +
    '<stop offset=".6" stop-color="var(--glow)" stop-opacity=".4"/>' +
    '<stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>' +
  '</radialGradient>';

houseNo = Math.floor((Date.now() - EPOCH)/86400000);
// One timer at the UTC boundary; no polling or interruptions during a search.
function scheduleDailyRefresh(){
  clearTimeout(scheduleDailyRefresh.timer);
  scheduleDailyRefresh.timer=setTimeout(function(){
    if(menuOpen)refreshMenuState();
    scheduleDailyRefresh();
  },Math.max(1000,EPOCH+(currentDailyDay()+1)*86400000-Date.now()+50));
}
document.addEventListener("visibilitychange",function(){if(!document.hidden && menuOpen)refreshMenuState(); if(!document.hidden)GROW.refresh()});
GROW.refresh();
scheduleDailyRefresh();
/* The weekday goes in its own span so a narrow bar can drop it in CSS rather
   than by guessing the width in JavaScript, which would then be wrong the
   moment the phone is turned. */
(function(){
  var d = new Date(EPOCH + houseNo*86400000);
  var dow = d.toLocaleDateString(undefined, {weekday:"short",timeZone:"UTC"});
  var rest = d.toLocaleDateString(undefined, {day:"numeric", month:"short",timeZone:"UTC"});
  document.getElementById("dateLabel").innerHTML =
    '<span class="dow">' + dow + ' </span>' + rest;
})();

document.getElementById("mPlay").addEventListener("click", function(){
  /* practice happens where today's search does, so it is the same place to get better at */
  syncDailyDay(); closeMenu(); start(Math.floor(Math.random()*1e9), false, locationFor(houseNo).id);
});




document.getElementById("mDaily").addEventListener("click", function(){
  syncDailyDay(); closeMenu(); start(houseNo, true);
});
document.getElementById("homeBtn").addEventListener("click", function(){
  var card = document.getElementById("overlay"); if(card) card.remove();
  openMenu();
});
document.getElementById("mBook").addEventListener("click", openCatbook);
document.getElementById("mRanks").addEventListener("click", openRanks);
document.getElementById("mCredits").addEventListener("click", openCredits);

/* Kicked off beside the first house rather than awaited: the consent form and
   ATT prompt are the shell's business, and the menu must not sit waiting on a
   network round trip to a service that may not even be there. */
/* Off-device there is no ad and never will be, so the reserved strip is just a
   band of dead paper across the bottom of the game. The class the layout
   already carries for whoever pays to remove ads does exactly the right thing
   here too. */
if(!ADS.native()) app.classList.add("no-ads");
function startAds(){
  return ADS.init().then(function(ok){
    // The dedicated debug build launches the suite before any game ad API.
    if(HKKLevelPlay.testSuiteOnly()){
      app.classList.add("no-ads");
      MEASURE.init(false);
      return ok ? HKKLevelPlay.testSuite() : false;
    }
    /* Counting waits for the consent answer and not for the ads to work: a build
       with no fill still deserves to know how the game is being played. */
    MEASURE.init(ADS.measurementAllowed());
    if(!ok){
      /* Same as a banner that never filled: the strip kept for it goes back to
         the game. If a later go works, the banner's own size event takes it again. */
      app.classList.add("no-ads");
      return;
    }
    ADS.banner();
    /* the button has promised +15s since before there was another way to pay */
    var h = document.getElementById("hintBtn");
    if(h) h.title = "Reveal the area around one item (watch an ad, or +15s)";
  });
}
startAds();
/* A launch with no signal fails the consent request, and with nothing to retry it
   no ad and no count would ever start until the app was killed. The menu is the
   one place where a consent form can appear without costing anybody their time
   in a house, so it is where another go is made, a few times and no more. */
var adsTries = 0;
function retryAds(){
  if(!ADS.native() || ADS.isReady() || !ADS.failed() || adsTries >= 3) return;
  adsTries++;
  startAds();
}
/* A handle for checking the native plumbing on a device, where there is no
   console to type into. Harmless in a browser, where ADS.native() is false. */
window.HKK_ADS = ADS;
window.HKK_MEASURE = MEASURE;

/* built once behind the menu so the first Play has nothing to wait for */
start(houseNo, true);
resize();
openMenu();
})();
</script>
