button{display:inline-flex; align-items:center; gap:5px}

@media (max-width:620px){
  .bar{gap:8px; padding-left:max(10px,env(safe-area-inset-left)); padding-right:max(10px,env(safe-area-inset-right))}
  .mark{width:26px; height:26px}
  .lk-back{width:15px; height:15px}
  .lockup{gap:5px}
  /* Giving the controls their 44pt left the masthead 115px, and the title no
     longer fits in it. It is also the one thing in this bar nobody needs: you
     know which game you are in, and the chevron and the cat still say "menu".
     The house and the date take its place, at a size that can be read. */
  /* scoped: the menu's title is an h1 as well, and it is the one thing the
     front of the game cannot do without */
  .lockup h1{display:none}
  .sub{font-size:10px; letter-spacing:.02em; color:var(--ink); font-weight:700}
  /* Four 44pt controls leave the masthead too little room for the date. The house number is the identity and the menu
     still carries the date in full. */
  .sub .when{display:none}
  .bar{gap:6px}
  /* "House #259 · Thu 17 Sept" has always been clipped mid-word here. The
     weekday is the part nobody needs: the date is right there next to it. */
  .sub .dow{display:none}
  .count{display:none}
  .tools{gap:5px}
  /* controls collapse to glyphs — the labels were eating the whole bar */
  .btnico{display:block}
  #hintBtn .lbl, #hintBtn .pen, #shuffleBtn .lbl{
    position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);
  }
  /* Apple asks for 44pt and every control here was 31-34. The glyph stays the
     size it was — it is the HIT AREA that grows, so the bar looks the same and
     stops eating taps. */
  button{padding:7px 7px; min-height:44px; min-width:44px}
  .lockup{min-height:44px}
  .tools{gap:4px}
  .tr-things{gap:3px}
  .chip.thing{padding:4px 1px 3px; border-radius:9px}
  .chip .pic{width:100%; max-width:28px; height:23px}
  .tr-prog{font-size:10px}
  .sheet-in{padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .cwho h3{font-size:19px}
  .cbio{font-size:13.5px}
  .card{padding:18px 17px 16px; box-shadow:5px 5px 0 var(--ink-2)}
  .card h2{font-size:22px}
  .grid{font-size:17px; letter-spacing:2px}
}
/* landscape phone: claw back vertical space */
@media (max-height:450px){
  .bar{padding-top:max(5px,env(safe-area-inset-top)); padding-bottom:5px}
  .chip .pic{width:20px; height:15px}
  .finds{gap:4px; padding-top:5px; padding-bottom:6px}
  .sub{display:none}
}
/* @@manga-css-start */
/* ============================ the manga skin ============================
   The game is printed as a manga page. Nothing above this block was rewritten
   to get there: it is the stylesheet that came before, overridden, so the whole
   look can be lifted off by deleting what is between the markers.

   "kawaii" is the internal name of the filled style (body.sty-kawaii, STYLE,
   OBJ_KAWAII); the tokens it reads are now manga's: printer's black for the
   line, a warm paper, saturated fills, and a darker shade of every fill for
   its screentone. Every rule below is scoped to body.sty-kawaii.

   The page is a set of panels: a 3px black border, a hard black shadow, no
   blur anywhere. Type is two faces — Dela Gothic One for anything that shouts,
   Zen Maru Gothic for anything that reads. */

body.sty-kawaii{
  font-family:var(--f-body);
  --m-wall:#FFF0C8; --m-wall-2:#F5D98E; --m-stripe:#FBE3A0;
  --cut-stage:polygon(0 0,100% 0,100% calc(100% - 14px),0 100%);
  --cut-tray:polygon(0 16px,100% 0,100% 100%,0 100%);
  --stamp:#D6283E;
  --dots:radial-gradient(circle at 1px 1px, rgba(23,18,26,.2) 1px, transparent 1.4px) 0 0/5px 5px;
}

/* ---------------------------------------------------------------- the page */
body.sty-kawaii #app{
  gap:5px; background:var(--paper);
  padding:max(4px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
}
:where(body.sty-kawaii) button{
  font-family:var(--f-body); font-weight:900; letter-spacing:.01em;
  border:2.5px solid var(--ink); border-radius:4px; background:var(--paper);
  box-shadow:2px 2px 0 var(--ink);
}
:where(body.sty-kawaii) button:hover{background:var(--ink); color:var(--paper)}
:where(body.sty-kawaii) button:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
:where(body.sty-kawaii) button[disabled]:hover{background:var(--paper); color:var(--ink)}

/* the masthead is a title card, in tone */
body.sty-kawaii .bar{
  padding:3px 8px 3px 6px; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
  background:var(--paper-2) var(--dots);
}
body.sty-kawaii .lockup,
body.sty-kawaii .lockup:hover{border:0; box-shadow:none; background:none; color:inherit}
body.sty-kawaii .lockup:active{transform:none}
body.sty-kawaii h1{letter-spacing:.005em; text-shadow:2px 2px 0 #fff, 3px 3px 0 var(--ink)}
body.sty-kawaii .sub{font-family:var(--f-body); font-weight:900; color:var(--ink)}
body.sty-kawaii .lk-back{color:var(--ink)}
body.sty-kawaii .mark{width:34px; height:31px}
body.sty-kawaii .count{font-size:13px; color:var(--ink)}
body.sty-kawaii .icobtn{padding:6px 8px}

/* the hint is a shout bubble */
body.sty-kawaii #hintBtn{
  position:relative; isolation:isolate; padding:0 8px; min-width:52px; width:auto; height:46px;
  border:0; background:none; box-shadow:none; color:var(--ink); justify-content:center;
  font-family:var(--f-display); font-weight:400; font-size:14px; transform:rotate(-4deg);
}
body.sty-kawaii #hintBtn::before, body.sty-kawaii #hintBtn::after{content:""; position:absolute; inset:0; z-index:-1}
body.sty-kawaii #hintBtn::before{
  background:var(--ink); z-index:-2;
  clip-path:polygon(50.0% 0.0%,59.6% 11.2%,73.2% 5.7%,76.5% 20.1%,91.1% 21.6%,87.4% 35.8%,99.6% 44.0%,89.7% 54.8%,96.8% 67.7%,82.9% 72.7%,83.2% 87.4%,68.6% 85.4%,62.0% 98.5%,50.0% 90.0%,38.0% 98.5%,31.4% 85.4%,16.8% 87.4%,17.1% 72.7%,3.2% 67.7%,10.3% 54.8%,0.4% 44.0%,12.6% 35.8%,8.9% 21.6%,23.5% 20.1%,26.8% 5.7%,40.4% 11.2%);
}
body.sty-kawaii #hintBtn::after{
  background:var(--glow);
  clip-path:polygon(50.0% 6.0%,58.4% 15.8%,70.4% 11.0%,73.3% 23.7%,86.2% 25.0%,82.9% 37.5%,93.7% 44.7%,84.9% 54.2%,91.1% 65.6%,79.0% 70.0%,79.2% 82.9%,66.4% 81.2%,60.5% 92.7%,50.0% 85.2%,39.5% 92.7%,33.6% 81.2%,20.8% 82.9%,21.0% 70.0%,8.9% 65.6%,15.1% 54.2%,6.3% 44.7%,17.1% 37.5%,13.8% 25.0%,26.7% 23.7%,29.6% 11.0%,41.6% 15.8%);
}
body.sty-kawaii #hintBtn:hover{background:none; color:var(--ink)}
body.sty-kawaii #hintBtn:active{transform:rotate(-4deg) scale(.94); box-shadow:none}
body.sty-kawaii #hintBtn[disabled]{opacity:1; filter:grayscale(1) opacity(.45)}
body.sty-kawaii #hintBtn .pen{font-family:var(--f-body); font-weight:900; opacity:.8; font-size:10px}
body.sty-kawaii #hintBtn .btnico{width:19px; height:19px}

/* ------------------------------------------- panels with a slanted foot */
body.sty-kawaii .mg-panel{position:relative; min-height:0; min-width:0; display:grid; grid-template-columns:minmax(0,1fr)}
body.sty-kawaii .mg-panel::before{content:""; position:absolute; inset:0; transform:translate(5px,5px); background:var(--ink)}
body.sty-kawaii .mg-pin{
  position:relative; background:var(--ink); padding:3px; display:grid;
  grid-template-columns:minmax(0,1fr); min-height:0; min-width:0;
}
body.sty-kawaii .mg-p-stage::before, body.sty-kawaii .mg-p-stage .mg-pin, body.sty-kawaii .mg-p-stage #stage{clip-path:var(--cut-stage)}
body.sty-kawaii .mg-p-tray::before, body.sty-kawaii .mg-p-tray .mg-pin, body.sty-kawaii .mg-p-tray .finds{clip-path:var(--cut-tray)}
body.sty-kawaii .mg-p-tray{margin-top:-16px}
body.sty-kawaii #stage{background:var(--paper)}
/* the paper grain was a full-stage multiply layer on top of a moving picture */
body.sty-kawaii #stage::after{display:none}

body.sty-kawaii #adslot{
  border-top:3px solid var(--ink); background:var(--paper-3);
  margin:0 calc(-1 * max(12px, env(safe-area-inset-right))) 0 calc(-1 * max(8px, env(safe-area-inset-left)));
}

/* ------------------------------------------------------------ the tray */
body.sty-kawaii .finds{
  border:0; background:var(--paper-2) var(--dots); gap:5px; padding:22px 10px 7px;
}
body.sty-kawaii .tr-prog{font-family:var(--f-body); font-weight:900; color:var(--ink); letter-spacing:.05em}
/* Dela Gothic's zero is a round O, and "O/9 CATS" read as a letter, so the count
   is set in the reading face, which keeps its zero narrow */
body.sty-kawaii .tr-prog b{font-family:var(--f-body); font-weight:900; font-size:16px; line-height:1; color:var(--ink)}
body.sty-kawaii .tr-cnt b{padding:2px 4px 1px; margin-right:1px; border-radius:3px}
/* a full set is stamped in the highlighter */
body.sty-kawaii .tr-cnt.full b{background:var(--glow); box-shadow:0 0 0 2px var(--ink)}
body.sty-kawaii .tr-bonus{border-left:2.5px dotted var(--ink)}
/* the gauge is one ink cell for each cat, so a night of nine and a night of
   four both read as a row you are filling in */
body.sty-kawaii .tr-track{height:13px; gap:3px}
body.sty-kawaii .tr-track i{
  border:2.5px solid var(--ink); border-radius:0; background:var(--paper); transition:none;
}
/* a cell takes the colour of the cat that filled it, with a shaded corner so a
   white cat still reads as a cell that is full */
body.sty-kawaii .tr-track i.on{
  background:linear-gradient(135deg, transparent 56%, rgba(23,18,26,.3) 56%) var(--c, var(--ink-2));
  animation:cellInk .4s cubic-bezier(.2,1.5,.4,1);
}
body.sty-kawaii .tr-track i[data-kind]{position:relative; cursor:pointer}
body.sty-kawaii .tr-track i[data-kind]::after{content:""; position:absolute; inset:-9px -2px}
@keyframes cellInk{0%{transform:scaleY(.2)} 100%{transform:none}}
@media (prefers-reduced-motion:reduce){ body.sty-kawaii .tr-track i.on{animation:none} }
body.sty-kawaii .chip{
  border:2.5px solid var(--ink); border-radius:5px; background-color:var(--paper);
  box-shadow:2.5px 2.5px 0 var(--ink); color:var(--ink);
}
body.sty-kawaii .chip:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
body.sty-kawaii .chip:hover{background-color:var(--paper)}
body.sty-kawaii .chip .n i{width:11px; border-width:2px}
body.sty-kawaii .chip .n i.on{background:var(--ink-2)}
/* at 320 each of nine chips is under 28px, and two cells have to fit in one */
@media (max-width:340px){ body.sty-kawaii .chip .n i{width:8px} body.sty-kawaii .chip .n{gap:2px} }
body.sty-kawaii .chip.sel{background-color:var(--glow); border-color:var(--ink)}
body.sty-kawaii .chip.got{border-color:var(--ink); background-color:var(--glow); background-image:none}
body.sty-kawaii .chip .tk{background:var(--ink-2); border:2px solid var(--ink); color:#fff}

/* The bonus things are printed in the house's own colours. Until one is found
   its chip holds a pale proof of the same drawing, so a ball of wool can be told
   from a bowl before either is found; the black silhouette it replaced made
   four of the nine the same lump. One found of two is already in colour. The
   pale proof is just the colour tokens swapped, so it costs no filter. */
body.sty-kawaii .chip.thing .tr-sil{display:none}
body.sty-kawaii .chip.thing .tr-col{opacity:1}
body.sty-kawaii .chip.thing:not(.got):not(.part){
  --k-soft:#EFE9D8; --k-wood:#E6DEC9; --k-warm:#E6DEC9; --k-metal:#E9E4D6;
  --k-glass:#EEEADE; --k-lamp:#EFE9D8; --k-leaf:#E6E1CC; --k-flat:#F2EEE0; --k-line:#8F889A;
}
body.sty-kawaii .chip.thing:not(.got):not(.part) .tr-col .tf-ac{fill:#E6DEC9}
body.sty-kawaii .chip.thing.part{background-color:color-mix(in srgb, var(--glow) 38%, var(--paper))}
/* the tick sits on the corner of a chip about a third of an inch wide */
body.sty-kawaii .chip.thing .tk{top:-7px; right:-7px; width:15px; height:15px; border-width:1.5px}
body.sty-kawaii .chip.thing .tk svg{width:9px; height:9px}
/* ------------------------------------------------ the hunt list shrinks
   Only the cats still out there are in the tray, in a box that is the same height
   all night. Nine small cards; fewer and bigger as they come home; the last one
   alone in a panel of its own. A cat still out there is in the dark with its eyes
   showing; a cat in the box when the night is over is printed in colour. */
body.sty-kawaii .kz{width:100%; max-width:640px; height:112px; display:flex; flex-direction:column; gap:4px}
body.sty-kawaii .kr{display:flex; gap:5px; justify-content:center; width:100%; flex:1 1 0; min-height:0}
body.sty-kawaii .kz.one .kr{gap:7px}
body.sty-kawaii .kc{
  position:relative; display:flex; align-items:stretch; justify-content:flex-start; gap:0; min-width:0; padding:0; overflow:hidden; text-align:left;
  border:2.5px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink);
  box-shadow:2.5px 2.5px 0 var(--ink); font:inherit; cursor:pointer;
}
body.sty-kawaii .kc:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
body.sty-kawaii .kc.sel{box-shadow:2.5px 2.5px 0 var(--ink), 0 0 0 3px var(--glow)}
body.sty-kawaii .kc.leaving{opacity:.5; filter:grayscale(.6); pointer-events:none}
/* the window is a patch of night: the cat is in it with its eyes lit */
body.sty-kawaii .kw{position:relative; display:block; flex:none; overflow:hidden; background:#2A2540}
body.sty-kawaii .kw::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 20% 22%, #fff 0 1px, transparent 1.6px), radial-gradient(circle at 80% 16%, #fff 0 1.2px, transparent 1.9px),
             radial-gradient(circle at 90% 62%, #fff 0 1px, transparent 1.6px), radial-gradient(circle at 10% 74%, #FFE08A 0 1.1px, transparent 1.7px);
}
body.sty-kawaii .kw svg{position:absolute; left:50%; bottom:-3px; transform:translateX(-50%); display:block}
/* where to look: what the old tray drew beside the head */
body.sty-kawaii .kb{
  position:absolute; left:2px; top:2px; z-index:1; display:grid; place-items:center;
  border:2px solid var(--ink); border-radius:50%; background:var(--paper);
}
/* TYPE FLOOR. Nothing in this interface goes below 10px. At 10px the longest
   names ("Marmalade") only just fit a small card, so the tracking is tightened:
   a name you can read and half recognise beats one you can neither read nor
   recognise. */
body.sty-kawaii .kn{
  flex:none; display:block; height:14px; padding:0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center;
  background:var(--ink); color:#fff; font:900 10px/14px var(--f-body); letter-spacing:-.015em;
}
body.sty-kawaii .kc.sel .kn{background:var(--glow); color:var(--ink)}

/* seven or more left: small cards, two rows */
body.sty-kawaii .kc.chip{flex:0 0 calc((100% - 20px) / 5); max-width:62px; flex-direction:column}
body.sty-kawaii .kc.chip .kn{padding:0; letter-spacing:-.03em}
body.sty-kawaii .kc.chip .kw{flex:1; min-height:0}
body.sty-kawaii .kc.chip .kw svg{width:68%; max-width:42px}
body.sty-kawaii .kt{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; padding:0 4px 0 7px}
body.sty-kawaii .kt b{font:900 12px/1.1 var(--f-body); letter-spacing:-.01em}
/* six down to three left: tall cards in one row, the names tightening as they crowd */
body.sty-kawaii .kc.tall{flex:1 1 0; max-width:106px; flex-direction:column}
body.sty-kawaii .kc.tall .kw{flex:1; min-height:0}
body.sty-kawaii .kc.tall .kw svg{width:92%; max-width:78px}
/* the taller windows have room above the head: it sits in the middle of the night, not on the floor of it */
body.sty-kawaii .kc.tall .kw svg, body.sty-kawaii .kc.big .kw svg{top:50%; bottom:auto; transform:translate(-50%,-46%)}
body.sty-kawaii .kc.tall .kn{height:22px; font-size:12px; line-height:22px}
body.sty-kawaii .kz[data-n="5"] .kc.tall .kn{font-size:11px}
body.sty-kawaii .kz[data-n="6"] .kc.tall .kn{font-size:10px; letter-spacing:-.04em; padding:0}
body.sty-kawaii .kz[data-n="6"] .kr{gap:4px}
@media (max-width:340px){ body.sty-kawaii .kz[data-n="5"] .kc.tall .kn{font-size:10px} }
/* two left: the clue is on the card */
body.sty-kawaii .kc.big{flex:1 1 0; max-width:300px}
body.sty-kawaii .kc.big .kw{width:74px; border-right:2.5px solid var(--ink)}
body.sty-kawaii .kc.big .kw svg{width:92%}
body.sty-kawaii .kc.big .kt{padding:6px 4px 6px 7px}
body.sty-kawaii .kc.big .kt b{font-size:clamp(11px, 3.5vw, 13px)}
body.sty-kawaii .kc.big .kt i{font:700 10.5px/1.25 var(--f-body)}
/* home: the household, in colour, and each one a way back to their page */
body.sty-kawaii .kc.got .kw{background:repeating-conic-gradient(from 0deg at 50% 70%, #FFE08A 0 7deg, #FFF3C8 7deg 14deg)}
body.sty-kawaii .kc.got .kw::before{display:none}
body.sty-kawaii .kc.got .kn{background:var(--glow); color:var(--ink)}
/* the last one gets the whole tray */
body.sty-kawaii .kc.kh{width:100%; max-width:none; cursor:default; box-shadow:3px 3px 0 var(--ink)}
body.sty-kawaii .kc.kh:active{transform:none; box-shadow:3px 3px 0 var(--ink)}
body.sty-kawaii .kh .kw{width:112px; border-right:2.5px solid var(--ink); background:repeating-conic-gradient(from 0deg at 50% 80%, #2A2540 0 7deg, #332D52 7deg 14deg)}
body.sty-kawaii .kh .kw::before{display:none}
body.sty-kawaii .kh .kw svg{width:104px; bottom:3px}
body.sty-kawaii .kh .kt{gap:2px; padding:6px 8px}
body.sty-kawaii .kh .kt b{font:400 21px/1.05 var(--f-display)}
body.sty-kawaii .kh .kt i{font:700 12px/1.25 var(--f-body)}
body.sty-kawaii .ktag{font:900 9.5px/1 var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:var(--stamp)}
body.sty-kawaii .ktr{align-self:flex-start; background:var(--ink); color:#fff; font:900 9.5px/1 var(--f-body); letter-spacing:.1em; text-transform:uppercase; padding:3px 6px 2px; transform:skewX(-8deg)}
body.sty-kawaii .kacts{display:flex; gap:6px; margin-top:auto}
body.sty-kawaii .kacts button{height:30px; min-height:0; min-width:0; padding:0 10px; font-size:11px; background:var(--glow); color:var(--ink)}
body.sty-kawaii .kacts button.alt{background:var(--paper)}
body.sty-kawaii .kburst{
  position:absolute; left:3px; bottom:5px; padding:2px 6px 1px; transform:rotate(-7deg); z-index:2;
  background:var(--stamp); color:#fff; border:2.5px solid var(--ink); box-shadow:2px 2px 0 var(--ink); font:400 12px/1.2 var(--f-display);
}
/* a phone on its side has no room to spare: one row of small cards, no names to speak of */
@media (max-height:450px){
  body.sty-kawaii .kz{height:58px}
  body.sty-kawaii .kc.chip .kn{display:none}
}
@media (prefers-reduced-motion:reduce){ body.sty-kawaii .kc{transition:none} }

/* the clue is a speech balloon */
body.sty-kawaii .clue{
  background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:20px 20px 20px 6px;
  box-shadow:3px 3px 0 var(--ink); font-family:var(--f-body); font-weight:700; line-height:1.35;
}
body.sty-kawaii .clue b{font-size:15px}
body.sty-kawaii .clue .tag{color:var(--ink-2); font-weight:900}
body.sty-kawaii .clue::after{
  background:#fff; border:0; border-right:3px solid var(--ink); border-bottom:3px solid var(--ink);
  bottom:-9px; width:14px; height:14px; margin-left:-7px; border-radius:0 0 3px 0;
}
body.sty-kawaii .clue button{
  background:var(--glow); color:var(--ink); border:2.5px solid var(--ink); border-radius:4px;
  box-shadow:2px 2px 0 var(--ink); font-weight:900; height:34px;
}
body.sty-kawaii .clue button.alt{background:#fff; color:var(--ink); border:2.5px solid var(--ink)}

body.sty-kawaii .toast{
  background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:3px;
  box-shadow:3px 3px 0 var(--ink); font-family:var(--f-body); font-weight:900; padding:6px 12px;
}
body.sty-kawaii .toast .sw{border-color:var(--ink)}

/* a found thing has its say: a caption box */
body.sty-kawaii .quip{
  bottom:34px; background:#fff; border:3px solid var(--ink); border-radius:4px; box-shadow:5px 5px 0 var(--ink);
}
body.sty-kawaii .quip-pic{background:var(--paper-2) var(--dots); border:2.5px solid var(--ink); border-radius:3px}
body.sty-kawaii .quip-tag{font-family:var(--f-body); font-weight:900}
body.sty-kawaii .quip p{font-family:var(--f-body); font-weight:700; font-size:17px}
body.sty-kawaii .quip em{font-family:var(--f-display); font-weight:400}

/* the opening and closing lines are lettering */
body.sty-kawaii .tc h2{
  font-weight:400; letter-spacing:0; line-height:1.02; -webkit-text-stroke:0;
  text-shadow:-3px 0 #fff, 3px 0 #fff, 0 -3px #fff, 0 3px #fff, 2px 2px #fff, -2px -2px #fff, 2px -2px #fff, -2px 2px #fff, 5px 6px 0 var(--ink);
}
body.sty-kawaii .tc p{
  display:inline-block; font-family:var(--f-body); font-weight:900; color:#fff; background:var(--ink);
  padding:5px 11px 4px; transform:skewX(-8deg); letter-spacing:.09em;
}
body.sty-kawaii .tc::before{
  /* fades to nothing at the box's own edge: on a dark night sky a wash that stops short shows as a slab */
  -webkit-mask-image:radial-gradient(closest-side, #000 38%, rgba(0,0,0,0) 100%);
          mask-image:radial-gradient(closest-side, #000 38%, rgba(0,0,0,0) 100%);
  opacity:.72; inset:-60px -46px;
}

/* ------------------------------------------------------ cards and sheets */
body.sty-kawaii .overlay{background:color-mix(in srgb, var(--ink) 18%, transparent)}
body.sty-kawaii .card{border:3px solid var(--ink); box-shadow:7px 7px 0 var(--ink); border-radius:4px}
body.sty-kawaii .card.pnl{border-width:3px; border-radius:4px}
body.sty-kawaii .card h2{font-weight:400; text-shadow:2px 2px 0 var(--glow)}
body.sty-kawaii .card .eyebrow, body.sty-kawaii .fp-kicker{font-weight:900; color:var(--ink-2)}
body.sty-kawaii .stat b, body.sty-kawaii .fp-count{font-family:var(--f-num); font-weight:400}
body.sty-kawaii .stats{border:2.5px solid var(--ink); background:var(--ink); gap:2.5px}
body.sty-kawaii .sheet{background:color-mix(in srgb, var(--ink) 30%, transparent)}
body.sty-kawaii .sheet-in{border:3px solid var(--ink); border-bottom:0; border-radius:0; box-shadow:0 -6px 0 var(--ink-2)}
body.sty-kawaii .cface{border:3px solid var(--ink); border-radius:4px; background:var(--paper-2) var(--dots)}
body.sty-kawaii .cface.got{border-color:var(--ink)}
body.sty-kawaii .cwho h3{font-weight:400}
body.sty-kawaii .ctrait{font-weight:900}
body.sty-kawaii .cstate{border:2px solid var(--ink); font-weight:900}
body.sty-kawaii .cstate.in{background:var(--glow); color:var(--ink); border-color:var(--ink)}
body.sty-kawaii .cfacts{border:2.5px solid var(--ink); background:var(--ink); gap:2.5px}
body.sty-kawaii .discovery{border:2.5px solid var(--ink); background:var(--paper-2) var(--dots)}
body.sty-kawaii .discovery.locked{border-style:dashed}
body.sty-kawaii .streak-ribbon{border-left:5px solid var(--ink-2)}
body.sty-kawaii .primary{background:var(--ink); color:var(--paper)}
body.sty-kawaii .primary:hover{background:var(--ink-2); border-color:var(--ink); color:#fff}
body.sty-kawaii .bookcat{border:2.5px solid var(--ink); border-radius:4px; box-shadow:2px 2px 0 var(--ink)}
body.sty-kawaii .bookcat.known{background:var(--paper-2) var(--dots); border-color:var(--ink)}

  background:repeating-conic-gradient(from 0deg at 50% 56%, var(--ink) 0 1deg, transparent 1deg 5deg);

          mask-image:radial-gradient(circle at 50% 56%, transparent 30%, #000 78%);

}

/* ----------------------------------------------------------- the menu */
/* The cover. The cat sits on a title plate, a slanted white panel with a hard
   shadow and a screentone fading in from its right-hand end, and the tagline
   hangs off the plate's foot as a black strip, staggered the way a caption
   box is. Rays fan out from behind the cat and a band of tone climbs the sky
   from the horizon. All of it is still: only the cat's head and tail move. */
body.sty-kawaii .m-sign{width:min(100%, 336px)}
body.sty-kawaii .m-sign::before{
  content:""; position:absolute; z-index:-2; pointer-events:none;
  left:50%; top:calc(var(--cw) * .66); width:470px; height:470px; margin:-235px 0 0 -235px;
  background:repeating-conic-gradient(from 3deg, rgba(255,255,255,.55) 0 2.2deg, transparent 2.2deg 9deg);
  -webkit-mask-image:radial-gradient(closest-side, transparent 0 19%, #000 24%, transparent 100%);
          mask-image:radial-gradient(closest-side, transparent 0 19%, #000 24%, transparent 100%);
}
body.sty-kawaii .m-sky::after{
  content:""; position:absolute; inset:0; background:var(--dots);
  -webkit-mask-image:linear-gradient(to top, #000 0, transparent 48%);
          mask-image:linear-gradient(to top, #000 0, transparent 48%);
}
body.sty-kawaii .menu .m-title, body.sty-kawaii .m-title{
  position:relative; z-index:1; align-self:stretch; margin:0 14px 0 0; padding:8px 14px 5px;
  font-weight:400; font-size:clamp(22px, 8.1vw, 31px); line-height:1; letter-spacing:.005em; white-space:nowrap;
  color:var(--ink); background:var(--paper); border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
  text-shadow:2px 2px 0 var(--glow); transform:skewX(-6deg);
}
body.sty-kawaii .m-title::after{
  content:""; position:absolute; z-index:-1; top:0; right:0; bottom:0; width:42%; pointer-events:none;
  background:var(--dots);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000);
          mask-image:linear-gradient(90deg, transparent, #000);
}
body.sty-kawaii .m-kk{color:var(--stamp); text-shadow:2px 2px 0 var(--ink)}
body.sty-kawaii .m-tag{
  display:block; align-self:stretch; margin:-3px 0 0 16px; padding:6px 12px 5px; text-align:center;
  font-family:var(--f-body); font-weight:900; color:#fff; background:var(--ink);
  letter-spacing:.08em; transform:skewX(-6deg); box-shadow:4px 4px 0 var(--stamp);
}
/* a lettered sound effect, the way the finds in the house have one */
.m-sfx{display:none}
body.sty-kawaii .m-sfx{
  display:block; position:absolute; z-index:3; right:2px; top:calc(var(--cw) * .36); pointer-events:none;
  font-family:var(--f-display); font-size:21px; line-height:1; color:var(--stamp); white-space:nowrap;
  -webkit-text-stroke:5px #fff; paint-order:stroke fill; text-shadow:2px 3px 0 var(--ink);
  transform:rotate(10deg); letter-spacing:0;
}
body.sty-kawaii .menu.tight1 .m-sfx{display:none}
body.sty-kawaii .m-corner{
  border:3px solid var(--ink); border-radius:4px; background:var(--paper); box-shadow:3px 3px 0 var(--ink); color:var(--ink);
}
body.sty-kawaii .m-corner:hover{background:var(--glow); color:var(--ink)}
body.sty-kawaii .m-corner:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
body.sty-kawaii .m-head::before{background:linear-gradient(#7E78C4, #A99AD6 42%, #F0AFAA 76%, #FFD1AE)}
body.sty-kawaii .m-head::after{background:#7E78C4}
body.sty-kawaii .m-hills .far{fill:#A7C98F}
body.sty-kawaii .m-hills .near{fill:var(--paper)}
body.sty-kawaii .m-hills .ridge{stroke:var(--ink); stroke-opacity:1; stroke-width:3}
body.sty-kawaii .parade{
  background:var(--paper); border:3px solid var(--ink); border-radius:4px; box-shadow:6px 6px 0 var(--ink);
}
body.sty-kawaii .p-stage{border:2.5px solid var(--ink); border-radius:3px; background:var(--m-wall)}
body.sty-kawaii .p-wall{fill:var(--m-wall)}
body.sty-kawaii .p-floor{fill:var(--k-floor)}
body.sty-kawaii .p-skirt{fill:var(--m-wall-2)}
body.sty-kawaii .p-face{border-radius:4px; background:var(--paper-2) var(--dots); border:2.5px solid var(--ink); color:var(--ink)}
body.sty-kawaii .p-who h2{font-weight:400; text-shadow:2px 2px 0 var(--glow)}
body.sty-kawaii .p-trait{
  display:inline-block; margin-top:4px; padding:3px 9px 2px; font-weight:900; color:#fff; background:var(--ink);
  transform:skewX(-8deg); letter-spacing:.1em;
}
body.sty-kawaii .p-bio{color:var(--ink); font-weight:500}
body.sty-kawaii .p-dots button::before{background:var(--rule); opacity:.35; border-radius:2px}
body.sty-kawaii .p-dots button[aria-current="true"]::before{background:var(--ink-2); opacity:1}
/* The buttons are slanted panels, parallel to the tagline and the title plate:
   a 3px line, a hard shadow, no radius, and the type slanted with the panel.
   Today's search is the page's big panel, in red, with tone on one side and speed
   lines on the other; the pair are paper with tone. Pressing one sinks it into
   its shadow. */
body.sty-kawaii .m-buttons{gap:14px; padding-right:5px}
body.sty-kawaii .m-buttons button{
  position:relative; isolation:isolate; border:3px solid var(--ink); border-radius:0;
  box-shadow:5px 5px 0 var(--ink); background:var(--paper); transform:skewX(-4deg);
}
/* tone in from one corner and out again, so the type has paper to sit on */
body.sty-kawaii .m-pair button::before{
  content:""; position:absolute; z-index:-1; inset:0; pointer-events:none; background:var(--dots);
  -webkit-mask-image:linear-gradient(160deg, #000 0, transparent 62%);
          mask-image:linear-gradient(160deg, #000 0, transparent 62%);
}
body.sty-kawaii .m-buttons button:hover{background:#fff; color:var(--ink)}
body.sty-kawaii .m-buttons button:active{transform:skewX(-4deg) translate(4px,4px); box-shadow:1px 1px 0 var(--ink)}
body.sty-kawaii .m-buttons .go{background:var(--ink-2); color:#fff; padding-right:12px}
body.sty-kawaii .m-buttons .go:hover{background:color-mix(in srgb, var(--ink-2) 88%, #fff); color:#fff}
body.sty-kawaii .m-buttons .go::before, body.sty-kawaii .m-buttons .go::after{
  content:""; position:absolute; z-index:-1; top:0; bottom:0; pointer-events:none;
}
body.sty-kawaii .m-buttons .go::before{
  left:0; width:55%;
  background:radial-gradient(circle at 1px 1px, rgba(23,18,26,.3) 1.1px, transparent 1.5px) 0 0/5px 5px;
  -webkit-mask-image:linear-gradient(90deg, #000, transparent);
          mask-image:linear-gradient(90deg, #000, transparent);
}
body.sty-kawaii .m-buttons .go::after{
  right:0; width:50%;
  background:repeating-linear-gradient(104deg, rgba(255,255,255,.3) 0 2px, transparent 2px 9px);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000);
          mask-image:linear-gradient(90deg, transparent, #000);
}
body.sty-kawaii .m-buttons .go b{
  font-family:var(--f-display); font-weight:400; font-size:clamp(17px, 5.4vw, 20px); letter-spacing:.01em;
  text-shadow:2px 2px 0 var(--ink);
}
body.sty-kawaii .m-buttons .go .m-lbl span{font-weight:700; text-shadow:1px 1px 0 var(--ink)}
body.sty-kawaii .go .m-ico{border:3px solid var(--ink); border-radius:0; box-shadow:2px 2px 0 var(--ink); transform:rotate(-5deg)}
body.sty-kawaii .go .m-chev{opacity:1; filter:drop-shadow(2px 2px 0 var(--ink))}
body.sty-kawaii .m-pair b{
  font-family:var(--f-display); font-weight:400; letter-spacing:.005em; font-size:clamp(13px, 4vw, 15px);
  text-shadow:2px 2px 0 var(--glow);
}
body.sty-kawaii .m-pair span{font-weight:700; color:var(--ink)}
body.sty-kawaii .m-state{
  border:3px solid var(--ink); border-radius:0; background:var(--glow); box-shadow:4px 4px 0 var(--ink);
  font-weight:700; transform:skewX(-4deg); margin-right:4px;
}
body.sty-kawaii .m-state b{color:var(--ink)}
body.sty-kawaii .m-state svg{color:var(--ink)}

/* the credits roll */
body.sty-kawaii .cr .cr-role{font-weight:900}
body.sty-kawaii .cr .cr-name, body.sty-kawaii .cr .cr-end{font-weight:400}
body.sty-kawaii .cr-cast i{border-bottom:2.5px dotted var(--ink)}

/* light: a flat wash, never a blend — blending is the expensive way to print a lamp */
body.sty-kawaii .glow{fill:var(--glow); mix-blend-mode:normal}
body.sty-kawaii .glow.soft{fill:var(--glow)}
body.sty-kawaii .obj.lit .glow{opacity:.36}
body.sty-kawaii .obj.lit .glow.soft{opacity:.26}
body.sty-kawaii #world .rays{stroke-width:2.6px}

/* ------------------------------------------------------- the house in ink */
/* 1. the hard shadow: the drawing again, in black, behind itself */
.ink-sh, .ink-sh *{fill:var(--ink) !important; stroke:var(--ink) !important}
.ink-sh .dt, .ink-sh .nf, .ink-sh .rays, .ink-sh .glow, .ink-sh .sh2, .ink-sh .mg-eye, .ink-sh .mg-bl,
.ink-sh .ct-sh, .ink-sh .ct-no, .ink-sh .tf-ey, .ink-sh .a1{display:none}
.ish{pointer-events:none}
/* 2. the tone: the drawing in dots, cut to the crescent that faces away from the light */
.tn *{fill:var(--tf, none) !important; stroke:none !important}
.tn .dt, .tn .nf, .tn .rays, .tn .glow, .tn .sh2, .tn .ct-sh, .tn .ct-ey, .tn .ct-gl, .tn .ct-no,
.tn .ct-bl, .tn .mg-eye, .tn .mg-bl, .tn .tf-ey, .tn .a1{display:none}
.mk *{fill:#fff !important; stroke:none !important}
.mk-b *{fill:#000 !important}
.mk .dt, .mk .nf, .mk .rays, .mk .glow, .mk .sh2, .mk .ct-sh, .mk .ct-ey, .mk .ct-gl, .mk .ct-no,
.mk .ct-bl, .mk .mg-eye, .mk .mg-bl, .mk .tf-ey, .mk .a1{display:none}
.tnu{pointer-events:none}
/* while the camera is moving the tone steps out: it is the one costly layer, and a
   picture sliding past too fast to see it loses nothing */
#stage.moving .tnu{visibility:hidden}
body.sty-kawaii #world .gl path{fill:#fff; stroke:none; opacity:.92; pointer-events:none}

/* cats: wide sparkling eyes in a colour of their own, hatched blush */
.mg-iris{fill:var(--ic,#7DBF45); stroke:var(--ink); stroke-width:.9px}
.mg-low{fill:color-mix(in srgb, var(--ic,#7DBF45) 50%, #fff); stroke:none}
.mg-pup{fill:var(--ink); stroke:none}
.mg-lid{fill:var(--ink); stroke:var(--ink); stroke-width:.5px}
.mg-g1, .mg-g2{fill:#fff; stroke:none}
.mg-blw{fill:#FF9EB0; opacity:.4; stroke:none}
.mg-bll{fill:none; stroke:#E8506E; stroke-width:.7px; stroke-linecap:round}
body.sty-kawaii #world .mg-blw{opacity:.3}

/* the sheets the rooms are printed on */
body.sty-kawaii .dp{stroke-opacity:1}
body.sty-kawaii .dp-back{fill:url(#mgWall)}
body.sty-kawaii .dp-ceil{fill:url(#mgCeil)}
body.sty-kawaii .dp-side{fill:url(#mgSide)}
body.sty-kawaii .dp-floor{fill:url(#mgFloor)}
body.sty-kawaii .dp-floor.f-wood{fill:url(#mgFloor)}
body.sty-kawaii .dp-floor.f-tile{fill:url(#mgFloorTile)}
body.sty-kawaii .dp-floor.f-soft{fill:url(#mgFloorSoft)}
body.sty-kawaii #world .hf-far{fill:url(#mgHillF)}
body.sty-kawaii #world .hf-near{fill:url(#mgHillN)}
body.sty-kawaii #world .gf-grass{fill:var(--k-grass)}
.mgtone{pointer-events:none}

/* lettering */
.sfx{
  font-family:var(--f-display); fill:var(--ink); stroke:#fff; stroke-width:3.2px; paint-order:stroke;
  stroke-linejoin:round; pointer-events:none; transform-box:fill-box; transform-origin:50% 60%;
  transform:rotate(var(--r, 0deg));
}
.sfx.poke{animation:mgPoke 1.3s ease-out both}
.sfx.stare{animation:mgStare 1.6s ease-in-out infinite alternate}
@keyframes mgPoke{
  0%{opacity:0; transform:rotate(var(--r)) translateY(5px) scale(.5)}
  12%{opacity:1; transform:rotate(var(--r))} 70%{opacity:1}
  100%{opacity:0; transform:rotate(var(--r)) translateY(-12px)}
}
@keyframes mgStare{from{opacity:.55} to{opacity:1}}

/* a find is a page-turn */
.mg-flash{position:fixed; inset:0; z-index:44; pointer-events:none; animation:mgFlash 1.1s ease-out both}
.mg-flash.small{animation-duration:.8s}
.mg-flash svg{display:block; width:100%; height:100%}
.mg-flash path{fill:var(--ink)}
@keyframes mgFlash{0%{opacity:0} 6%{opacity:1} 55%{opacity:1} 100%{opacity:0}}
.mg-shout{
  position:fixed; z-index:48; pointer-events:none; white-space:nowrap; font:400 72px/.9 var(--f-display);
  color:var(--stamp); --r:-9deg; transform-origin:30% 70%; transform:rotate(var(--r));
  text-shadow:-4px 0 #fff, 4px 0 #fff, 0 -4px #fff, 0 4px #fff, 3px 3px #fff, -3px -3px #fff, 3px -3px #fff, -3px 3px #fff, 7px 8px 0 var(--ink);
  animation:mgShoutIn 1.3s cubic-bezier(.2,1.5,.4,1) both;
}
.mg-shout.small{font-size:40px}
/* Readable pickup messages sit above both the burst and its lettering. */
.toast{z-index:49}
@keyframes mgShoutIn{
  0%{opacity:0; transform:rotate(var(--r)) scale(.2)}
  14%{opacity:1; transform:rotate(var(--r)) scale(1.25)}
  26%{transform:rotate(var(--r)) scale(.96)}
  38%,80%{opacity:1; transform:rotate(var(--r)) scale(1)}
  100%{opacity:0; transform:rotate(var(--r)) scale(1.06)}
}
@media (prefers-reduced-motion:reduce){
  .sfx.poke, .sfx.stare, .mg-flash, .mg-shout{animation:none}
  .sfx.poke, .mg-flash, .mg-shout{display:none}
}

/* the cats on the menu and on their cards get a hard shadow too: one filter on one drawing */
body.sty-kawaii #paradeSvg .p-art{filter:drop-shadow(3px 3px 0 var(--ink))}

body.sty-kawaii .bookcat .bf{color:var(--ink)}

body.sty-kawaii #world .house-block{fill:url(#mgBlock)}

/* ---------- level of detail (see MANGA.lod) ---------- */
#stage[data-lod="mid"] .tnu, #stage[data-lod="mid"] .ish,
#stage[data-lod="far"] .tnu, #stage[data-lod="far"] .ish, #stage[data-lod="far"] .mgtone{visibility:hidden}
#stage[data-lod="far"] .dp-back{fill:var(--m-wall)}
#stage[data-lod="far"] .dp-side{fill:color-mix(in srgb, var(--m-wall) 78%, var(--tn-wall))}
#stage[data-lod="far"] .dp-ceil{fill:color-mix(in srgb, var(--m-wall) 62%, var(--tn-wall))}
#stage[data-lod="far"] .dp-floor, #stage[data-lod="far"] .dp-floor.f-wood{fill:var(--k-floor)}
#stage[data-lod="far"] .dp-floor.f-tile{fill:var(--k-metal)}
#stage[data-lod="far"] .dp-floor.f-soft{fill:var(--k-soft)}
#stage[data-lod="far"] #world .hf-far{fill:var(--k-hill-far)}
#stage[data-lod="far"] #world .hf-near{fill:var(--k-hill)}
#stage[data-lod="far"] #world .house-block{fill:var(--paper)}
/* @@manga-css-end */

   render this at 980px. Set it before anything measures the page.
   The page itself never zooms: the game pinches its own scene, and a page that
   zooms (by a pinch on a panel, or by tapping a field) looks like a web page
   rather than an app, and can be left wider than the screen. */
(function(){
  var m = document.querySelector('meta[name="viewport"]');
  if(!m){ m = document.createElement("meta"); m.name = "viewport"; document.head.appendChild(m) }

  /* ------------------------------ the hunted ------------------------------
     Ten cats, not one cat ten times. Each pose is a different silhouette AND
     implies a different hiding place — a loaf belongs on something warm, a
     curled cat on something soft, a high sitter on top of the wardrobe. That
     is the whole game: recognising where a cat would actually be. */
  /* ------------------------------ the decoys ------------------------------
     Every other lever makes the cat quieter. These make the room louder: a
     cushion with two pointed corners, a teapot whose spout and handle sit
     where ears would, and a pair of slippers that from the corner of the eye
     is a curled cat. None of them is a cat. Each one costs a glance before it
     is ruled out, which is the only thing here that adds work to the search
     rather than taking contrast away from the animal. */

  /* ------------------------------ the hunted ------------------------------
     Ten cats, not one cat ten times. Each pose is a different silhouette AND
     implies a different hiding place — a loaf belongs on something warm, a
     curled cat on something soft, a high sitter on top of the wardrobe. That
     is the whole game: recognising where a cat would actually be. */
  /* ------------------------------ the decoys ------------------------------
     Every other lever makes the cat quieter. These make the room louder: a
     cushion with two pointed corners, a teapot whose spout and handle sit
     where ears would, and a pair of slippers that from the corner of the eye
     is a curled cat. None of them is a cat. Each one costs a glance before it
     is ruled out, which is the only thing here that adds work to the search
     rather than taking contrast away from the animal. */

/* A breeze catches each cloth at a different moment. One transform per cloth,
   with a quiet interval between gusts; the pegs and posts stay still. */
function breezeTurn(cx, cy, amount, seconds, phase){
  var mags = [0, -.35, 1, .25, .6, 0, 0];
  return '<animateTransform attributeName="transform" type="rotate" values="' +
    mags.map(function(m){ return (m * amount).toFixed(2) + ' ' + cx + ' ' + cy }).join(';') +
    '" dur="' + seconds + 's" begin="-' + phase + 's" repeatCount="indefinite" ' +
    'calcMode="spline" keyTimes="0;.16;.36;.56;.7;.86;1" ' +
    'keySplines=".4 0 .6 1;.25 0 .4 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;0 0 1 1"/>';
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* Two streams, deliberately. `rnd` is the house: rooms, furniture, people,
   and where nine cats are hiding. `rndSky` is the weather: hills, clouds,
   stars, rain, lightning. They were one stream, which meant the sky and the
   house shared a position in it — so adding a cloud moved the furniture, and
   House #255 was only House #255 for as long as nobody touched the rain. A
   daily has to survive its own weather being edited. */
var rnd, rndSky, rndDecor;
function mf(a,b){return a+rndDecor()*(b-a)}
function rf(a,b){return a+rnd()*(b-a)}
function ri(a,b){return Math.floor(rf(a,b+1))}
function pick(arr){return arr[Math.floor(rnd()*arr.length)]}
function sf(a,b){return a+rndSky()*(b-a)}   /* rf, drawing from the sky */

var state = null;

function el(tag,attrs,inner){
  var n=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(var k in attrs) n.setAttribute(k,attrs[k]);
  if(inner) n.innerHTML=inner;
  return n;
}

/* place one object; returns its world-space box */
function place(layer, kind, x, yBottom, height, isTarget){
  var o = OBJ[kind];
  var s = height / o.h, w = o.w * s;
  var g = el("g", {"class":"obj"});
  g.dataset.kind = kind;
  /* A cat keeps its own coat — Marmalade is ginger wherever he is sitting —
     and the thing it is sitting on is washed over the top of it. Identity
     survives, contrast does not, which is the whole trick. */
  if(isTarget && CATS[kind] && CATS[kind].coat) g.style.setProperty("--coat", CATS[kind].coat);
  if(placingRoom >= 0) g.dataset.room = placingRoom;
  /* Street lights are on from dusk to dawn and off in daylight; indoor lamps
     are a household's business, and a household in broad daylight has very
     few of them on. */
  // Each decoration has its own seed: motion settings cannot move cats or
  // furniture by consuming a different number of layout random draws.
  var decorKey=kind.split("").reduce(function(n,c){return Math.imul(n,31)+c.charCodeAt(0)|0},0);
  rndDecor=mulberry32((seed ^ decorKey ^ Math.round(x*17) ^ Math.round(yBottom*23))|0);
  if(LAMPS[kind]){
    var on = kind === "streetlamp" ? (skyMode !== "day")
                                   : rndDecor() < (skyMode === "day" ? 0.08 : 0.5);
    if(on) g.classList.add("lit");
    g.style.setProperty("--flick", "-" + mf(0, 5.6).toFixed(2) + "s");
  }
  var art = el("g", {"class":artCls(kind,"art"), "data-sc":s.toFixed(4), transform:"translate("+x.toFixed(1)+" "+(yBottom-height).toFixed(1)+") scale("+s.toFixed(4)+")", "stroke-width":artW(kind,s)});
  /* The nudge animations drive a CSS transform on .w, and a CSS transform
     replaces an SVG transform attribute outright — so the wind gets its own
     group inside it rather than fighting for the same one. */
  art.appendChild(el("g",{"class":"w"}, dress(g, kind, MANGA.obj(kind, o), x, isTarget)));
  g.appendChild(art);
  MANGA.tune(art, kind, s);
  var pad = isTarget ? 9 : 5;
  g.appendChild(el("rect",{"class":"hit", x:(x-pad).toFixed(1), y:(yBottom-height-pad).toFixed(1), width:(w+pad*2).toFixed(1), height:(height+pad*2).toFixed(1)}));
  layer.appendChild(g);
  return {g:g, art:art, x:x, y:yBottom-height, w:w, h:height, kind:kind,
          inkTop:inkTopOf(kind, art) * s, room:placingRoom};
}

/* ---- what goes inside the object ----
   Four things want to move one drawing, and a CSS transform and an SVG
   transform attribute cannot share an element, so each gets a group of its
   own. Outermost first: .w is the nudge (CSS keyframes), .tip is the poke
   that left it crooked (a CSS transform that stays), .idle is what it does
   on its own, .wind is the weather. Only the ones a given object actually
   needs are built, so a bowl on a table is still a bowl on a table.

   A cat gets none of it. Everything here is motion, and motion in a still
   picture is exactly what the eye finds first — an animated cat would give
   itself away before the player had looked. */
function dress(g, kind, o, x, isTarget){
  var inner = windWrap(kind, o, x);
  if(isTarget || CATS[kind]) return inner;
  inner = parkMotion(kind, inner, x);
  if(currentLocation.id === "onsen") inner=HKKOnsen.motion(kind,inner,x,SW,REDUCED,breezeTurn);
  if(currentLocation.id === "harbour") inner=HKKHarbour.motion(kind,inner,x,SW,REDUCED,breezeTurn);
  if(currentLocation.id === "shopping") inner=HKKStreet.motion(kind,inner,x,SW,REDUCED,breezeTurn);
  if(currentLocation.id === "house") inner=HKKRoomArt.motion(kind,inner,x,SW,REDUCED,breezeTurn);
  inner = idleWrap(kind, o, inner);
  if(ALTER[kind] === "tip"){
    /* its own angle, so a landing hung with crooked frames is not a landing
       hung with the same crooked frame six times */
    g.style.setProperty("--tip", (mf(3.4, 6.6) * (rndDecor() < .5 ? -1 : 1)).toFixed(1) + "deg");
    inner = '<g class="tip">' + inner + '</g>';
  }
  return inner;
}

/* One idle, built from its shape: a list of magnitudes and the fraction of
   the cycle each one lands on. The negative begin starts every object part
   way through its own cycle, which is the whole trick — without it a row of
   chairs creaks in unison and the room reads as a flip-book. */
/* Only the small moving parts animate. Existing scene pause/reduced-motion
   handling also covers these SVG animations; no extra frame loop is needed. */
/* Keep trunks and ground lines still: only the crown bends in a park breeze.
   Decorative trees share this helper, so motion is visible across the whole map. */
function parkPlantWind(kind,o,x){
  if(REDUCED) return o.s;
  var phase=((x/SW)*6).toFixed(2), amount=weather === "breezy" ? 6 : 4;
  var inner=o.s.replace(/<use\b[^>]*\/>/g,"");
  if(kind === "tree" || kind === "treeSm"){
    var cx=kind === "tree" ? 78 : 50, cy=kind === "tree" ? 152 : 96;
    return inner.replace(/<path class="op"[^>]*\/>/,function(crown){
      return '<g class="park-canopy">'+crown+breezeTurn(cx,cy,amount,6.8,phase)+'</g>';
    });
  }
  if(kind === "bush") return '<g class="park-bush-wind">'+inner+
    breezeTurn(o.w/2,o.h,amount*.65,6.8,phase)+'</g>';
  return inner;
}
function parkMotion(kind, inner, x){
  if(currentLocation.id !== "park" || REDUCED) return inner;
  var phase=((x/SW)*8).toFixed(2);
  if(kind === "swing") inner=inner.replace('<g class="park-swing">',
    '<g class="park-swing">'+breezeTurn(110,26,9,6.8,phase));
  if(kind === "fountain") inner=inner.replace(/<path class="park-water park-jet"([^>]*?)\/>/,function(_,attrs){
    return '<path class="park-water park-jet"'+attrs+'>'+
      '<animate attributeName="d" values="M102 48V21q8-14 16 0v27Z;M102 48V12q8-18 16 0v36Z;M102 48V24q8-12 16 0v24Z;M102 48V21q8-14 16 0v27Z" dur="2.4s" begin="-'+phase+'s" repeatCount="indefinite"/></path>';
  }).replace(/<path class="park-jet-stream"([^>]*?)\/>/,function(_,attrs){
    return '<path class="park-jet-stream"'+attrs+'><animate attributeName="stroke-dashoffset" values="0;-22" dur="1.3s" begin="-'+phase+'s" repeatCount="indefinite"/></path>';
  }).replace(/<path class="park-flow-streak"([^>]*?)\/>/,function(_,attrs){
    return '<path class="park-flow-streak"'+attrs+'><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" begin="-'+phase+'s" repeatCount="indefinite"/></path>';
  }).replace(/<circle class="park-drop"([^>]*?)\/>/g,function(_,attrs){
    var lag=attrs.indexOf('147')>=0 ? .55 : 0;
    return '<circle class="park-drop"'+attrs+'><animate attributeName="cy" values="86;116" dur="1.1s" begin="-'+(+phase+lag)+'s" repeatCount="indefinite"/>'+
      '<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.75;1" dur="1.1s" begin="-'+(+phase+lag)+'s" repeatCount="indefinite"/></circle>';
  }).replace(/<ellipse class="park-basin-ring"([^>]*?)\/>/g,function(_,attrs){
    return '<ellipse class="park-basin-ring"'+attrs+'>'+
      '<animate attributeName="rx" values="7;29" dur="1.8s" begin="-'+phase+'s" repeatCount="indefinite"/>'+
      '<animate attributeName="ry" values="2;7" dur="1.8s" begin="-'+phase+'s" repeatCount="indefinite"/>'+
      '<animate attributeName="opacity" values=".9;0" dur="1.8s" begin="-'+phase+'s" repeatCount="indefinite"/></ellipse>';
  });
  if(kind === "picnic") inner=inner.replace('<g class="park-tablecloth">',
    '<g class="park-tablecloth">'+breezeTurn(110,38,6,6.8,phase));
  // Flowers catch the wind while their planter stays firmly on the lawn.
  if(kind === "flowerbed") inner=inner.replace('<g class="park-petals">',
    '<g class="park-petals">'+breezeTurn(70,61,7,6.8,phase));
  if({parkBlossom:1,parkWildflowers:1,parkFlowerArch:1,parkPinwheel:1}[kind]) inner=inner.replace(/<use\b[^>]*\/>/g,"");
  var partTurns={
    parkGazebo:["pk-bunting",180,112,3.5],parkFlowerArch:["pk-arch-flowers",110,100,3],
    parkRefreshmentCart:["pk-cart-cloth",130,32,6],parkBlossom:["pk-blossom-crown",117,178,5],
    parkPlayCastle:["pk-play-flag",117,4,9],parkWildflowers:["pk-wildflower-heads",90,104,7]
  }, part=partTurns[kind];
  if(part) inner=inner.replace('<g class="'+part[0]+'">','<g class="'+part[0]+'">'+breezeTurn(part[1],part[2],part[3],6.8,phase));
  if(kind === "parkPinwheel") inner=inner.replace('<g class="pk-pinwheel">',
    '<g class="pk-pinwheel"><animateTransform attributeName="transform" type="rotate" values="0 58 55;140 58 55;360 58 55" keyTimes="0;.45;1" dur="7s" begin="-'+phase+'s" repeatCount="indefinite"/>');
  if(kind === "parkBirdbath") inner=inner.replace('<g class="pk-perched-bird">',
    '<g class="pk-perched-bird">'+breezeTurn(90,37,6,9.5,phase));

  if(kind === "parkConservatory") inner=inner.replace('<g class="pk-greenhouse-leaves">','<g class="pk-greenhouse-leaves">'+breezeTurn(180,237,3.5,7.8,phase));
  if(kind === "parkFlowerClock") inner=inner.replace('<g class="pk-clock-hand">','<g class="pk-clock-hand"><animateTransform attributeName="transform" type="rotate" from="0 110 71" to="360 110 71" dur="60s" repeatCount="indefinite"/>');
  if(kind === "parkPlayTrain") inner=inner.replace('<g class="pk-train-steam">','<g class="pk-train-steam"><animateTransform attributeName="transform" type="translate" values="0 0;4 -16;0 -25" dur="3.8s" begin="-'+phase+'s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="3.8s" begin="-'+phase+'s" repeatCount="indefinite"/>');
  return inner;
}
function idleWrap(kind, o, inner){
  var d = IDLE[kind]; if(!d) return inner;
  var shp = IDLE_SHAPE[d[0]]; if(!shp) return inner;
  var amt = d[1] * mf(0.8, 1.25), T = d[2] * mf(0.85, 1.18);
  var cx = (o.w/2).toFixed(1), type, vals;

  if(shp.kind === "rotate"){
    var py = shp.org === "base" ? o.h : (o.h/2).toFixed(1);
    type = "rotate";
    vals = shp.mags.map(function(m){ return (amt*m).toFixed(2)+" "+cx+" "+py });
  } else if(shp.kind === "shiftY"){
    var dy = o.h * amt / 100;
    type = "translate";
    vals = shp.mags.map(function(m){ return "0 " + (dy*m).toFixed(2) });
  } else {                                   /* squash: scaleY about the base */
    type = "scale";
    vals = shp.mags.map(function(m){ return "1 " + (1 - amt*m/100).toFixed(4) });
  }

  var anim = '<animateTransform attributeName="transform" type="' + type + '" ' +
    'values="' + vals.join(";") + '" ' +
    'keyTimes="' + shp.times.map(function(t){ return t.toFixed(4) }).join(";") + '" ' +
    'dur="' + T.toFixed(2) + 's" begin="-' + mf(0.1, T).toFixed(2) + 's" ' +
    'calcMode="spline" keySplines="' +
    shp.mags.slice(1).map(function(){ return "0.35 0 0.5 1" }).join(";") + '" ' +
    'repeatCount="indefinite"/>';

  /* scale turns about (0,0), so the base has to be moved there and back */
  if(type === "scale")
    return '<g class="idle" transform="translate(0 ' + o.h + ')"><g>' +
           '<g transform="translate(0 -' + o.h + ')">' + inner + '</g>' + anim + '</g></g>';
  return '<g class="idle">' + inner + anim + '</g>';
}

/* ---- gusts ----
   Wind does not blow at one steady rate, and a garden that sways continuously
   reads as a screensaver. Each cycle is one gust followed by a rest: a fast
   shove, a couple of diminishing recoils, then near stillness for the
   remainder. A calm evening is mostly rest; a storm is mostly gust, and comes
   round twice as often.

   Every plant shares the cycle length and differs only by a lag taken from its
   position, so a gust arrives at the left of the garden first and crosses it.
   That is what makes it read as one wind moving through, rather than each
   plant having weather of its own. */
function windWrap(kind, o, x){
  var caught = WINDY[kind];
  var out = placingRoom >= 0 && ROOMS[placingRoom] && ROOMS[placingRoom].outside;
  if(currentLocation.id === "park" && caught) return parkPlantWind(kind,o,x);
  if(!caught || !out || !windLevel || REDUCED) return o.s;

  var stormy = windLevel > 1.2;
  var a = WIND_DEG * windLevel * caught * (0.85 + rndDecor()*0.3);
  var T = stormy ? 4.6 : 9.5;            /* how often a gust comes round */
  var g = stormy ? 0.80 : 0.38;          /* how much of the cycle it occupies */
  var lag = (x / SW) * (stormy ? 0.9 : 1.9);

  var px = (o.w/2).toFixed(1), py = o.h;
  function at(m){ return (a*m).toFixed(2) + " " + px + " " + py }
  var mags  = [0, 1, 0.30, 0.85, 0.15, 0.06, 0.11, 0];
  var times = [0, 0.20*g, 0.38*g, 0.60*g, 0.80*g, g, g + (1-g)*0.55, 1];

  return '<g class="wind">' + o.s +
    '<animateTransform attributeName="transform" type="rotate" ' +
    'values="' + mags.map(at).join(";") + '" ' +
    'keyTimes="' + times.map(function(t){ return t.toFixed(4) }).join(";") + '" ' +
    'dur="' + T + 's" begin="-' + Math.max(0.01, T - lag).toFixed(2) + 's" ' +
    'calcMode="spline" keySplines="0.15 0.6 0.4 1;0.4 0 0.6 1;0.3 0 0.6 1;' +
    '0.4 0 0.6 1;0.4 0 0.7 1;0.4 0 0.6 1;0.4 0 0.6 1" ' +
    'repeatCount="indefinite"/></g>';
}

function stairPath(x, y, w, h, n){
  /* Rises the full height of the room, so the top tread meets the underside
     of the floor above instead of stopping in mid-air. Treads and a stringer,
     nothing else — the way the packaging draws it. */
  var d = "M"+x+" "+y, cx = x, cy = y, sw = w/n, sh = h/n, i;
  for(i=0;i<n;i++){ cy -= sh; d += "V"+cy.toFixed(1); cx += sw; d += "H"+cx.toFixed(1); }
  return '<path d="'+d+'" stroke-width="3"/>' +
         '<path d="M'+x+' '+y+'L'+(x+w).toFixed(1)+' '+(y-h).toFixed(1)+'" stroke-width="3"/>';
}

function build(seed){
  rnd = mulberry32(seed);
  /* Derived so each house keeps its own weather, and offset so the two
     streams never walk in step. */
  rndSky = mulberry32((seed ^ 0x9E3779B9) | 0);
  var bg=document.getElementById("bg"), objL=document.getElementById("objects"),
      tgtL=document.getElementById("targets"), fx=document.getElementById("fx");
  bg.innerHTML=""; objL.innerHTML=""; tgtL.innerHTML=""; fx.innerHTML="";

  var placed = [];
  var curOutside = false;   /* set per room as the generator walks the house */
  /* records where a thing sits, so targets can only hide somewhere real */
  function put(layer, kind, x, yB, h, base){
    var r = place(layer, kind, x, yB, h);
    r.base = base;
    r.out = curOutside;
    placed.push(r);
    return r;
  }

  /* The camera can drift most of a screen past any edge of the world, so the
     sky, the hills and the ground run on well past it. Stopping at the edge
     left a coloured block with bare paper round it. */
  var reach = SW;
  var mo = MANGA.outside(bg, reach, skyPaint());

  /* --- the sky, and the hills on the horizon, behind everything --- */
  (function(){
    /* The hour's colours go on #world, so a cat standing in the garden can be
       washed toward the hill behind it the same way an indoor cat is washed
       toward the wall. The sky is a gradient in the hour's two colours, from
       the top of the house down to the horizon. */
    var paint = skyPaint(), world = document.getElementById("world");
    world.style.setProperty("--k-hill", paint.hill);
    world.style.setProperty("--k-hill-far", paint.hillFar);
    world.style.setProperty("--k-cloud", paint.cloud);
    world.style.setProperty("--k-grass", paint.grass);
    world.style.setProperty("--k-soil", paint.soil);
    bg.appendChild(el("linearGradient", {id:"skyGrad", gradientUnits:"userSpaceOnUse",
      x1:0, y1:0, x2:0, y2:GROUND - 700},
      '<stop offset="0" stop-color="' + paint.top + '"/>' +
      '<stop offset="1" stop-color="' + paint.low + '"/>'));
    bg.appendChild(el("rect", {"class":"skyfill", fill:"none", stroke:"none",
      x:-reach, y:-SH*2, width:SW + reach*2, height:GROUND + SH*2}));
    mo.sky(bg, -reach, -420, SW + reach*2, GROUND - 700 + 420);

    /* Two passes per ridge: a silent fill that hides whatever is behind it,
       and the ridge line itself. Closing the filled path also strokes its
       bottom and sides, which drew a great box across the sky.
       The run past each end of the world comes off its own stream: drawing it
       from the sky's would move every cloud and star in every house. */
    var rndWing = mulberry32((seed ^ 0x27D4EB2F) | 0);
    function ridge(baseY, amp, step){
      var d, x;
      function hump(w, lift){
        d += "Q" + (x + w/2).toFixed(0) + " " + (baseY - amp*(0.45 + lift)).toFixed(0) +
             " " + (x + w).toFixed(0) + " " + baseY;
        x += w;
      }
      /* the left run is dealt first and then stretched to land exactly where
         the ridge has always started */
      var left = [], sum = 0;
      while(sum < reach){
        var lw = step * (0.75 + rndWing()*0.8);
        left.push([lw, rndWing()]); sum += lw;
      }
      x = -80 - reach; d = "M" + x + " " + baseY;
      left.forEach(function(h){ hump(h[0] * reach/sum, h[1]) });
      x = -80;
      while(x < SW + 80){
        var w = step * (0.75 + rndSky()*0.8);
        hump(w, rndSky()*1.0);
      }
      var end = x + reach;
      while(x < end){
        var rw = step * (0.75 + rndWing()*0.8);
        hump(rw, rndWing());
      }
      return {line:d, fill:d + "L" + x.toFixed(0) + " " + GROUND + "H" + (-80 - reach) + "Z"};
    }
    /* The horizon sits above everything standing in the garden — the tallest
       outdoor thing is ~560 tall, so a baseline 660 up means no tree, lamp or
       roofline ever crosses a ridge. Distance, not clutter. */
    [[GROUND - 700, 230, 900, "hillFar", "hf-far"], [GROUND - 660, 130, 620, "hillNear", "hf-near"]]
    .forEach(function(h){
      var r = ridge(h[0], h[1], h[2]);
      bg.appendChild(el("path", {"class":h[4], fill:"var(--paper)", stroke:"none", d:r.fill}));
      bg.appendChild(el("path", {"class":h[3]+" shl", fill:"none", "stroke-width":shellW(), d:r.line}));
    });
  })();

  if(currentLocation.id === "onsen") HKKOnsen.landscape(bg,el,SW,SH,seed,REDUCED);
  if(currentLocation.id === "harbour") HKKHarbour.landscape(bg,el,SW,SH,seed,REDUCED);
  if(currentLocation.id === "park") parkLandscape(bg);
  if(currentLocation.id === "shopping") HKKStreet.landscape(bg,el,SW,SH,seed,REDUCED);
  /* the house itself blocks the view of them */
  (function(){
    if(isOpenLocation()) return;
    var lx = HX + 24, rx = HX + HW - 24, r1 = lx + 400, r2 = rx - 400;
    bg.appendChild(el("path", {"class":"house-block", fill:"var(--paper)", stroke:"none",
