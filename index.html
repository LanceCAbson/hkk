  /* a decoy: nudge it, no penalty — poking the house is half the fun */
  var cls = NUDGE[g.dataset.kind] || "n-rock";
  g.classList.remove(cls); g.getBoundingClientRect(); g.classList.add(cls);
  setTimeout(function(){ g.classList.remove(cls) }, NUDGE_MS[cls] || 700);
  var v = NUDGE_SFX[cls]; if(v) beep(v[0] + (Math.random()*40-20), v[1], v[2], v[3]);
  MANGA.poke(g);

  /* and some of them do not spring back. The frame stays crooked, the lid
     stays off, the tap goes on running until somebody turns it off. The
     second sound lands late so it reads as a consequence of the poke rather
     than part of it. */
  var alt = ALTER[g.dataset.kind];
  if(alt){
    var on = g.classList.toggle("alt");
    var a = ALTER_SFX[alt][on ? 0 : 1];
    setTimeout(function(){ beep(a[0] + (Math.random()*30-15), a[1], a[2], a[3]) }, 110);
  }
  misses++;
}

function reveal(rec){
  rec.found = true; rec.at = elapsed();
  rec.g.classList.add("found");
  MANGA.burst(rec, true);
  found++;
  var unlocked = recordFind(rec.kind);

  var fx = document.getElementById("fx");

  if(rec.out && !isOpenLocation()){
    /* it was out in the garden — see it home */
    rec.g.style.transition = "opacity .35s";
    rec.g.style.opacity = "0";
    /* without the walk it is simply in, and still in the room it came into */
    if(!REDUCED) sendCatHome(rec);
    else {
      var near = doors.find(function(d){ return d.out === (rec.cx < HX + HW/2 ? -1 : 1) }) || doors[0];
      var spot = near && homeSpot(rec, near);
      if(spot) seatCat(rec, spot);
    }
    fx.appendChild(el("circle",{"class":"stamp", cx:rec.cx, cy:rec.cy, r:14}));
    fillSlot(rec.kind);
    var tn0 = document.getElementById("tallyN"); if(tn0) tn0.textContent = found;
    document.getElementById("count").textContent = found+"/"+targets.length;
    sfxFound(found);
    darkenProgress();
    toast(CATS[rec.kind].name + " is coming in");
    foundFlourish(rec, unlocked, function(){
      if(found === targets.length) tryFinish();
    });
    return;
  }

  /* second ink pass: the same linework, printed in red, slightly out of register */
  var dup = rec.art.cloneNode(true);
  dup.setAttribute("class","art pass2");
  dup.dataset.kind = rec.kind;              /* so a skin change redraws it too */
  var s = rec.h/OBJ[rec.kind].h;
  dup.setAttribute("transform","translate("+(rec.x+2.2).toFixed(1)+" "+(rec.y-2.2).toFixed(1)+") scale("+s.toFixed(4)+")");
  fx.appendChild(dup);
  fx.appendChild(el("circle",{"class":"stamp", cx:rec.cx, cy:rec.cy, r:14}));
  markFound(rec);

  fillSlot(rec.kind);
  var tn = document.getElementById("tallyN"); if(tn) tn.textContent = found;
  document.getElementById("count").textContent = found+"/"+targets.length;
  sfxFound(found);
  darkenProgress();
  toast(CATS[rec.kind].name + occasion.foundMsg);
  foundFlourish(rec, unlocked, function(){
    if(found === targets.length) tryFinish();
  });
  settleIndoorCat(rec);
}

/* a tick that stays on whatever was found, at its top corner */
function markFound(rec){
  var r = Math.max(7.5, Math.min(11, rec.h * 0.3)), k = r / 6;
  var g = el("g", {"class":"found-mark", transform:"translate(" + (rec.x + rec.w - r*0.6).toFixed(1) +
                   " " + (rec.y + r*0.6).toFixed(1) + ")"});
  var inner = el("g", {});
  inner.appendChild(el("circle", {r:r.toFixed(1)}));
  inner.appendChild(el("path", {d:"M" + (-2.9*k).toFixed(2) + " " + (0.2*k).toFixed(2) +
    "L" + (-0.8*k).toFixed(2) + " " + (2.3*k).toFixed(2) + "L" + (3*k).toFixed(2) + " " + (-2.1*k).toFixed(2),
    "stroke-width":(1.8*k).toFixed(2)}));
  g.appendChild(inner);
  document.getElementById("fx").appendChild(g);
}

/* A thing is a small find of its own. It pops, a ring lands on it, and it
   says its line, long enough to be read. It costs nothing and changes nothing
   about the night: no time, no tally slot, no closing scene. */
function findThing(rec){
  rec.found = true;
  rec.g.classList.add("found");
  thingsFound++;
  recordThing();
  document.getElementById("fx").appendChild(
    el("circle",{"class":"stamp", cx:rec.cx, cy:rec.cy, r:10}));
  markFound(rec);
  MANGA.burst(rec, false);
  flyToTray(rec, showThingCount);
  beep(880, .07, "sine", .05);
  setTimeout(function(){ beep(1320, .09, "sine", .035) }, 70);
  var last = thingsFound === things.length;
  var ms = quip(rec, last);
  if(!last) return;
  /* Found after the night was over: the card comes back with the full count
     on it, which is the only ending the extra looking gets. */
  if(afterHours) setTimeout(function(){
    if(!afterHours) return;
    afterHours = false;
    showCard(nightSecs);
  }, ms);
}

/* The thing's line, in its own card: up long enough to read at an easy pace
   (longer lines stay longer), gone at a tap, and a second find replaces it. */
function quip(rec, last){
  var q = document.getElementById("quip");
  if(!q) return 0;
  var m = THINGS[rec.kind];
  q.innerHTML = '<div class="quip-pic">' + chipArt(rec.kind, "tr-col") + '</div>' +
    '<div class="quip-txt"><span class="quip-tag">Bonus \u00b7 ' + m.name + '</span>' +
    '<p>' + rec.line + '</p>' + (last ? '<em>That is every last thing.</em>' : '') + '</div>';
  q.querySelector(".tr-col").style.opacity = "1";
  q.classList.remove("show", "swept"); q.getBoundingClientRect(); q.classList.add("show");
  var ms = Math.max(3200, 1600 + rec.line.length * 45) + (last ? 1200 : 0);
  clearTimeout(quip._t);
  quip._t = setTimeout(hideQuip, ms);
  if(!quip._wired){
    quip._wired = true;
    q.addEventListener("click", function(e){ e.stopPropagation(); hideQuip() });
    q.addEventListener("pointerdown", function(e){ e.stopPropagation() });
  }
  return ms;
}
function hideQuip(){
  var q = document.getElementById("quip");
  if(q) q.classList.remove("show");
  clearTimeout(quip._t);
}
/* A swipe or a pinch means the player is looking at the house again: whatever is up over it goes
   now, the cat's card flying down to the gauge and a thing's card sliding off the bottom, instead
   of waiting out its time. */
function sweepPopups(){
  if(foundFlourish._close) foundFlourish._close(false);
  var q = document.getElementById("quip");
  if(q && q.classList.contains("show")){ hideQuip(); q.classList.add("swept") }
}

function showThingCount(){
  Array.prototype.forEach.call(document.querySelectorAll(".chip.thing"), function(b){
    var kind = b.dataset.kind;
    var all = things.filter(function(t){ return t.kind === kind });
    var left = all.filter(function(t){ return !t.found }).length, have = all.length - left;
    var n = b.querySelector(".n"); if(n) n.innerHTML = "<b>" + have + "</b>/" + all.length;
    b.classList.toggle("part", have > 0 && left > 0);
    b.classList.toggle("got", !left);
    b.setAttribute("aria-label", THINGS[kind].name + (left ? ", " + have + " of " + all.length + " found" : ", all found") +
      ". Bonus. Tap for a clue.");
  });
  var n = document.getElementById("tallyThings"); if(n) n.textContent = thingsFound;
  showProgress();
}

/* One gauge cell for each cat home, in that cat's colour and in the order they came in. The bonus
   things are a count of their own and never move this: the night ends when the cats are in, not the lot. */
function showProgress(){
  Array.prototype.forEach.call(document.querySelectorAll("#trCells i"), function(c, i){
    var k = landed[i];
    c.classList.toggle("on", !!k);
    if(k){ c.dataset.kind = k; c.style.setProperty("--c", CATS[k].coat) }
    else { delete c.dataset.kind; c.style.removeProperty("--c") }
  });
  var cc = document.getElementById("cntCats");
  if(cc) cc.classList.toggle("full", targets.length > 0 && found === targets.length);
  var cb = document.getElementById("cntBonus");
  if(cb) cb.classList.toggle("full", things.length > 0 && thingsFound === things.length);
}

/* Offered only where there is a shell, an initialised SDK and something left
   to find. Everywhere else the button behaves exactly as it always has. */
function canOfferAdHint(){
  return ADS.native() && ADS.isReady() && (!done || afterHours);
}

/* The Hint button no longer spends anything by itself: it opens the clue for
   the next cat, which is free, and "show me" in there is the paid part. After
   the night it does the same for the next thing still lying about. */
function useHint(){
  if(done && !afterHours) return;
  var rec = targets.find(function(t){ return !t.found });
  if(rec){ clue(chipFor(rec), rec); return }
  var th = afterHours && things.find(function(t){ return !t.found });
  if(th) clue(chipFor(th), null, th.kind);
}

/* the paid hint, for whatever the player picked in the tray */
function showMe(rec){
  if(!rec || rec.found) return;
  if(canOfferAdHint()){ askHowToPay(rec); return }
  /* the clock has stopped, so there is nothing left to charge */
  grantHint(rec, !!afterHours);
}

/* A sheet rather than a confirm: the player has three answers, not two, and
   backing out has to be as easy as the other two. */
function askHowToPay(rec){
  var old = document.getElementById("sheet"); if(old) old.remove();
  var sheet = document.createElement("div");
  sheet.className = "sheet"; sheet.id = "sheet";
  sheet.innerHTML =
    '<div class="sheet-in" role="dialog" aria-modal="true" aria-label="A hint">' +
      '<h3 class="hint-h">Need a hand?</h3>' +
      '<p class="hint-p">The search will show you roughly where ' +
        (CATS[rec.kind] ? CATS[rec.kind].name + ' is.' : 'it is.') + '</p>' +
      '<div class="hint-choice">' +
        '<button class="primary wide" id="hintAd">Watch a short ad</button>' +
        /* after the night there is no clock to pay with */
        (afterHours ? '' : '<button class="wide" id="hintPay">Take the 15 seconds</button>') +
        '<button class="wide" id="hintNo">Never mind</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(sheet);

  function close(){ sheet.remove(); document.removeEventListener("keydown", onKey) }
  function onKey(e){ if(e.key === "Escape") close() }
  sheet.addEventListener("click", function(e){ if(e.target === sheet) close() });
  document.addEventListener("keydown", onKey);

  document.getElementById("hintNo").addEventListener("click", close);
  var pay = document.getElementById("hintPay");
  if(pay) pay.addEventListener("click", function(){
    close(); grantHint(rec, false);
  });
  document.getElementById("hintAd").addEventListener("click", function(){
    close();
    toastHold("Finding an ad\u2026");
    /* The clock is wall-clock from t0, so half a minute of advertising would
       cost more than the fifteen seconds this is meant to save. Whatever the
       ad takes is handed straight back by moving the start. */
    var began = Date.now();
    ADS.rewarded().then(function(result){
      t0 += Date.now() - began;
      dismissToast();
      /* An ad that was shown and closed early did not pay for anything. The
         time is handed back and nothing is charged, and the button is still
         there for another go. */
      if(result === "skipped"){ toast("Ad closed early \u00b7 no hint this time", 2600); return }
      /* No fill, or an ad that never arrived, is the network's problem and not
         the player's. They asked for a hint and agreed to the terms; they get
         the hint. The alternative is charging somebody fifteen seconds for
         being on a bad connection. */
      grantHint(rec, true, result === "earned" ? null : "No ad just now \u00b7 have it anyway");
    });
  });
  document.getElementById("hintAd").focus({preventScroll:true});
  beep(560, .07, "sine", .035);
}

function grantHint(rec, free, note){
  if((done && !afterHours) || rec.found) return;
  /* after the night, a hint changes nothing about the night */
  if(!done){ hints++; if(!free) penalty += 15 }
  MEASURE.event("hint_used", {paid_with: done ? "after_hours" : free ? "ad" : "seconds",
                              found: found, target: CATS[rec.kind] ? "cat" : "thing"});
  rec.hinted = true;
  MANGA.stare(rec);
  var fx = document.getElementById("fx");
  var b = el("circle",{"class":"beacon", cx:rec.cx, cy:rec.cy, r:150});
  fx.appendChild(b);
  setTimeout(function(){ b.remove() }, 4200);
  /* ease the view toward the neighbourhood, not onto the object */
  var tx = cw/2 - rec.cx*view.k, ty = ch/2 - rec.cy*view.k;
  var sx=view.x, sy=view.y, t=0;
  var anim = setInterval(function(){
    t += 0.08; if(t>=1){ t=1; clearInterval(anim) }
    var e = 1-Math.pow(1-t,3);
    view.x = sx+(tx-sx)*e; view.y = sy+(ty-sy)*e; clampView(); applyView();
  }, 16);
  toast(note || (free ? "Somewhere in that circle" : "Somewhere in that circle \u00b7 +15s"));
  beep(320,.18,"sine",.06);
}

/* Found is not the same as home: the night ends once the last cat found in
   the garden has walked in, which takes a moment and needs nothing from the
   player. */
var wantFinish = false;
function tryFinish(){
  if(done) return;
  if(walkers.length){
    wantFinish = true;
    return;
  }
  wantFinish = false;
  finish();
}

function meow(){
  beep(680, .12, "sine", .05);
  setTimeout(function(){ beep(545, .19, "sine", .045) }, 115);
}

/* ---- the closing scene ----
   The tally hitting eight is information. Every cat you spent the evening
   looking for turning up in one room — to a bowl, a basket or a carrier,
   depending on why you were looking — is the thing the player was actually
   doing it for. */
function gather(occ){
  var room = ROOMS.find(function(r){ return r.id === occ.room && !r.outside }) ||
             ROOMS.find(function(r){ return r.id === "hall" }) ||
             ROOMS.find(function(r){ return !r.outside }) ||
             (isOpenLocation() && ROOMS.find(function(r){return r.id === occ.room}));
  if(!room) return null;
  var g = el("g", {});
  document.getElementById("fx").appendChild(g);

  var n = Math.min(5, targets.length);
  var floorY = room.y + room.h, step = (room.w - 120) / n;

  function lay(cls, kind, x, bottom, hgt, delay){
    var o = OBJ[kind], sc = hgt/o.h;
    var outer = el("g", {"class":"sup-item", style:"animation-delay:" + delay.toFixed(2) + "s" +
      (CATS[kind] && CATS[kind].coat ? ";--coat:" + CATS[kind].coat : "")});
    var mid = el("g", {"class":artCls(kind,""), transform:"translate(" + x.toFixed(1) + " " + (bottom - hgt).toFixed(1) +
                       ") scale(" + sc.toFixed(4) + ")", "stroke-width":artW(kind,sc)});
    mid.appendChild(el("g", {"class":"sup-bob " + cls,
      style:"animation-delay:" + (delay + Math.random()*0.4).toFixed(2) + "s"}, o.s));
    outer.appendChild(mid); g.appendChild(outer);
    return o.w * sc;
  }

  for(var i = 0; i < n; i++){
    var x = room.x + 60 + step*i, d = i*0.13;
    var pose = occ.poses[i % occ.poses.length];
    var pw = OBJ[occ.prop].w * (occ.propH / OBJ[occ.prop].h);
    if(occ.on === "in"){
      /* asleep IN the thing: the prop goes down first and the cat settles into
         it, sitting low enough that the rim passes in front of its feet */
      lay("", occ.prop, x, floorY, occ.propH, d);
      var chw = OBJ[pose].w * (40 / OBJ[pose].h);
      lay("sup-cat", pose, x + (pw - chw)/2, floorY - occ.propH*0.42, 40, d + 0.2);
    } else {
      var cw2 = lay("sup-cat", pose, x, floorY, 46, d + 0.2);
      lay("", occ.prop, x + cw2 + 5, floorY, occ.propH, d);
    }
  }
  return {cx:room.x + room.w/2, cy:floorY - 100};
}

/* The last cat stepping through the door is the moment the whole night was
   for, and it used to go by unremarked on its way to the paperwork. The roll
   call across the bottom of the screen is where the player has watched the
   faces go red one at a time; this brings the finished set forward for a beat,
   before the payoff card arrives to say what the night was about. */
function allHomeFlourish(){
  var old = document.getElementById("allHome");
  if(old) old.remove();
  var faces = targets.map(function(t, i){
    return '<span style="animation-delay:' + (i * 0.042).toFixed(3) + 's">' +
      faceSvg(t.kind) + '</span>';
  }).join("");
  var w = document.createElement("div");
  w.className = "all-home"; w.id = "allHome";
  w.setAttribute("role", "status");
  w.setAttribute("aria-label", isOpenLocation() ? "Every cat is found" : "Every cat is home");
  w.innerHTML = '<div class="ah-in"><div class="ah-faces" aria-hidden="true">' + faces +
    '</div><p>The whole household</p><p class="ah-cue">Tap to continue</p></div>';
  document.body.appendChild(w);
}

function finish(){
  done = true;
  doors.forEach(function(d){ setDoor(d, false) });   /* shut up for the night */
  var secs = elapsed();
  nightSecs = secs;
  sfxWin();
  recordNight(secs);
  GROW.refresh();
  MEASURE.event("night_done", {mode: isDaily ? "daily" : "free", secs: Math.round(secs),
                               hints: hints, misses: misses, cats: targets.length,
                               things: thingsFound});
  /* fire and forget: a board that is down must never hold up the closing scene.
     The finds go up for anybody with a name; the time only for somebody who
     has said they want it on the speed board. */
  if(isDaily){
    RANKS.sync();
    RANKS.submit(secs, hints, seed).then(function(posted){
      if(posted) MEASURE.event("score_posted", {secs: Math.round(secs), hints: hints});
    });
  }
  if(isDaily){
    try{ localStorage.setItem("wtc-"+seed, JSON.stringify({t:secs,h:hints,m:misses})) }catch(e){}
  }
  /* Three beats, in the order they matter: bowls down, then the whole dark
     house in one frame, then the paperwork. */
  var sup = gather(occasion);

  /* Three beats, in the order they matter, and each one held until the player
     has actually finished with it: the household, then what the night was
     about, then the paperwork. The camera still moves on its own — that is
     scenery, not something to be read. */
  if(sup && !REDUCED){
    toast(occasion.eyebrow);
    animateTo(Math.min(2.2, Math.max(fitK, playK()*1.08)), sup.cx, sup.cy, 900);
  } else {
    animateTo(overviewK(), SW/2, SH/2, 1100);
  }

  allHomeFlourish();
  awaitTap(function(){
    var pop = document.getElementById("allHome");
    if(pop && pop.parentNode) pop.parentNode.removeChild(pop);
    if(sup && !REDUCED) animateTo(overviewK(), SW/2, SH/2, 1100);
    titleCard(occasion.payoff, occasion.payoffSub);
    awaitTap(function(){
      hideTitleCard();
      showCard(secs);
    });
  });
}

function shareGrid(){
  /* spoiler-free, and about care rather than speed: blue you spotted yourself,
     amber the house had to point out */
  var order = targets.slice().filter(function(t){return t.found}).sort(function(a,b){return a.at-b.at});
  /* escaped rather than literal: this file ships without a <head>, so a host
     that serves it as latin-1 would turn the grid into mojibake */
  return order.map(function(t){ return t.hinted ? "\uD83D\uDFE8" : "\uD83D\uDFE6" }).join("");
}

function showCard(secs){
  hideTitleCard();
  MUSIC.to("menu");
  var grid = shareGrid();
  var wrap = document.createElement("div");
  wrap.className = "overlay"; wrap.id = "overlay";
  /* the last thing the player reads, and the only place each cat gets the
     final word — a different one of its three lines depending on why you
     spent the evening looking for it */
  var roll = targets.map(function(t){
    var c = CATS[t.kind];
    return '<li><span class="vface">' + faceSvg(t.kind) + '</span>' +
           '<span class="vtxt"><b>' + c.name + '</b>' +
           (c[occasion.line] || c.bio) + '</span></li>';
  }).join("");
  /* The card's last job is a reason to come back tomorrow: a run that is worth
     not breaking, and whatever the household has just agreed to tell you. The
     streak is read after recordNight, so it already counts tonight. */
  var st = loadStats();
  var ribbon = isDaily
    ? ((st.streak || 0) > 1
        ? '<b>' + st.streak + ' days running.</b> Come back tomorrow and it is ' + (st.streak + 1) + '.' +
          (st.restDay === seed - 1 ? ' A quiet day in between did not break it.' : '')
        : '<b>Today is stamped.</b> A new destination awaits tomorrow.')
    : '<b>A practice search.</b> The daily one is the one that keeps the streak.';
  /* Naming them is the reward, but on a first night nearly every cat crosses
     its first threshold at once — and nine names in a row is a list, not a
     reward. Past three, the count says it better. */
  var learned = unlockedTonight.map(function(u){ return CATS[u.kind].name });
  if(learned.length === 1){
    ribbon += ' New in the Catbook: ' + learned[0] + '.';
  } else if(learned.length > 1 && learned.length <= 3){
    ribbon += ' New in the Catbook: ' + learned.slice(0, -1).join(", ") +
              ' and ' + learned[learned.length - 1] + '.';
  } else if(learned.length){
    ribbon += ' ' + learned.length + ' of them told you something new.';
  }

  wrap.innerHTML =
    '<div class="card result-card" role="dialog" aria-modal="true" aria-label="Search complete">'+
      '<p class="eyebrow">' + occasion.eyebrow + '</p>'+
      '<h2>' + occasion.title + '</h2>'+
      '<p class="lede">' + occasion.lede + '</p>'+
      '<div class="result-home"><span aria-hidden="true">&#10003;</span><b>' + targets.length + (isOpenLocation() ? ' cats found</b></div>' : ' cats home</b></div>') +
      '<div class="result-cast" style="--cast-count:' + targets.length + '" aria-hidden="true">' + targets.map(function(t){ return '<span>' + faceSvg(t.kind) + '</span>' }).join("") + '</div>' +
      '<p class="streak-ribbon">' + ribbon + '</p>'+
      (isDaily && GROW.shouldAsk(st.nights)
        ? '<div class="remind-ask" id="remindAsk"><p>Remind me when tomorrow\u2019s search is ready?</p>' +
          '<div class="cardrow"><button class="primary" id="remindYes">Yes, in the evening</button><button id="remindNo">Not now</button></div></div>'
        : '')+
      (isDaily ? '<section class="daily-routine result-journey" aria-label="Your daily cat walk">'+dailyRoutineMarkup(st,seed)+'</section>' : '')+
      '<div class="stats">'+
        '<div class="stat"><b>'+fmt(secs)+'</b><span>Time</span></div>'+
        '<div class="stat"><b>'+hints+'</b><span>Hints</span></div>'+
        '<div class="stat"><b>'+misses+'</b><span>Pokes</span></div>'+
        '<div class="stat"><b>'+thingsFound+'/'+things.length+'</b><span>Things</span></div>'+
      '</div>'+
      '<details class="result-notes"><summary>' + occasion.listHead + '<span>' + targets.length + ' notes</span></summary>'+
      '<ul class="roll">'+roll+'</ul></details>'+
      /* The clock stopped with the last cat, so whatever is still lying about
         can be looked for at leisure. */
      (thingsFound < things.length
        ? '<button class="wide more" id="moreBtn">Keep looking \u00b7 ' +
          (things.length - thingsFound) + (things.length - thingsFound === 1 ? ' thing' : ' things') +
          ' still about</button>'
        : '')+
      '<div class="cardrow result-actions">'+
        (isDaily ? '<button class="primary" id="menuBtn">Back to my journey</button><button id="againBtn">Practice here</button>' : '<button class="primary" id="againBtn">'+(currentLocation.id === "onsen" ? 'Another mountain escape' : currentLocation.id === "harbour" ? 'Another harbour' : currentLocation.id === "shopping" ? 'Another street' : currentLocation.id === "park" ? 'Another park' : 'Another house')+'</button>')+
        '<button id="shareBtn">' + (GROW.canShare() ? 'Share' : 'Copy result') + '</button>'+
        (isDaily ? '' : '<button class="result-menu" id="menuBtn">Back to menu</button>')+
      '</div>'+
      GROW.storeLinks()+
    '</div>';
  document.body.appendChild(wrap);
  var releaseFocus = panelFocus(wrap, wrap.querySelector(".card"), function(){ closeResult(); openMenu() });
  function closeResult(){
    if(!wrap.isConnected) return;
    wrap.remove(); releaseFocus(); document.removeEventListener("keydown", onResultKey);
  }
  function onResultKey(e){ if(e.key === "Escape"){ closeResult(); openMenu() } }
  document.addEventListener("keydown", onResultKey);
  document.getElementById("shareBtn").addEventListener("click", function(){
    var btn = this, rest = btn.textContent;
    var tier = TIERS[tierFor(RANKS.mine().total)], run = loadStats().streak || 0;
    var place = isDaily ? currentLocation.name + " #" + seed : "Practice " + currentLocation.name.toLowerCase();
    var catsLabel = isOpenLocation() ? "cats found" : "cats home";
    var thingsLine = things.length ? thingsFound + " of " + things.length + " things" : "";
    var extra = (isDaily && run > 1 ? run + " days running \u00b7 " : "") + tier.name;
    var text = "Here Kitty Kitty \u00b7 " + place + "\n" + found + " " + catsLabel +
               (things.length ? " \u00b7 " + thingsFound + "/" + things.length + " things" : "") +
               (hints ? "  \uD83D\uDCA1" + hints : "") + "\n" + grid + "\n" + extra;
    var own = targets.slice().filter(function(t){ return t.found }).sort(function(a, b){ return a.at - b.at })
                     .map(function(t){ return !t.hinted });
    btn.disabled = true; btn.textContent = "\u2026";
    GROW.resultCard({place:place, cats:found, catsLabel:catsLabel, things:thingsLine, own:own, line:extra})
      .catch(function(){ return null })
      .then(function(png){ return GROW.share({what:"result", text:text, png:png}) })
      .then(function(how){
        btn.disabled = false;
        btn.textContent = how === "copied" ? "Copied" : how === "failed" ? "Could not share" : rest;
        if(how === "copied" || how === "failed") setTimeout(function(){ btn.textContent = rest }, 1800);
      });
  });
  /* the first nights are when a player is asked whether they want to be reminded; a yes is
     remembered and a "not now" is not asked about again for a while */
  var remindYes = document.getElementById("remindYes");
  if(remindYes){
    GROW.asked();
    remindYes.addEventListener("click", function(){
      GROW.remindAt(18).then(function(on){
        var box = document.getElementById("remindAsk");
        if(box) box.innerHTML = '<p>' + (on ? "Done. One quiet nudge each evening, and none for a search you have finished."
                                            : "Notifications are off for this app in your phone\u2019s Settings, so there will be none.") + '</p>';
      });
    });
    document.getElementById("remindNo").addEventListener("click", function(){
      var box = document.getElementById("remindAsk"); if(box) box.remove();
    });
  }
  if(isDaily) GROW.maybeReview(st.nights);
  document.getElementById("againBtn").addEventListener("click", function(){
    closeResult(); start(Math.floor(Math.random()*1e9), false, currentLocation.id);
  });
  var more = document.getElementById("moreBtn");
  if(more) more.addEventListener("click", function(){
    closeResult();
    afterHours = true;
    MUSIC.to("play");
    toast("The clock has stopped. Take your time.", 2600);
  });
  document.getElementById("menuBtn").addEventListener("click", function(){
    closeResult(); openMenu();
  });
}

/* A cat's face for a page or a list: the head the tray uses, with its hiding-place badge when there
   is room for one. The roll call used to be nine thin line drawings; learning the badges still turns
   a row of heads into a list of places to look. */
function faceSvg(kind, state, badge){ return MANGA.face(kind, state, badge) }

/* n empty cells, filled in by showThingCount and showProgress */
function pips(n){ return new Array(n + 1).join("<i></i>") }

/* ---- the hunt list shrinks ----
   Only the cats still out there are in the tray, in a box that is the same height
   all night, so nothing above or below it ever moves. A find flies up into the
   gauge, whose cell takes the cat's coat colour, and the cats left behind grow
   into the room: seven or more are small cards in two rows, six down to three are
   tall cards in one, two carry their clue, and the last one gets the whole tray. Once they are all home the box is the
   household, in colour, and each of them is a way back to their page. */
var landed = [], growPending = {};
var LAND = window.matchMedia && matchMedia("(max-height:450px)");
function trayMode(n){
  /* One line of small cards whatever is left, and the line scrolls sideways. The
     taller layouts (tall, big, and the last cat's own panel) made the tray the
     tallest thing on a phone; they are still in the code, but nothing asks for them. */
  return "chip";
}
var HEAD_LW = {chip:3.2, tall:3, big:3};

function catCard(t, mode){
  var c = CATS[t.kind], got = !!t.found;
  var b = document.createElement("button");
  b.type = "button"; b.dataset.kind = t.kind; b.dataset.mode = mode;
  b.className = "kc " + mode + (got ? " got" : "");
  b.style.setProperty("--cat-coat", c.coat);
  b.setAttribute("aria-label", got ? c.name + ", " + c.trait + ". Found. Open their page."
                                   : c.name + ". Not found yet. Tap for a clue.");
  b.innerHTML = '<span class="kw">' + MANGA.head(t.kind, got ? "found" : "preview", HEAD_LW[mode]) +
                  MANGA.emb(t.kind, mode === "chip" ? 16 : 20) + '</span>' +
    (mode === "big" ? '<span class="kt"><b>' + c.name + '</b><i>' + searchHides(t.kind) + '.</i></span>'
                    : '<span class="kn">' + c.name + '</span>');
  /* not found: where to look; home: their page */
  b.addEventListener("click", function(e){
    e.stopPropagation();
    if(t.found){ hideClue(); openCatCard(t.kind) } else clue(b, t);
  });
  return b;
}

/* the last cat: a panel with its clue and its own buttons, where there used to be a chip and a balloon */
function lastCard(t){
  var c = CATS[t.kind], d = document.createElement("div");
  d.className = "kc kh"; d.dataset.kind = t.kind; d.dataset.mode = "last";
  d.style.setProperty("--cat-coat", c.coat);
  d.setAttribute("role", "group"); d.setAttribute("aria-label", c.name + ". The last one. Not found yet.");
  var cost = canOfferAdHint() || afterHours ? "Show me" : "Show me · +15s";
  d.innerHTML = '<span class="kw">' + MANGA.head(t.kind, "preview", 3) + '<span class="kburst" aria-hidden="true">あと1匹!</span></span>' +
    '<span class="kt"><span class="ktag">The last one</span><b>' + c.name + '</b><span class="ktr">' + c.trait + '</span>' +
      '<i>' + searchHides(t.kind) + '.</i><span class="kacts"><button type="button" data-a="show">' + cost +
      '</button><button type="button" class="alt" data-a="page">Page</button></span></span>';
  Array.prototype.forEach.call(d.querySelectorAll("button"), function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(btn.dataset.a === "page") openCatCard(t.kind); else showMe(t);
    });
  });
  return d;
}

/* ---- the lines scroll sideways, and they should look it ----
   A fade at an edge that has more behind it, an arrow there that moves the line along
   when tapped (the cats' line only), and, the first time the line overflows, a small
   nudge so the movement itself says "swipe". Everything is recomputed from the scroll
   position, so it follows the player and disappears when there is nothing more to see. */
var trayRO = window.ResizeObserver ? new ResizeObserver(function(){ updateCues() }) : null;
var cueNudged = false;
function updateCues(){
  Array.prototype.forEach.call(document.querySelectorAll("#slots, #tkinds"), function(host){
    var sc = host.id === "slots" ? host.querySelector(".kr") : host;
    if(!sc) return;
    var max = sc.scrollWidth - sc.clientWidth;
    host.classList.toggle("more-r", max > 2 && sc.scrollLeft < max - 2);
    host.classList.toggle("more-l", sc.scrollLeft > 2);
  });
}
function watchCue(sc){
  sc.addEventListener("scroll", updateCues, {passive:true});
  if(trayRO) trayRO.observe(sc);
}
function cueArrow(host, dir){
  var b = document.createElement("button");
  b.type = "button"; b.className = "cue cue-" + (dir < 0 ? "l" : "r");
  b.setAttribute("aria-label", dir < 0 ? "Earlier cats" : "More cats");
  b.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1.5 8.5 6 4 10.5"/></svg>';
  b.addEventListener("click", function(e){
    e.stopPropagation(); hideClue();
    var l = host.querySelector(".kr");
    if(l) l.scrollBy({left:dir * l.clientWidth * .8, behavior:REDUCED ? "auto" : "smooth"});
  });
  return b;
}
function nudgeLine(line){
  if(cueNudged || REDUCED) return;
  var tries = 0;
  /* wait until the game is actually showing (the menu is not over it and the line is on
     screen), so the one nudge is not spent on a tray nobody can see */
  (function wait(){
    if(cueNudged || !line.isConnected || ++tries > 16) return;
    var r = line.getBoundingClientRect();
    if(menuOpen || !r.width || r.bottom <= 0 || r.top >= innerHeight) return setTimeout(wait, 600);
    if(line.scrollWidth <= line.clientWidth + 8 || line.scrollLeft > 6) return;   /* nothing to show, or already scrolled */
    cueNudged = true;
    line.scrollTo({left:72, behavior:"smooth"});
    setTimeout(function(){ if(line.isConnected && line.scrollLeft < 100) line.scrollTo({left:0, behavior:"smooth"}) }, 700);
  })();
}

function layoutCats(){
  var host = document.getElementById("slots"); if(!host) return;
  hideClue();
  var left = targets.filter(function(t){ return !t.found }), n = left.length;
  var list = n ? left : targets, mode = trayMode(n);
  /* where each card stands now, so the ones that stay can slide to where they go */
  var before = {}, oldLine = host.querySelector(".kr"), keepScroll = oldLine ? oldLine.scrollLeft : 0;
  Array.prototype.forEach.call(host.querySelectorAll(".kc"), function(k){
    before[k.dataset.kind] = {r:k.getBoundingClientRect(), m:k.dataset.mode};
  });
  host.innerHTML = "";
  function row(items){
    var r = document.createElement("div"); r.className = "kr";
    items.forEach(function(t){ r.appendChild(mode === "last" ? lastCard(t) : catCard(t, mode)) });
    host.appendChild(r);
  }
  var two = false;                                  /* one line, however many cats */
  if(two){ var a = Math.ceil(list.length / 2); row(list.slice(0, a)); row(list.slice(a)) }
  else row(list);
  host.classList.toggle("one", !two);
  host.dataset.n = n;
  host.dataset.mode = mode;
  /* the line was rebuilt: keep it where the player had scrolled it to */
  var line = host.querySelector(".kr");
  if(line && keepScroll) line.scrollLeft = keepScroll;
  if(line){
    host.appendChild(cueArrow(host, -1)); host.appendChild(cueArrow(host, 1));
    if(trayRO) trayRO.disconnect();
    watchCue(line);
    var things = document.getElementById("tkinds"); if(things) watchCue(things);
    updateCues(); setTimeout(function(){ nudgeLine(line) }, 1200);
  }
  if(REDUCED || !host.animate) return;
  Array.prototype.forEach.call(host.querySelectorAll(".kc"), function(k){
    var b = before[k.dataset.kind]; if(!b) return;
    var r = k.getBoundingClientRect();
    if(b.m === mode){
      var dx = b.r.left - r.left, dy = b.r.top - r.top;
      if(dx || dy) k.animate([{transform:"translate(" + dx + "px," + dy + "px)"}, {transform:"none"}],
                             {duration:260, easing:"cubic-bezier(.3,1.2,.5,1)"});
    } else {
      k.animate([{transform:"scale(.86)", opacity:.4}, {transform:"none", opacity:1}],
                {duration:280, easing:"cubic-bezier(.3,1.4,.5,1)"});
    }
  });
}
if(LAND && LAND.addEventListener) LAND.addEventListener("change", layoutCats);
/* a phone turned round, or a window dragged, can change which layout fits */
window.addEventListener("resize", function(){
  var host = document.getElementById("slots");
  if(host && host.dataset.mode !== trayMode(parseInt(host.dataset.n, 10))) layoutCats();
});

/* the find has flown up: its cell takes the cat's colour, and the cats still out there grow into the room */
function trayLand(kind){
  if(landed.indexOf(kind) >= 0) return;
  landed.push(kind);
  showProgress();
  var cell = document.querySelectorAll("#trCells i")[landed.length - 1];
  if(cell && growPending[kind]){
    delete growPending[kind];
    cell.classList.add("grew");
    setTimeout(function(){ cell.classList.remove("grew") }, REDUCED ? 1600 : 2500);
  }
  layoutCats();
}

function buildSlots(){
  var f = document.getElementById("finds");
  landed = []; growPending = {};
  f.innerHTML =
    (isOpenLocation() ? '<div class="park-search-label"><b>'+(currentLocation.id === "onsen" ? 'Mountain roll call' : currentLocation.id === "harbour" ? 'Harbour roll call' : currentLocation.id === "shopping" ? 'Lantern Lane roll call' : 'Picnic roll call')+'</b><span>Tap a portrait for a clue</span></div>' : '') +
    '<div class="tr-prog"><span class="tr-cg">' +
        '<span class="tr-cnt" id="cntCats"><b id="tallyN">0</b>/' + targets.length + ' cats</span>' +
        '<span class="tr-track" id="trCells" aria-hidden="true">' + pips(targets.length) + '</span>' +
      '</span>' +
      (things.length ? '<span class="tr-cnt tr-bonus" id="cntBonus"><b id="tallyThings">0</b>/' + things.length + ' bonus</span>' : '') +
    '</div>' +
    '<div class="kz" id="slots"></div>' +
    (things.length ? '<div class="tr-row tr-things" id="tkinds"></div>' : '');
  layoutCats();
  /* a cell that holds a cat is a way back to their page */
  document.getElementById("trCells").addEventListener("click", function(e){
    var c = e.target.closest && e.target.closest("i[data-kind]");
    if(c){ hideClue(); openCatCard(c.dataset.kind) }
  });
  var trow = document.getElementById("tkinds");
  if(trow) Object.keys(THINGS).forEach(function(kind){
    var all = things.filter(function(t){ return t.kind === kind });
    if(!all.length) return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip thing"; b.dataset.kind = kind;
    /* a count, found over total, so any number of the same thing fits: fifteen socks
       are "3/15", not fifteen dots */
    b.innerHTML = '<span class="pic">' + chipArt(kind, "tr-sil") + chipArt(kind, "tr-col") + '</span>' +
                  '<span class="n" aria-hidden="true"><b>0</b>/' + all.length + '</span>' +
                  '<span class="tk" aria-hidden="true">' + TICK_SVG + '</span>';
    b.addEventListener("click", function(e){ e.stopPropagation(); clue(b, null, kind) });
    trow.appendChild(b);
  });
  hideClue();
  showThingCount();
}

var TICK_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.6" ' +
               'stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 4.8 9.2 10 3.4"/></svg>';

/* a thing drawn for the tray: the house's own art, in its paint role */
function chipArt(kind, cls){
  var o = OBJ[kind], pad = 2;
  return '<svg class="' + cls + '" viewBox="' + (-pad) + ' ' + (-pad) + ' ' + (o.w + pad*2) + ' ' +
    (o.h + pad*2) + '" preserveAspectRatio="xMidYMax meet" aria-hidden="true">' +
    '<g class="' + artCls(kind, "a") + '">' + o.s + '</g></svg>';
}

function chipFor(rec){
  return CATS[rec.kind] ? document.querySelector('.kc[data-kind="' + rec.kind + '"]')
                        : document.querySelector('.chip.thing[data-kind="' + rec.kind + '"]');
}

/* ---- the clue ----
   A cat's comes from its own character, which is the hiding rule; a thing's
   says where that sort of thing gets left. Neither is ever the answer. */
var clueFor = null;
function clue(chip, t, kind){
  if(!chip) return;
  var bub = document.getElementById("clue");
  if(!bub){
    bub = document.createElement("div");
    bub.className = "clue"; bub.id = "clue"; bub.setAttribute("role", "status");
    document.body.appendChild(bub);
    document.addEventListener("pointerdown", function(e){
      var tray = document.getElementById("finds");
      if(!bub.contains(e.target) && !(tray && tray.contains(e.target))) hideClue();
    }, true);
  }
  if(clueFor === chip && bub.classList.contains("show")){ hideClue(); return }
  var target = t, cost = canOfferAdHint() || afterHours ? "Show me" : "Show me \u00b7 +15s";
  var html;
  if(t){
    var c = CATS[t.kind];
    html = '<span class="tag">Needed tonight</span><b>' + c.name + '</b>' + searchHides(t.kind) + '.' +
      '<span class="acts"><button type="button" data-a="show">' + cost + '</button>' +
      '<button type="button" class="alt" data-a="page">Their page</button></span>';
  } else {
    var m = THINGS[kind];
    var left = things.filter(function(x){ return x.kind === kind && !x.found });
    var one = things.filter(function(x){ return x.kind === kind && x.found })[0];
    target = left[0];
    html = left.length
      ? '<span class="tag">Bonus \u00b7 ' + left.length + ' to find</span><b>' + m.name + '</b>' + m.clue +
        ((done && !afterHours) ? '' : '<span class="acts"><button type="button" data-a="show">' + cost + '</button></span>')
      : '<span class="tag">All found</span><b>' + m.name + '</b>' + one.line;
  }
  bub.innerHTML = html;
  Array.prototype.forEach.call(bub.querySelectorAll("button"), function(btn){
    btn.addEventListener("click", function(){
      hideClue();
      if(btn.dataset.a === "page") openCatCard(t.kind); else showMe(target);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".chip.sel, .kc.sel"), function(x){ x.classList.remove("sel") });
  chip.classList.add("sel");
  clueFor = chip;
  /* above the chip, kept on screen, the arrow still pointing at it */
  bub.style.left = "0px"; bub.style.top = "0px";
  bub.classList.add("show");
  var cr = chip.getBoundingClientRect(), br = bub.getBoundingClientRect();
  var x = Math.max(8, Math.min(innerWidth - br.width - 8, cr.left + cr.width/2 - br.width/2));
  bub.style.left = x + "px";
  bub.style.top = Math.max(8, cr.top - br.height - 10) + "px";
  bub.style.setProperty("--ax", (cr.left + cr.width/2 - x) + "px");
  clearTimeout(clue._t); clue._t = setTimeout(hideClue, 8000);
  beep(560, .05, "sine", .03);
}
function hideClue(){
  var bub = document.getElementById("clue");
  if(bub) bub.classList.remove("show");
  clueFor = null;
  Array.prototype.forEach.call(document.querySelectorAll(".chip.sel, .kc.sel"), function(x){ x.classList.remove("sel") });
}

/* ---- a found thing travels to where it is counted ---- */
function flyToTray(rec, after){
  var chip = chipFor(rec);
  var from = rec.art && rec.art.getBoundingClientRect();
  if(!chip || REDUCED || !from || !from.width || !document.body.animate){ after(); return }
  var to = chip.getBoundingClientRect();
  var w0 = Math.max(18, from.width), h0 = Math.max(14, from.height), tw = 30, th = 24;
  var fly = document.createElement("div");
  fly.className = "fly";
  fly.innerHTML = chipArt(rec.kind, "tr-col");
  fly.style.left = from.left + "px"; fly.style.top = from.top + "px";
  fly.style.width = w0 + "px"; fly.style.height = h0 + "px";
  document.body.appendChild(fly);
  var anim = fly.animate([
    {left:from.left + "px", top:from.top + "px", width:w0 + "px", height:h0 + "px", opacity:1},
    {left:(from.left - w0*0.15) + "px", top:(from.top - h0*0.5 - 18) + "px",
     width:(w0*1.3) + "px", height:(h0*1.3) + "px", opacity:1, offset:0.3},
    {left:(to.left + to.width/2 - tw/2) + "px", top:(to.top + 6) + "px", width:tw + "px", height:th + "px", opacity:.6}
  ], {duration:760, easing:"cubic-bezier(.4,0,.3,1)"});
  anim.onfinish = function(){
    fly.remove(); after();
    chip.classList.remove("pulse"); chip.getBoundingClientRect(); chip.classList.add("pulse");
  };
}
/* ---- the cat card ----
   Neko Atsume's Catbook is the load-bearing piece of that whole game: the cats
   are only worth collecting because each one has a page. The "hides" line is
   given away free on purpose — it teaches the rule, never the answer, so the
   player gets better at the game across days instead of within one house. */
function openCatCard(kind){
  var c = CATS[kind], t = targets.find(function(x){ return x.kind === kind });
  var waiting = walkers.some(function(w){ return w.name === c.name });
  /* "Still looking" is only true if there is somewhere to look. Opened from the
     Catbook between games — or on a cat who is not in tonight's house at all —
     the badge has to speak about the collection instead, or every page you have
     never opened claims you are mid-search for it. */
  var inPlay = !menuOpen && !done && !!t;
  var home, state;
  if(inPlay){
    home = !!t.found;
    state = home ? (waiting ? "Coming in" : "Found") : "Still looking";
  } else {
    var seenN = findCount(kind);
    home = seenN > 0;
    state = seenN ? ("Home " + seenN + (seenN === 1 ? " time" : " times")) : "Not met yet";
  }

  /* The page grows with the collection rather than with this one night, so a
     cat you have brought in six times reads differently from a stranger you
     happened to spot. The locked block is left visible on purpose — an empty
     space says the page is finished, and it is not. */
  var seen = findCount(kind);
  var discovered = UNLOCKS.filter(function(u){ return seen >= u.at });
  var extra = discovered.map(function(u){
    return '<div class="discovery"><b>' + u.label + '</b><p>' + c[u.key] + '</p></div>';
  }).join("");
  var next = UNLOCKS.filter(function(u){ return seen < u.at })[0];
  if(next){
    var more = next.at - seen;
    extra += '<div class="discovery locked"><b>Not yet</b><p>Find ' + c.name + ' ' +
      (more === 1 ? "once more" : more + " more times") + ' and they will tell you ' +
      next.tease + '.</p></div>';
  }

  var sheet = document.createElement("div");
  sheet.className = "sheet"; sheet.id = "sheet";
  sheet.innerHTML =
    '<div class="sheet-in" role="dialog" aria-modal="true" aria-label="' + c.name + '">' +
      '<div class="chead">' +
        '<span class="cface' + (home ? " got" : "") + '">' + faceSvg(kind, home ? "found" : "hide", true) + '</span>' +
        '<div class="cwho">' +
          '<h3>' + c.name + '</h3>' +
          '<p class="ctrait">' + c.trait + '</p>' +
        '</div>' +
        '<span class="cstate' + (home ? " in" : "") + '">' + state + '</span>' +
      '</div>' +
      '<p class="cbio">' + c.bio + '</p>' +
      '<dl class="cfacts">' +
        '<dt>Where they turn up</dt><dd>' + searchHides(kind) + '</dd>' +
        '<dt>Will do anything for</dt><dd>' + c.likes + '</dd>' +
      '</dl><section class="cat-stories" aria-label="Cat stories">' +
        '<div class="cat-stories-heading"><h4>Stories</h4><span>' + discovered.length + '/' + UNLOCKS.length + ' unlocked</span></div>' +
        extra + '</section>' +
      '<button class="wide" id="sheetShare">Share this cat</button>' +
      '<button class="primary wide" id="sheetClose">Close</button>' +
    '</div>';
  document.body.appendChild(sheet);
  var releaseFocus = panelFocus(sheet, sheet.querySelector(".sheet-in"), close);
  function close(){ sheet.remove(); document.removeEventListener("keydown", onKey); releaseFocus() }
  function onKey(e){ if(e.key === "Escape") close() }
  document.getElementById("sheetClose").addEventListener("click", close);
  document.getElementById("sheetShare").addEventListener("click", function(){
    var btn = this, rest = btn.textContent;
    btn.disabled = true; btn.textContent = "\u2026";
    GROW.catCard(kind).catch(function(){ return null }).then(function(png){
      return GROW.share({what:"cat", title:c.name + " \u00b7 Here Kitty Kitty", png:png,
                         text:c.name + ", " + c.trait.toLowerCase() + ". " + c.bio});
    }).then(function(how){
      btn.disabled = false;
      btn.textContent = how === "copied" ? "Copied" : how === "failed" ? "Could not share" : rest;
      if(how === "copied" || how === "failed") setTimeout(function(){ btn.textContent = rest }, 1800);
    });
  });
  sheet.addEventListener("click", function(e){ if(e.target === sheet) close() });
  document.addEventListener("keydown", onKey);
  beep(560, .07, "sine", .035);
}

/* Twice, then done. A pulse that keeps going reads as an error state, and the
   player is meant to look at the house, not at the roll call. It is the cat's
   cell in the gauge that pulses, once the cat has landed in it. */
function markSlotGrew(kind){ growPending[kind] = true }

/* a found cat's card dims at once and is gone when the find has flown up to the gauge */
function fillSlot(kind){
  var slot = document.querySelector('.kc[data-kind="' + kind + '"]');
  var c = CATS[kind];
  if(slot){
    slot.classList.add("leaving");
    slot.setAttribute("aria-label", c.name + (isOpenLocation() ? " is found." : " is home."));
    if(clueFor === slot) hideClue();
  }
  /* if the card never lands (a tab in the background, say) the cat is still counted */
  setTimeout(function(){ trayLand(kind) }, 3000);
}


/* ---- the house is dealt, not drawn ----
   The two plans are skeletons: how many floors, how many rooms on each, and
   which column holds the stairs. Everything else about them is shuffled from
   the day's seed, so 17 September is the same house for everybody and a
   different house from 16 September — in its LAYOUT, not just its furniture.

   The skeleton is kept because a house has rules. The stairs run up one side,
   so the hall is bottom-left and a landing sits above it on every floor. The
   attic is the attic. Bedrooms and bathrooms are upstairs, the kitchen and the
   garage are not. Break those and it stops reading as somebody's house, which
   is the whole appeal. */
var GROUND_ROOMS = ["living","kitchen","cons","garage","utility","study"];
var UPPER_ROOMS  = ["bed","kids","bath","study","living"];

function shufflePlan(plan, rp){
  function ri2(a,b){ return a + Math.floor(rp()*(b-a+1)) }
  function shuffled(a){
    a = a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(rp()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t }
    return a;
  }

  /* floors, top to bottom, as the skeleton lays them out */
  var byY = {}, ys = [];
  plan.rooms.forEach(function(rm){
    if(!byY[rm.y]){ byY[rm.y] = []; ys.push(rm.y) }
    byY[rm.y].push(rm);
  });
  ys.sort(function(a,b){ return a-b });

  var rooms = [];
  var groundY = ys[ys.length-1];
  /* every house gets somewhere to sleep, wash and cook — a house that rolled
     four studies would be a different kind of joke */
  var upperNeeded = shuffled(["bed","bath","kids"]);
  var usedGround = {};
  /* Counted across the WHOLE house, not per floor. Checking only the row let
     three bathrooms through, which is not a house and is also bad hunting:
     a bathroom has nothing tall for Duchess and nothing soft for Biscuit. */
  var usedAll = {};
  var CAP = {bath:1, kitchen:1, garage:1, cons:1, utility:1, kids:1, bed:2, study:2, living:2};
  function capFor(id){ return CAP[id] || 2 }

  ys.forEach(function(y){
    var row = byY[y].slice().sort(function(a,b){ return a.x-b.x });
    var isGround = (y === groundY);
    var isAttic  = row.length === 1 && row[0].roof;

    /* which slots are fixed: the attic, and the stair column on every floor */
    var fixedCount = isAttic ? row.length : 1;
    var pool = isGround ? GROUND_ROOMS : UPPER_ROOMS;
    var picks = [];
    for(var i = fixedCount; i < row.length; i++){
      var id;
      if(!isGround && upperNeeded.length){ id = upperNeeded.shift() }
      else if(isGround && !usedGround.kitchen){ id = "kitchen"; }
      else {
        /* everything still under its cap, preferred in a shuffled order so the
           choice is varied rather than merely legal */
        var room4 = shuffled(pool).filter(function(k){
          return (usedAll[k] || 0) < capFor(k) && picks.indexOf(k) < 0;
        });
        id = room4.length ? room4[0]
           : pool[Math.floor(rp()*pool.length)];   /* pool exhausted: allow it */
      }
      if(isGround) usedGround[id] = 1;
      usedAll[id] = (usedAll[id] || 0) + 1;
      picks.push(id);
    }

    /* widths: the same total, shared out differently. A room narrower than
       this cannot hold a set-piece and reads as a cupboard. */
    var MINW = plan === PLAN_TALL ? 340 : 420;
    var free = row.slice(fixedCount);
    if(free.length){
      var total = free.reduce(function(t,rm){ return t + rm.w }, 0);
      var wts = free.map(function(){ return 0.8 + rp()*0.7 }), wsum = 0;
      wts.forEach(function(w){ wsum += w });
      var widths = wts.map(function(w){ return Math.max(MINW, Math.round(total * w / wsum)) });
      /* rounding and the floor both push the row long; take it off the widest */
      var drift = widths.reduce(function(t,w){ return t+w }, 0) - total;
      while(drift !== 0){
        var k = 0;
        for(var j=1;j<widths.length;j++) if(widths[j] > widths[k]) k = j;
        var step = drift > 0 ? -1 : 1;
        if(widths[k] + step < MINW) break;
        widths[k] += step; drift += step;
      }
      var x = free[0].x;
      free.forEach(function(rm, i){
        rm = Object.assign({}, rm);
        rm.id = picks[i];
        rm.floor = F[picks[i]] || rm.floor;
        rm.x = x; rm.w = widths[i];
        x += widths[i];
        rooms.push(rm);
      });
    }
    /* the fixed slots go in untouched */
    for(var f = 0; f < fixedCount; f++) rooms.push(Object.assign({}, row[f]));
  });
  return {w:plan.w, h:plan.h, rooms:rooms};
}

function choosePlan(){
  var r = stage.getBoundingClientRect();
  // A daily puzzle has one canonical map on every device. The viewport only
  // changes its camera; practice can still use the wider landscape plans.
  var tall = isDaily || r.height > r.width * 1.1;
  if(currentLocation.id === "onsen"){
    var onsen=HKKOnsen.plan(tall,seed);
    GARDEN=0;HX=0;HW=SW=onsen.w;SH=onsen.h;ROOMS=onsen.rooms;
    GROUND=Math.max.apply(null,ROOMS.map(function(r){return r.y+r.h}));
    return;
  }
  if(currentLocation.id === "harbour"){
    var harbour=HKKHarbour.plan(tall,seed);
    GARDEN=0;HX=0;HW=SW=harbour.w;SH=harbour.h;ROOMS=harbour.rooms;
    GROUND=Math.max.apply(null,ROOMS.map(function(r){return r.y+r.h}));
    return;
  }
  if(currentLocation.id === "shopping"){
    var street=HKKStreet.plan(tall,seed);
    GARDEN=0;HX=0;HW=SW=street.w;SH=street.h;ROOMS=street.rooms;
    GROUND=Math.max.apply(null,ROOMS.map(function(r){return r.y+r.h}));
    return;
  }
  if(currentLocation.id === "park"){
    var park = parkPlan(tall, seed);
    GARDEN = 0; HX = 0; HW = SW = park.w; SH = park.h;
    ROOMS = park.rooms;
    // Move each landscaped strip onto the nearest broad patch of lawn first.
    // The final per-object check below still protects every path edge.
    ROOMS.forEach(function(r){
      var base=r.y+r.h,best=base,bestScore=-Infinity,sy=SH/1900;
      for(var delta=-120;delta<=120;delta+=15){
        var floor=base+delta*sy;
        if(floor<r.y+120 || floor>SH-90) continue;
        var score=-Math.abs(delta)*.025;
        for(var i=0;i<20;i++){
          var x=r.x+(r.w-130)*(i+.5)/20;
          if(parkClear(x,floor,130,90)) score+=1;
        }
        if(score>bestScore){bestScore=score;best=floor}
      }
      r.h=best-r.y;
    });
    GROUND = Math.max.apply(null, ROOMS.map(function(r){ return r.y+r.h }));
    return;
  }
  var plan = tall ? PLAN_TALL : PLAN_WIDE;
  /* A phone in portrait is about 0.65 wide-to-tall and the tall house is 0.72,
     so the house very nearly fits the screen — but 1180 of ground on each side
     made the world 1.66, wider than it is tall, and three fifths of the screen
     went to empty paper above and below. Sized to the car instead. */
  GARDEN = tall ? 650 : 1180;
  /* Its own stream, offset from the house and the sky, and reseeded here every
     time — so a phone turned sideways redraws the SAME house in the other
     shape rather than dealing a new one. */
  plan = shufflePlan(plan, mulberry32((seed ^ 0x85EBCA6B) | 0));
  /* Shift the house across and widen the scene, so there is ground either
     side of it. Cats go outside — that is rather the point of calling them in. */
  HX = GARDEN; HW = plan.w;
  SW = plan.w + GARDEN*2;
  SH = plan.h + 90;
  ROOMS = plan.rooms.map(function(rm){
    var c = {}; for(var k in rm) c[k] = rm[k];
    c.x = rm.x + HX;
    return c;
  });
  GROUND = ROOMS.reduce(function(m, rm){ return Math.max(m, rm.y + rm.h) }, 0);
  /* two garden plots, using the same machinery as any other room */
  ROOMS.push({id:"garden", x:30,       y:GROUND-680, w:GARDEN-90, h:680, floor:F.garden, outside:1});
  ROOMS.push({id:"street", x:HX+HW+60, y:GROUND-680, w:GARDEN-90, h:680, floor:F.street, outside:1});
}

/* ---------------------- the style switch ----------------------
   The riso house and the kawaii house are the same drawings under two
   stylesheets. Fills and colours are CSS and change on the spot; line weight
   is an attribute, because it has to be divided by each object's scale, so it
   is recomputed from the scale each object recorded when it was placed. */
function applyStyle(id){
  STYLE = (id === "kawaii") ? "kawaii" : "riso";
  document.body.classList.toggle("sty-kawaii", STYLE === "kawaii");
  if(STYLE === "kawaii") setTokens(KAWAII);
  var L = LINE[STYLE];
  Array.prototype.forEach.call(document.querySelectorAll("#objects .art[data-sc]"), function(n){
    var kind = n.parentNode && n.parentNode.dataset ? n.parentNode.dataset.kind : "";
    var sc = parseFloat(n.getAttribute("data-sc")) || 1;
    n.setAttribute("stroke-width", ((CATS[kind] ? L.cat : L.base) / sc).toFixed(2));
  });
  Array.prototype.forEach.call(document.querySelectorAll(".shl"), function(n){
    n.setAttribute("stroke-width", shellW());

   reads the same tokens, so it supplies a set: a dark contour for ink, a warm
   pink for the found accent, and paper stock warm enough to sit under it. */
var KAWAII = {n:"Manga", glow:"#FFC24B", paper:"#FFFDF6", p2:"#FFF1CC", p3:"#F8DD97",
              rule:"#17121A", ink:"#17121A", ink2:"#E8506E", text:"#17121A", muted:"#5E5360"};

/* The kawaii house is what the game is now. The house as it shipped is the
   skin behind it — kept whole, drawings and all, so it can be chosen rather
   than only remembered. */
var paletteIx = 0;
function setTokens(p){
  var r = document.documentElement.style;
  r.setProperty("--paper", p.paper);   r.setProperty("--paper-2", p.p2);
  r.setProperty("--paper-3", p.p3);    r.setProperty("--rule", p.rule);
  r.setProperty("--ink", p.ink);       r.setProperty("--ink-2", p.ink2);
  r.setProperty("--text", p.text);     r.setProperty("--muted", p.muted);
  r.setProperty("--glow", p.glow);

function applyPalette(i){
  return setTokens(PALETTES[((i % PALETTES.length) + PALETTES.length) % PALETTES.length]);
}
/* The game is kawaii now; the button that cycled the skins is gone, and an
   old choice of classic saved by it is no longer read. */

/* A skin is a set of drawings and a way of printing them, and the two are not
   independent: the classic drawings are a hairline with nothing filled, and
   filling them would be nonsense. So the button cycles whole skins — the
   kawaii house, and then the house as it shipped, in each of its seven inks. */
var SKINS = [{n:KAWAII.n, art:"kawaii", style:"kawaii", ink:KAWAII.ink, ink2:KAWAII.ink2}]
  .concat(PALETTES.map(function(p, i){
    return {n:"Classic \u00b7 " + p.n, art:"classic", style:"riso", pal:i, ink:p.ink, ink2:p.ink2};
  }));

/* At boot there is no house to walk yet, so this sets the drawings and the
   colours and leaves the DOM alone; the first house is built from whichever
   set is now in OBJ. Has to come after SKINS, which is what it reads. */
(function(){
  var sk = SKINS[((paletteIx % SKINS.length) + SKINS.length) % SKINS.length];
  var set = (sk.art === "classic") ? OBJ_CLASSIC : OBJ_KAWAII;
  for(var k in set) OBJ[k] = set[k];

  Array.prototype.forEach.call(document.querySelectorAll("#pDots button"), function(b, j){
    b.setAttribute("aria-current", String(j === paradeIx));
  });
}

function buildDots(){

function syncMenuMotion(){

/* ---- swiping the parade ----
   A threshold rather than a drag-follow: the stage is a fixed frame, so there
   is nothing to drag — the gesture only has to say which way. Arrow keys do
   the same thing for anyone not using a finger. */
function step(dir){ showCat(paradeIx + dir, dir); runParade() }

(function(){
  var par = document.querySelector(".parade");
  if(!par) return;
  var sx = 0, sy = 0, down = false, fired = false;
  /* Sideways once it has gone about a thumb's width and is not mostly up or down. This is
     generous on purpose: a swipe with one thumb is an arc, and the old test (44px and nearly
     flat) turned most of them away. */
  function sideways(dx, dy){ return Math.abs(dx) > 26 && Math.abs(dx) > Math.abs(dy) * 1.05 }
  par.addEventListener("pointerdown", function(e){
    if(e.target.closest("#pDots")) return;
    down = true; fired = false; sx = e.clientX; sy = e.clientY;
  });
  par.addEventListener("pointermove", function(e){
    if(!down || fired) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    /* only once per gesture */
    if(sideways(dx, dy)){ fired = true; step(dx < 0 ? 1 : -1) }
  });
  /* a quick flick can be over before a move has reported enough, so the lift counts too */
  par.addEventListener("pointerup", function(e){
    if(down && !fired){
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if(sideways(dx, dy)) step(dx < 0 ? 1 : -1);
    }
    down = false;
  });
  ["pointercancel","pointerleave"].forEach(function(t){
    par.addEventListener(t, function(){ down = false });
  });
})();

document.addEventListener("keydown", function(e){
  if(!menuOpen || document.querySelector(".overlay.top")) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); step(1) }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); step(-1) }
});

/* Read on every open rather than cached: a night finishes, the menu comes
   back, and the line has to already know about it. */
function currentDailyDay(){return Math.floor((Date.now()-EPOCH)/86400000)}
function syncDailyDay(){
  var day=currentDailyDay();
  if(day===houseNo)return;
  houseNo=day;
  var date=new Date(EPOCH+day*86400000);
  document.getElementById("dateLabel").textContent=date.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
}
function dailyDateLabel(day){return new Date(EPOCH+day*86400000).toLocaleDateString(undefined,{day:"numeric",month:"short",timeZone:"UTC"})}
/* One quiet day in a week does not break a run: this is a game for looking at
   leisure, and a missed day is not a failure. The rest is spent on the day that
   was missed, and is there to spend again a week later. */
function restReady(st,missed){return st.restDay===undefined || missed-st.restDay>=7}
function currentStreak(st,day){return st.lastDay===day || st.lastDay===day-1 || (st.lastDay===day-2 && restReady(st,day-1)) ? (st.streak||0) : 0}
function completedDay(st,day){return st.lastDay===day || (st.dailyDays||[]).indexOf(day)>=0}
function dailyJourney(st,day){
  var start=day-dailyRouteIndex(day), stamps='';
  var labels={house:'Home',park:'Park',shopping:'Street',harbour:'Harbour',onsen:'Springs'};
  for(var i=0;i<5;i++){
    var d=start+i,id=DAILY_ROUTE[i],complete=completedDay(st,d),today=d===day;
    stamps+='<li class="'+(complete?'complete ':'')+(today?'today':'')+'"'+(today?' aria-current="date"':'')+'><span class="dj-icon" aria-hidden="true">'+(complete?'&#10003;':['&#8962;','&#10047;','&#9733;','&#9875;','&#9832;'][i])+'</span><b>'+labels[id]+'</b><small>'+(complete?'Found':today?'Today':dailyDateLabel(d))+'</small></li>';
  }
  return '<ol class="daily-stamps" aria-label="Five-day journey">'+stamps+'</ol>';
}
function storyGoal(st){
  var choices=roster().map(function(k){var n=(st.finds&&st.finds[k])||0,next=UNLOCKS.filter(function(u){return u.at>n})[0];return next?{kind:k,n:n,next:next,left:next.at-n}:null}).filter(Boolean);
  choices.sort(function(a,b){return a.left-b.left || b.n-a.n});
  if(!choices.length)return 'Every story discovered. There is always another hiding place.';
  var next=choices[0];
  return CATS[next.kind].name+' has another story in '+next.left+' more '+(next.left===1?'find':'finds')+'.';
}
function dailyBrief(day,id){
  var base=id==='shopping'?HKKStreet.occasion:id==='harbour'?HKKHarbour.occasion:id==='onsen'?HKKOnsen.occasion:id==='park'?{id:'park',room:'parkPicnic',prop:'bowl',propH:22,on:'beside'}:{};
  return HKKDailyWorld.brief(day,id,base,OCCASIONS);
}
function dailyRoutineMarkup(st,day){
  var today=locationFor(day),tomorrow=locationFor(day+1),done=completedDay(st,day),brief=dailyBrief(day,today.id),next=dailyBrief(day+1,tomorrow.id);
  return '<div class="daily-heading"><div><p>YOUR DAILY CAT WALK</p><h3>'+today.name+'</h3></div><span class="daily-status">'+(done?'&#10003; Stamped':'#'+day)+'</span></div><p class="daily-brief">'+brief.goalName+' · '+HKKDailyWorld.weatherLabel(brief.weather)+'</p>'+dailyJourney(st,day)+
    '<p class="daily-next"><b>Tomorrow · '+tomorrow.name+'</b><span>'+next.goalName+' · '+HKKDailyWorld.weatherLabel(next.weather)+'</span><span>'+next.hookSub+'</span></p><p class="daily-story">'+storyGoal(st)+'</p>'+
    '<p class="daily-shared">One shared search worldwide. A new day at 00:00 UTC.</p>';
}
function refreshMenuState(){
  syncDailyDay();
  var box = document.getElementById("mState");
  var sub = document.getElementById("mDailySub");
  if(!box) return;
  var st = loadStats();
  var doneToday = completedDay(st,houseNo);
  if(sub) sub.textContent = doneToday ? "Completed · revisit today’s search" : dailyBrief(houseNo,locationFor(houseNo).id).goalName + " · the same search for everyone";
  var ritual=document.getElementById("dailyRoutine");if(ritual)ritual.innerHTML=dailyRoutineMarkup(st,houseNo);
  /* practice is held in today's place, and says so */
  var play=document.getElementById("mPlaySub");
  if(play){var here=locationFor(houseNo);play.textContent=here.id==="house"?"A new house":here.name}

  var bits = [];
  var streak=currentStreak(st,houseNo);
  if(streak>0)bits.push("<b>"+streak+(streak===1?" day":" days")+" running.</b>");
  /* How much of the household has told you everything it is going to. */
  var full = 0, kinds = roster();
  kinds.forEach(function(k){ if(findCount(k) >= UNLOCKS[UNLOCKS.length-1].at) full++ });
  /* Three goes at this line and the first three all failed the same way: they
     reported a SCORE ("3 of 10 complete") for a mechanic the reader may not
     know exists yet, and "complete" describes a page rather than a cat. Say
     what is LEFT instead. It needs no prior knowledge, it is plainly a reason
     to play, and it teaches that cats have more to tell you by saying so. */
  var left = kinds.length - full;
  if(left === 0) bits.push("Every cat has told you everything.");
  else if(left === 1) bits.push("One cat still has something to tell you.");
  else bits.push(left + " cats still have something to tell you.");

  if(!bits.length){ box.hidden = true; return }
  box.hidden = false;
  /* a moon for the nights, in the text's own pink */
  box.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" ' +
    'd="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6z"/></svg><span>' + bits.join(" ") + '</span>';
}
