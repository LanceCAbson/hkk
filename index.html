           reaches 5 above its surface — and a thing standing ON the table
           always overlaps that. Tested whole, every topper collided with the
           table holding it up, and no table in the game has ever had anything
           on it. Test the part that is genuinely in the air instead. */
        if(!free(tx, f.y - th, tw, Math.max(1, th - 7))) continue;
        claim(tx, f.y - th, tw, th);
        put(objL, tk, tx, f.y, th, "surface").on = f;   /* f.y is the top surface */
      }
    });

    /* --- 4. wall art, in whatever space is genuinely left --- */
    var wTop = room.y + 16, wBot = floorY - 130;
    if(!room.outside && wBot - wTop > 60){
      var cols = Math.max(4, Math.floor(room.w/108)), rows = Math.max(1, Math.floor((wBot-wTop)/86));
      var cellW = room.w/cols, cellH = (wBot-wTop)/rows;
      for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
        if(rnd() > 0.66) continue;
        var k2 = pick(WALLPOOL), o2 = OBJ[k2];
        var hh = Math.min(cellH*0.84, rf(42, 82));
        var s2 = hh/o2.h, ww = o2.w*s2;
        var px2 = room.x + c*cellW + (cellW-ww)/2 + rf(-8,8);
        /* Everything in a row hangs on one centre line, the way art is really
           hung. Jittered heights were what made the walls read as a void with
           things drifting in it. */
        var py2 = wTop + r*cellH + cellH*0.5 + hh/2;
        if(px2 < room.x+10+inset || px2+ww > room.x+room.w-10-inset) continue;
        if(!free(px2, py2-hh, ww, hh)) continue;
        claim(px2, py2-hh, ww, hh);
        put(objL, k2, px2, py2, hh, "wall");
      }
    }
  });

  /* Crumpet's rule only works if the house actually contains the thing. The
     floor pools are random, so a house could easily generate without a single
     radiator in any room he uses — and then The Radiator Thief turns up on a
     dresser. Rather than weight the pools and hope, the house is checked and
     one is fitted where it is missing. */
  (function guaranteeRadiator(){
    if(isOpenLocation()) return;
    var need = CATS.cat_loaf;
    if(!need || !need.must || !need.must.radiator) return;
    var hasOne = placed.some(function(o){
      return o.kind === "radiator" && o.room >= 0 && ROOMS[o.room] &&
             need.rooms[ROOMS[o.room].id];
    });
    if(hasOne) return;
    /* his rooms first, then any indoor room, so it is still plausibly plumbed */
    var pick2 = null;
    for(var pass = 0; pass < 2 && !pick2; pass++){
      for(var i = 0; i < ROOMS.length; i++){
        var rm = ROOMS[i];
        if(rm.outside || rm.roof) continue;
        if(pass === 0 && !need.rooms[rm.id]) continue;
        pick2 = {room:rm, idx:i}; break;
      }
    }
    if(!pick2) return;
    /* curOutside is set per room as the generator walks the house and still
       holds the LAST room's value out here — and the garden and the street are
       filled last. Without this the guaranteed radiator is recorded as being
       outdoors, the spot on it is an outdoor spot, and Crumpet — who never goes
       out — gets placed in the garden and walks home mewing at a shut door. */
    curOutside = false;
    var rm2 = pick2.room, o = OBJ.radiator;
    var h = realH("radiator"), sc = h / o.h, w = o.w * sc;
    /* against the wall under the window, which is where they go */
    var x = rm2.x + rm2.w - w - 26;
    placingRoom = pick2.idx;
    put(objL, "radiator", x, rm2.y + rm2.h, h, "floor");   /* put() records it itself */
  })();

  placingRoom = -1;   /* targets belong to no room in particular */

  buildDoors(document.getElementById("doors"));
  houseShell(bg);

  /* --------------------------- hide eight cats ---------------------------
     Each pose is placed by its own rule, so a cat is always somewhere a cat
     would plausibly be. That recognition is the pleasure of the genre. */
  /* All nine, every night. This used to take eight of the nine, so one cat
     was quietly absent from every house with nothing to explain it — you
     would go looking for Shadow and slowly realise he was never there. They
     are meant to be a household you get to know, and a household does not
     lose a member at random. Sixpence is the exception, and she is not
     yours: she turns up about one night in twenty, as a tenth. */
  var kinds = Object.keys(CATS).filter(function(k){ return !CATS[k].rare });
  for(var p=kinds.length-1;p>0;p--){var j=Math.floor(rnd()*(p+1));var t=kinds[p];kinds[p]=kinds[j];kinds[j]=t}
  if(rnd() < 0.05) kinds.push("cat_tortie");

  /* Where a cat sits in the stack IS the hiding rule, not a detail. On top of
     something it is in front of it; at the edge of something it is behind it,
     which is Shadow's whole character. The riso house never cared, because
     nothing was filled and so nothing could occlude anything. */
  function tuck(rec, sp){
    var host = sp && sp.host && sp.host.g;
    /* what rule put this cat here, written on the cat — the only way to check
       from outside that a top spot landed on the thing and not above it */
    if(sp){ rec.g.dataset.spot = sp.type; if(sp.kind) rec.g.dataset.host = sp.kind }
    if(!host || !host.parentNode) return;
    host.parentNode.insertBefore(rec.g, sp.type === "edge" ? host : host.nextSibling);
    /* Wash the cat toward what is actually behind it, which is not always the
       thing that put it there. On top of a sofa, or tucked behind a wardrobe,
       the host surrounds the cat and the host is the answer. But most cats are
       on floor spots — standing on the floor BESIDE the thing, against the
       wall — and washing those toward the host was painting a cat green next
       to a tree and blue-grey next to a car, on a cream wall. It camouflaged
       them perfectly against a surface nobody was looking at. Out in the
       garden there is no wall: what stands behind a cat there is the hill. */
    var behind = (sp.type === "floor") ? (sp.out ? (currentLocation.id === "onsen" ? HKKOnsen.groundColour(sp.rid) : currentLocation.id === "harbour" ? HKKHarbour.groundColour(sp.rid) : currentLocation.id === "shopping" ? "#DBD1C3" : "var(--k-hill)") : "var(--k-wall)")
                                       : ROLE_FILL[PAINT[sp.kind]];
    if(behind) rec.g.style.setProperty("--host", behind);
  }

  /* What each place says about a cat, by name. Written as a function because the spots below
     need Shadow's before any cat has been placed. */
  function metaFor(kind){
    return currentLocation.id === "onsen" ? HKKOnsen.catMeta(kind,CATS[kind]) : currentLocation.id === "harbour" ? HKKHarbour.catMeta(kind,CATS[kind]) : currentLocation.id === "shopping" ? HKKStreet.catMeta(kind,CATS[kind]) : currentLocation.id === "park" ? parkCatMeta(kind) : CATS[kind];
  }
  /* Shadow is a spy: he is always part way behind something, one eye showing. So every thing he
     could be half behind is an edge for him: the big furniture, whatever this place says is his
     (nets, vending machines, bamboo, trees), and failing those anything taller than he is. */
  var peekPrefer = metaFor("cat_peek").prefer || {};
  var peekTall = CATS.cat_peek.ph;

  /* typed spots: the floor, the edge of something big, the top of a surface */
  var spots = [];
  placed.forEach(function(o){
    var rid = (o.room >= 0 && ROOMS[o.room]) ? ROOMS[o.room].id : "";
    if((o.base === "floor" || o.base === "surface") && !(currentLocation.id === "harbour" && rid === "harbourWater")){
      spots.push({x:o.x - 14,       y:o.y + o.h, type:"floor", side:"l", kind:o.kind, out:o.out, rid:rid, host:o});
      spots.push({x:o.x + o.w*0.55, y:o.y + o.h, type:"floor", side:"m", kind:o.kind, out:o.out, rid:rid, host:o});
      spots.push({x:o.x + o.w + 2,  y:o.y + o.h, type:"floor", side:"r", kind:o.kind, out:o.out, rid:rid, host:o});
    }
    /* only floor-standing furniture has a real top; a wall shelf's bounding
       box reaches above its board, so "on top" of one lands in mid-air */
    if(o.base === "floor" && (SURFACE[o.kind] || (isOpenLocation() && o.kind === "bench"))) spots.push({x:o.x + o.w*0.26, y:o.y + (o.inkTop||0) + 3, type:"top", kind:o.kind, out:o.out, rid:rid, host:o});
    if(o.base === "floor" && !(currentLocation.id === "harbour" && rid === "harbourWater") && (TALL[o.kind] || peekPrefer[o.kind] || o.h >= peekTall)){
      spots.push({x:o.x - 10,       y:o.y + o.h, type:"edge", side:"l", kind:o.kind, out:o.out, rid:rid, host:o});
      spots.push({x:o.x + o.w - 10, y:o.y + o.h, type:"edge", side:"r", kind:o.kind, out:o.out, rid:rid, host:o});
    }
  });
  for(var q=spots.length-1;q>0;q--){var j2=Math.floor(rnd()*(q+1));var t2=spots[q];spots[q]=spots[j2];spots[j2]=t2}

  /* Two cats are always out in the garden. The whole point is calling them
     in, so the house should never start with all of them already indoors. */
  /* Which two are out is a matter of temperament, not luck: Rumble is always
     halfway somewhere, Crumpet has never willingly left a radiator. */
  /* Two weighted picks, not a sort. This used to be
       .sort(function(a,b){ return CATS[b].outdoor*rnd() - CATS[a].outdoor*rnd() })
     which is a comparator that draws from the PRNG and never gives the same
     answer twice — an inconsistent comparator, whose behaviour the spec leaves
     to the implementation. How many times it is called, and so how many numbers
     it takes out of the stream, is a property of the engine's sort, and V8 and
     JavaScriptCore do not agree. The same seed built one house in Chrome and a
     different one in the iOS WebView this ships through, and every cat after
     this line moved with it.
     A fixed count of draws — one per remaining candidate, per pick — keeps the
     intent (temperament weighted by luck) and makes the house the seed's. */
  var mustBeOut = {};
  (function(){
    var pool = kinds.filter(function(k){ return (CATS[k].outdoor || 0) > 0 && CATS[k].anchor !== "top" });
    for(var n = 0; n < 2 && pool.length; n++){
      var best = 0, bestScore = -Infinity;
      for(var i = 0; i < pool.length; i++){
        var sc = CATS[pool[i]].outdoor * rnd();
        if(sc > bestScore){ bestScore = sc; best = i; }
      }
      mustBeOut[pool.splice(best, 1)[0]] = 1;
    }
  })();

  var targets = [], used = [];
  /* Shadow chooses his edge before anybody else has used up the room: placed last he could be
     left with nowhere behind anything and end up standing in the open. */
  var spy = kinds.indexOf("cat_peek");
  if(spy > 0){ kinds.splice(spy, 1); kinds.unshift("cat_peek") }
  kinds.forEach(function(kind){
    var meta = metaFor(kind), o = OBJ[kind];
    var hgt = meta.ph * rf(0.94, 1.08), s = hgt/o.h, wid = o.w*s;

    /* An edge is where he is tucked in, about half of him behind the thing and half showing,
       not a sliver of it overlapping: this is the x his left edge goes at. */
    function spotX(sp){
      return sp.type !== "edge" ? sp.x : sp.side === "l" ? sp.host.x - wid*0.42 : sp.host.x + sp.host.w - wid*0.58;
    }
    function usable(sp){
      if(sp.taken) return false;
      var sx = spotX(sp);
      if(sx < 74 || sx + wid > SW-74 || sp.y - hgt < 74 || sp.y > SH-74) return false;
      for(var u=0;u<used.length;u++)
        if(Math.hypot(used[u].x-sx, used[u].y-sp.y) < 250) return false;
      return true;
    }
    /* best fit first, then any spot of the right kind, then anywhere sensible */
    var tries = [];
    if(mustBeOut[kind]){
      tries.push(function(sp){ return sp.out && sp.type === meta.anchor });
      tries.push(function(sp){ return sp.out });
    }
    /* the character IS the placement rule: Duchess wants the top of something
       in a bedroom, Shadow the edge of something in the garage. The line the
       player reads on her card is the literal search hint. */
    /* A must comes before every preference: in its own room if it can, in any
       room if it must, and only then down into the ordinary cascade — which
       still exists, because a house that somehow has no radiator should hide
       the cat somewhere rather than not hide him at all. */
    if(meta.must){
      if(meta.rooms) tries.push(function(sp){ return sp.type===meta.anchor && meta.must[sp.kind] && meta.rooms[sp.rid] });
      tries.push(function(sp){ return sp.type===meta.anchor && meta.must[sp.kind] });
    }
    if(meta.rooms && meta.prefer)
      tries.push(function(sp){ return sp.type===meta.anchor && meta.prefer[sp.kind] && meta.rooms[sp.rid] });
    if(meta.rooms)
      tries.push(function(sp){ return sp.type===meta.anchor && meta.rooms[sp.rid] });
    if(meta.prefer) tries.push(function(sp){ return sp.type===meta.anchor && meta.prefer[sp.kind] });
    tries.push(function(sp){ return sp.type === meta.anchor });
    tries.push(function(sp){ return sp.type === "floor" });
    tries.push(function(){ return true });

    for(var t=0;t<tries.length;t++){
      for(var i=0;i<spots.length;i++){
        var sp = spots[i];
        if(!tries[t](sp) || !usable(sp)) continue;
        sp.x = spotX(sp);
        sp.taken = true; used.push(sp);
        var rec = place(document.getElementById("objects"), kind, sp.x, sp.y, hgt, true);
        tuck(rec, sp);
        rec.sp = sp;
        rec.cx = sp.x + wid/2; rec.cy = sp.y - hgt/2;
        rec.out = !!sp.out;   /* targets are placed directly, so carry this across */
        targets.push(rec);
        return;
      }
    }
    /* nowhere left: drop it on the floor of a random room */
    var room = ROOMS[Math.floor(rnd()*ROOMS.length)];
    var rx = rf(room.x+30, room.x+room.w-30-wid), ry = room.y + room.h - 10;
    var rec2 = place(document.getElementById("targets"), kind, rx, ry, hgt, true);
    rec2.cx = rx + wid/2; rec2.cy = ry - hgt/2;
    rec2.out = !!room.outside;
    targets.push(rec2);
  });

  /* ------------------------------ and their things ------------------------------
     Dealt after the cats and from a stream of their own, so a sock added to
     the house never moves a cat: House #255 keeps its cats exactly where they
     were. Nothing here may sit over a cat. A thing that hides the animal is
     not hiding itself, it is hiding the game. */
  var rndT = mulberry32((seed ^ 0x85EBCA6B) | 0);
  function deal(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(rndT()*(i+1));var t=a[i];a[i]=a[j];a[j]=t} return a }
  var bag = [];
  var pool = bonusPool();
  Object.keys(pool).forEach(function(k){
    for(var n=0;n<pool[k].max*BONUS_COPIES;n++) bag.push(k);
  });
  var open = deal(spots.filter(function(sp){ return !sp.taken && sp.type !== "edge" }));
  var lineAt = {};
  things = [];
  deal(bag).slice(0, THINGS_PER_HOUSE).forEach(function(kind){
    var meta = THINGS[kind], o = OBJ[kind];
    var hgt = meta.ph * (0.94 + rndT()*0.12), wid = o.w * hgt/o.h;
    function clear(sp){
      if(sp.taken) return false;
      if(sp.x < 74 || sp.x + wid > SW-74 || sp.y - hgt < 74 || sp.y > SH-74) return false;
      if(sp.out && !meta.outdoor && !isOpenLocation()) return false;
      if(meta.ground && sp.host && sp.host.base !== "floor") return false;
      if(meta.side && sp.side === "m") return false;
      var bx = sp.x - 12, by = sp.y - hgt - 12, bw = wid + 24, bh = hgt + 24;
      for(var c=0;c<targets.length;c++){
        var t = targets[c];
        if(bx < t.x + t.w && bx + bw > t.x && by < t.y + t.h && by + bh > t.y) return false;
      }
      /* spread through the house rather than heaped in one room */
      for(var u=0;u<things.length;u++)
        if(Math.hypot(things[u].cx - (sp.x + wid/2), things[u].cy - (sp.y - hgt/2)) < 170) return false;
      return true;
    }
    var tries = [
      function(sp){ return sp.type === meta.anchor && meta.rooms[sp.rid] },
      function(sp){ return meta.alt && sp.type === meta.alt && meta.rooms[sp.rid] },
      function(sp){ return sp.type === meta.anchor && (isOpenLocation() || !sp.out) }
    ];
    for(var t=0;t<tries.length;t++){
      for(var i=0;i<open.length;i++){
        var sp = open[i];
        if(!tries[t](sp) || !clear(sp)) continue;
        sp.taken = true;
        var rec = place(document.getElementById("objects"), kind, sp.x, sp.y, hgt, true);
        rec.g.dataset.thing = "1";
        tuck(rec, sp);
        rec.sp = sp;
        rec.cx = sp.x + wid/2; rec.cy = sp.y - hgt/2;
        /* two of a kind in one house say different things */
        lineAt[kind] = lineAt[kind] === undefined ? Math.floor(rndT()*meta.lines.length) : lineAt[kind] + 1;
        rec.line = meta.lines[lineAt[kind] % meta.lines.length];
        things.push(rec);
        return;
      }
    }
    /* nowhere it would believably be left: a house with eleven is fine */
  });

  // Scenery joins the painter's order after hide placement, so decorative
  // trees cannot accidentally become new hiding spots or block a find entirely.
  if(currentLocation.id === "park") parkScenery.forEach(function(o){
    objL.appendChild(o.g); placed.push(o);
  });
  deepen(placed, targets.concat(things), seed);
  unbury(targets, placed);
  unbury(things, placed);
  parkOpeningLandmark=currentLocation.id === "park" ?
    placed.filter(function(o){return o.kind === "parkConservatory"})[0] || placed.filter(function(o){return o.kind === "parkGazebo"})[0] : null;
  return targets;
}

/* ------------------------------ depth ------------------------------
   The generator lays every room out along one floor line, the way the house
   was always drawn. This then stands each thing at a depth in its room, from
   0 at the open front to 1 against the back wall, and draws it there: pulled
   toward the room's vanishing point and made smaller the further back it is.
   The layout, and so where every cat hides, is the generator's; only the
   depth is new. It is read off the furniture, never off the PRNG, so a house
   number still means the same house.

   What the depth buys is what a flat house cannot do: Shadow behind the
   wardrobe is actually behind it, a cat in front of the sofa is in front of
   it, and the back of a room is further away than the front. */
var EYE = 0.56, SB = 0.76;
var DEPTH = {
  /* against the back wall */
  wardrobe:.92, bookshelf:.92, fridge:.92, counter:.92, dresser:.9, washer:.92, stove:.92,
  basin:.92, toilet:.9, bathtub:.88, desk:.88, tv:.9, radiator:.97, bunkbed:.88, bed:.86,
  sofa:.84, boxes:.86, ladder:.94, guitar:.92, toolbox:.8, bin:.78, pegboard:.98,
  /* out in the room */
  armchair:.56, coffeetable:.42, chair:.6, stool:.5, sidetable:.8, plant:.72, cactus:.72,
  floorlamp:.82, toybox:.62, bike:.7, rug:.34, catbed:.5, carrier:.5, cushion:.5, slippers:.3
};
function depthOf(o){
  if(o.base === "wall") return 1;
  if(o.base === "ceil") return 0.5;
  if(o.on) return o.on.t !== undefined ? o.on.t : depthOf(o.on);
  var t = DEPTH[o.kind] === undefined ? 0.75 : DEPTH[o.kind];
  /* a little give, from where it stands, so a row of chairs is not a rank */
  return Math.min(1, t + (((Math.round(o.x) * 37) % 11) / 11 - 0.5) * 0.06);
}
/* A cat takes the depth of the thing it hides by: behind tall furniture is a
   little further back than it, the middle of the floor in front of something
   is well forward of it, and on top of something is on top of it. */
function hideDepth(rec){
  var sp = rec.sp, h = sp && sp.host;
  if(!h || h.t === undefined) return 0.6;
  if(sp.type === "edge") return Math.min(1, h.t + 0.04);
  /* only off a real floor: in front of a lamp on a table is mid-air */
  if(sp.type === "floor" && sp.side === "m" && h.base === "floor") return Math.max(0.12, h.t - 0.3);
  return h.t;
}
function roomOf(o){
  var ri = o.sp && o.sp.host ? o.sp.host.room : o.room;
  var rm = ri >= 0 ? ROOMS[ri] : null;
  return rm && !rm.outside ? rm : null;
}
function vanish(room){ return {x:room.x + room.w/2, y:room.y + room.h*(1 - EYE)} }
/* the inside of one room: ceiling, side walls, back wall, floor */
function roomBox(layer, room){
  var group = el("g", {"class":"room", "data-room-type":room.id, "pointer-events":"none"});
  HKKRoomArt.apply(group, room.id);
  layer.appendChild(group);
  var v = vanish(room), x0 = room.x, x1 = room.x + room.w, yc = room.y, yf = room.y + room.h;
  function b(x, y){ return [v.x + (x - v.x)*SB, v.y + (y - v.y)*SB] }
  function poly(cls, a){
    group.appendChild(el("polygon", {"class":"dp " + cls, "stroke-width":(shellW()*0.75).toFixed(2),
      points:a.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1) }).join(" ")}));
  }
  var floor = {kitchen:"f-tile", bath:"f-tile", utility:"f-tile", living:"f-wood", study:"f-wood",
               attic:"f-wood", bed:"f-soft", kids:"f-soft"}[room.id] || "";
  poly("dp-ceil", [[x0,yc], [x1,yc], b(x1,yc), b(x0,yc)]);
  poly("dp-side", [[x0,yf], [x0,yc], b(x0,yc), b(x0,yf)]);
  poly("dp-side", [[x1,yf], [x1,yc], b(x1,yc), b(x1,yf)]);
  poly("dp-back", [b(x0,yf), b(x1,yf), b(x1,yc), b(x0,yc)]);
  poly("dp-floor " + floor, [[x0,yf], [x1,yf], b(x1,yf), b(x0,yf)]);
  HKKRoomArt.details(group, room, b);
}
/* move one placed thing back to depth t in its room */
function setDepth(r, t, room){
  var v = vanish(room), s = 1 - t*(1 - SB);
  function X(x){ return v.x + (x - v.x)*s }
  function Y(y){ return v.y + (y - v.y)*s }
  r.x = X(r.x); r.y = Y(r.y); r.w *= s; r.h *= s;
  if(r.cx !== undefined){ r.cx = X(r.cx); r.cy = Y(r.cy) }
  if(r.inkTop) r.inkTop *= s;
  var sc = parseFloat(r.art.getAttribute("data-sc")) * s;
  r.art.setAttribute("transform", "translate(" + r.x.toFixed(1) + " " + r.y.toFixed(1) + ") scale(" + sc.toFixed(4) + ")");
  r.art.setAttribute("data-sc", sc.toFixed(4));
  r.art.setAttribute("stroke-width", artW(r.kind, sc));
  MANGA.tune(r.art, r.kind, sc);
  var hit = r.g.querySelector(".hit");
  if(hit){
    var hx = parseFloat(hit.getAttribute("x")), hy = parseFloat(hit.getAttribute("y"));
    hit.setAttribute("x", X(hx).toFixed(1)); hit.setAttribute("y", Y(hy).toFixed(1));
    hit.setAttribute("width", (parseFloat(hit.getAttribute("width"))*s).toFixed(1));
    hit.setAttribute("height", (parseFloat(hit.getAttribute("height"))*s).toFixed(1));
  }
  r.t = t;
  r.g.dataset.depth = t.toFixed(3);
  HKKRoomArt.apply(r.g, room.id);
  MANGA.tune(r.art, r.kind, sc);
  if(r.kind === "window") HKKRoomArt.windowLight(r, room, skyMode);
  if(r.base === "floor" && !CATS[r.kind] && !THINGS[r.kind] && r.h > 24){
    var shadow = el("ellipse", {"class":"room-contact", cx:(r.x+r.w*.52).toFixed(1), cy:(r.y+r.h).toFixed(1),

/* ---- the front of the room ----

   behind it is partly behind something. Dealt from a stream of their own,
   after the cats, so a house number keeps its cats exactly where they were;
   and never over more than a third of a cat or a thing, so what is hidden
   behind them is still there to be found. */
var FRONT = {

  kids:["toybox","chair","stool","cushion"],
  study:["chair","plant","stool"],
  hall:["plant","stool","boxes"],
  landing:["plant","stool","boxes"],
  bath:["stool","plant"],

function furnishFront(placed, hiders, seed){
  var rndF = mulberry32((seed ^ 0x27D4EB2F) | 0);
  /* place() reads the house's stream for lamps and idles; lend it this one,
     so the people dealt after the house still walk where they always did */
  var keepRnd = rnd, keepRoom = placingRoom;
  rnd = rndF;
  var layer = document.getElementById("objects");
  ROOMS.forEach(function(room, ri){
    var pool = FRONT[room.id];
    if(room.outside || !pool) return;
    var mine = hiders.filter(function(h){ return roomOf(h) === room });
    var front = [], n = Math.max(1, Math.min(3, Math.round(room.w / 300)));
    var v = vanish(room), floorY = room.y + room.h;
    for(var k = 0; k < n; k++){
      if(rndF() < 0.25) continue;
      var kind = pool[Math.floor(rndF() * pool.length)], o = OBJ[kind];
      if(!o) continue;

      if(w > room.w * 0.4) continue;

        if(mine.some(function(r){ return over(r) > 0.3 * r.w * r.h })) continue;
        if(front.some(function(r){ return over(r) > 0 })) continue;
        placingRoom = ri;

        rec.base = "floor"; rec.out = false;

}

function parkGround(rec){

  var ground=new Map();

  Array.prototype.map.call(layer.children,function(n,i){return {n:n,i:i,y:ground.get(n)||0}})
    .sort(function(a,b){return a.y-b.y || a.i-b.i})

function deepen(placed, hiders, seed){
  if(isOpenLocation()){
    placed.concat(hiders).forEach(function(o){o.g.dataset.ground=String(parkGround(o))});
    orderParkObjects(document.getElementById("objects"),placed,hiders);
    return;
  }
  placed.forEach(function(o){
    var rm = o.room >= 0 ? ROOMS[o.room] : null;
    if(!rm || rm.outside) return;
    setDepth(o, depthOf(o), rm);
  });
  hiders.forEach(function(rec){
    var rm = roomOf(rec);
    if(rm) setDepth(rec, hideDepth(rec), rm);

     generator's order, which already puts a cat on top of what it sits on */

    .forEach(function(e){ layer.appendChild(e.n) });

/* A cat tucked behind something is the game. A cat painted over completely is
   not hidden, it is absent — and no amount of looking will find it. The riso
   house never had to think about this because everything in it was an outline
   you could see straight through; the moment the furniture filled in, a cat
   could end up entirely underneath a tree trunk.

   Rescue a cat only when its head is buried too. Furniture footprints include
   empty space above their drawings: a toilet's footprint starts above its
   cistern. Counting that space as cover pulled a clearly visible cat off its
   radiator and painted it in front of the toilet. Partial cover stays intact. */
function drawingBounds(art){
  try{
    var box = art.getBBox(), m = world.getCTM().inverse().multiply(art.getCTM());
    var corners = [[box.x,box.y],[box.x+box.width,box.y],

    var xs = [], ys = [];
    corners.forEach(function(c){
      var p = scene.createSVGPoint(); p.x = c[0]; p.y = c[1];
      p = p.matrixTransform(m); xs.push(p.x); ys.push(p.y);
    });
    var x = Math.min.apply(null,xs), y = Math.min.apply(null,ys);
    return {x:x,y:y,w:Math.max.apply(null,xs)-x,h:Math.max.apply(null,ys)-y};

function unbury(targets, placed){
  var layer = document.getElementById("objects");
  var inkBounds = new Map(); // Measured only for potential occluders, once at build time.
  targets.forEach(function(rec){
    var portrait = rec.art.querySelector(".mg-character");
    var head = portrait && drawingBounds(portrait);
    for(var pass = 0; pass < 4; pass++){
      var order = Array.prototype.slice.call(layer.children);
      var ci = order.indexOf(rec.g);
      if(ci < 0) return;
      var area = Math.max(1, rec.w * rec.h), worst = null, worstAt = ci;
      for(var n = 0; n < placed.length; n++){
        var o = placed[n], oi = order.indexOf(o.g);
        if(oi <= ci) continue;                      /* drawn first: cannot cover it */
        var ox = Math.min(rec.x + rec.w, o.x + o.w) - Math.max(rec.x, o.x);
        var oy = Math.min(rec.y + rec.h, o.y + o.h) - Math.max(rec.y, o.y);
        if(ox > 0 && oy > 0 && (ox * oy) / area > 0.6 && oi > worstAt){
          if(head && head.w > 0 && head.h > 0){
            if(!inkBounds.has(o)) inkBounds.set(o, drawingBounds(o.art));
            var ink = inkBounds.get(o) || o;
            var hx = Math.max(0, Math.min(head.x+head.w,ink.x+ink.w)-Math.max(head.x,ink.x));
            var hy = Math.max(0, Math.min(head.y+head.h,ink.y+ink.h)-Math.max(head.y,ink.y));
            if(hx*hy/(head.w*head.h) <= 0.75) continue;
          }
          worst = o; worstAt = oi;
        }
      }
      if(!worst) return;
      layer.insertBefore(rec.g, worst.g.nextSibling);
    }
  });
}

function spawnFolk(room, floorY, v){
  var cm = v.child ? rf(108, 134) : rf(158, 184);
  var h = cm * PPC, s = h/100, w = FOLK_W*s;
  var g = el("g", {"class":"obj folk"});
  g.dataset.kind = "folk"; g.dataset.folk = "1";
  g.dataset.character = v.id;
  g.classList.toggle("folk-child", !!v.child);
  g.classList.toggle("folk-woman", !!v.woman);
  g.classList.toggle("folk-shorts", !!v.shorts);
  g.classList.toggle("folk-barelegs", !!v.woman && !!v.dress && !v.stockings);
  g.style.setProperty("--fk-skin", v.skin);
  g.style.setProperty("--fk-hair", v.ink);
  g.style.setProperty("--fk-shirt", v.shirt);
  g.style.setProperty("--fk-trousers", v.trousers);
  if(v.accent) g.style.setProperty("--fk-accent", v.accent);
  var art = el("g", {"class":"art", "stroke-width":artW("folk",s)});
  var inner = el("g", {"class":"w"});
  var bob = el("g", {"class":"bob"}, folkMarkup(v));
  inner.appendChild(bob);
  art.appendChild(inner);
  /* hit box rides along inside the transformed group */
  art.appendChild(el("rect",{"class":"hit", x:-10, y:-14, width:FOLK_W+20, height:120}));
  g.appendChild(art);
  if(isOpenLocation()){
    // Insert once by walking-lane depth. Nearer tables and stalls cover passers-by.
    // Their ground never changes, so there is no sorting work in the walk loop.
    g.dataset.ground=String(floorY);
    var streetLayer=document.getElementById("objects");
    var nearer=Array.prototype.find.call(streetLayer.children,function(n){return Number(n.dataset.ground)>floorY});
    streetLayer.insertBefore(g,nearer||null);
  }else document.getElementById("folks").appendChild(g);

  var p = {
    g:g, art:art, bob:bob, s:s, w:w, top:floorY - h,
    x0:room.x + 14, x1:room.x + room.w - 14 - w,
    dir:rnd() < .5 ? 1 : -1,
    spd:rf(24, 44), ph:rnd()*6.3, pause:rf(0, 2.5),
    legB:bob.querySelector(".legB"), legF:bob.querySelector(".legF"),
    shinB:bob.querySelector(".shinB"), shinF:bob.querySelector(".shinF"),
    footB:bob.querySelector(".legB .foot"), footF:bob.querySelector(".legF .foot"),
    armB:bob.querySelector(".armB"), armF:bob.querySelector(".armF"),
    carry:v.carry === "backpack" ? "" : v.carry, rig:folkRig(v.child, v.woman)
  };
  if(p.x1 < p.x0){ p.x0 = p.x1 = room.x + 14 }
  p.x = rf(p.x0, p.x1);
  poseFolk(p, 0);
  folks.push(p);
}

/* Solve the lifted leg against a ground-relative ankle target. A knee bend
   alone can extend the shoe below the floor as the thigh swings forward. */
function folkSwingLeg(rig, hip, lift){
  var a = hip*Math.PI/180, upper = rig.knee-rig.hip, lower = 100-rig.knee;
  var x = -rig.leg*Math.sin(a), y = rig.leg*Math.cos(a)-lift;
  var bend = Math.acos(Math.max(-1,Math.min(1,(x*x+y*y-upper*upper-lower*lower)/(2*upper*lower))));
  var angle = Math.atan2(-x,y)-Math.atan2(lower*Math.sin(bend),upper+lower*Math.cos(bend));
  return {hip:angle*180/Math.PI,knee:bend*180/Math.PI};
}
function poseFolk(p, swing, cos){
  cos = cos || 0;
  var tx = p.x + (p.dir < 0 ? p.w : 0);
  p.art.setAttribute("transform",
    "translate("+tx.toFixed(1)+" "+p.top.toFixed(1)+") scale("+(p.dir*p.s).toFixed(4)+" "+p.s.toFixed(4)+")");

  /* Shoes stay flat while hips and knees move. Ground the planted ankle,
     including the half-unit sole stroke, without measuring DOM bounds. */
  var rig = p.rig;
  var hipB = swing*SWING, hipF = -swing*SWING;
  var kneeB = 0, kneeF = 0;
  var stanceHip = cos >= 0 ? hipB : hipF;
  var lifted = folkSwingLeg(rig, cos >= 0 ? hipF : hipB, rig.leg*.08*cos*cos);
  if(cos >= 0){ hipF = lifted.hip; kneeF = lifted.knee }
  else{ hipB = lifted.hip; kneeB = lifted.knee }
  var stanceY = rig.hip + rig.leg*Math.cos(stanceHip*Math.PI/180);
  p.bob.setAttribute("transform", "translate(0 " + (100-stanceY-.5).toFixed(3) + ")");
  p.footB.setAttribute("transform", "rotate("+(-hipB-kneeB).toFixed(3)+" "+LEG_BX+" 100)");
  p.footF.setAttribute("transform", "rotate("+(-hipF-kneeF).toFixed(3)+" "+LEG_FX+" 100)");

  /* each limb turns about its own hip / shoulder, all on one vertical line */
  p.legB.setAttribute("transform","rotate("+hipB.toFixed(3)+" "+LEG_BX+" "+rig.hip+")");
  p.legF.setAttribute("transform","rotate("+hipF.toFixed(3)+" "+LEG_FX+" "+rig.hip+")");

  /* Only the travelling leg lifts and bends; the supporting leg stays
     straight with its sole on the floor. */
  p.shinB.setAttribute("transform","rotate("+kneeB.toFixed(3)+" "+LEG_BX+" "+rig.knee+")");
  p.shinF.setAttribute("transform","rotate("+kneeF.toFixed(3)+" "+LEG_FX+" "+rig.knee+")");
  if(!p.carry){
    p.armB.setAttribute("transform","rotate("+(-swing*15).toFixed(1)+" "+LEG_BX+" "+rig.shoulder+")");
    p.armF.setAttribute("transform","rotate("+( swing*15).toFixed(1)+" "+LEG_FX+" "+rig.shoulder+")");
  }
}

/* A cat found in the garden gets up and trots indoors rather than simply
   being ticked off where it stands. */
/* ======================= doors on the ground floor =======================
   Cats do not let themselves in. Each outside wall of the ground floor gets a
   door the player works by hand, and a cat called in from the garden walks to
   it and waits there until somebody opens it. That wait is the point: it is a
   tiny obligation, and it turns "found" into "let in". */
var doors = [];
var DOOR_W = 96, DOOR_H = 200;

/* The rooms are drawn as separate panels with deliberate gaps between them,
   which is what makes the cutaway read as a cutaway. At the outside edges
   though, those gaps left the house with no exterior at all: four storeys of
   rooms stacked in mid-air. Two continuous side walls, drawn a touch heavier
   than the partitions the way a plan distinguishes external from internal,
   give the house an outside while every gap between rooms survives.
   They stop at the door lintels, because a doorway is a hole in a wall. */
function houseShell(bg){
  if(isOpenLocation()) return;
  var inside = ROOMS.filter(function(r){ return !r.outside });
  if(!inside.length) return;
  var x0 = Math.min.apply(null, inside.map(function(r){ return r.x }));
  var x1 = Math.max.apply(null, inside.map(function(r){ return r.x + r.w }));
  var y0 = Math.min.apply(null, inside.map(function(r){ return r.y }));
  var lintel = GROUND - DOOR_H;
  bg.appendChild(el("path", {fill:"none", "stroke-width":4.4,
    d:"M" + x0 + " " + y0 + "V" + lintel + "M" + x1 + " " + y0 + "V" + lintel}));
}

function buildDoors(layer){
  layer.innerHTML = ""; doors = [];
  if(isOpenLocation()) return;
  var ground = ROOMS.filter(function(r){ return !r.outside && r.y + r.h >= GROUND - 2 });
  if(!ground.length) return;
  var leftWall  = Math.min.apply(null, ground.map(function(r){ return r.x }));
  var rightWall = Math.max.apply(null, ground.map(function(r){ return r.x + r.w }));
  doors.push(makeDoor(layer, leftWall,  -1));
  doors.push(makeDoor(layer, rightWall, +1));
}

/* hinge sits on the house wall; the leaf reaches out over the garden or the
   street, so opening it collapses the leaf back against the brickwork */
function makeDoor(layer, hingeX, out){
  var y = GROUND, top = GROUND - DOOR_H, far = out * DOOR_W;
  var g = el("g", {"class":"obj door"});
  g.dataset.kind = "door";

  /* the opening itself: paper, so you see into the house when the leaf clears */
  g.appendChild(el("rect", {fill:"var(--paper)", stroke:"none",
    x:Math.min(hingeX, hingeX+far), y:top, width:DOOR_W, height:DOOR_H}));
  /* frame and threshold */
  /* lintel and outer jamb only: the inner side of the frame IS the gap left
     in the outside wall, so drawing it again would fill the doorway back in */
  g.appendChild(el("g", {"class":"shl", "stroke-width":shellW()},
    '<path d="M'+hingeX+' '+top+'H'+(hingeX+far)+'V'+y+'"/>' +
    '<path d="M'+(hingeX+far-out*16)+' '+y+'H'+(hingeX+out*16)+'"/>'));

  var pivot = el("g", {transform:"translate("+hingeX+" 0)"});
  var leaf  = el("g", {"class":"leaf", transform:"scale(1 1)"});
  leaf.appendChild(el("rect", {"class":"leaf-fill",
    x:Math.min(0, far), y:top, width:DOOR_W, height:DOOR_H}));
  leaf.appendChild(el("g", {"class":"shl dr", "stroke-width":shellW()},
    '<path d="M0 '+y+'V'+top+'H'+far+'V'+y+'Z"/>' +
    '<path d="M'+(out*14)+' '+(top+18)+'H'+(far-out*14)+'V'+(top+78)+'H'+(out*14)+'Z"/>' +
    '<path d="M'+(out*14)+' '+(top+96)+'H'+(far-out*14)+'V'+(y-18)+'H'+(out*14)+'Z"/>'));
  leaf.appendChild(el("circle", {"class":"shl", cx:(far - out*17), cy:(top + DOOR_H*0.52), r:6,
    "stroke-width":shellW()}));
  pivot.appendChild(leaf);
  g.appendChild(pivot);

  g.appendChild(el("rect", {"class":"hit",
    x:Math.min(hingeX, hingeX+far)-16, y:top-16, width:DOOR_W+32, height:DOOR_H+32}));
  layer.appendChild(g);
  return {g:g, leaf:leaf, hingeX:hingeX, out:out, sx:1, open:false,
          standX:hingeX + far + out*8};
}

function toggleDoor(g){
  var d = doors.find(function(x){ return x.g === g });
  if(!d) return;
  setDoor(d, !d.open);
  beep(d.open ? 250 : 190, .22, "triangle", .045);
}

function setDoor(d, open){
  if(d.open === open) return;
  d.open = open;
  var from = d.sx, to = open ? 0.12 : 1, t0 = performance.now();
  (function step(now){
    var u = Math.min(1, (now - t0)/460), e = 1 - Math.pow(1 - u, 3);
    d.sx = from + (to - from)*e;
    d.leaf.setAttribute("transform", "scale(" + d.sx.toFixed(3) + " 1)");
    if(u < 1) requestAnimationFrame(step);
  })(performance.now());
}

function sendCatHome(rec){
  var o = OBJ.cat_walking;
  var h = rec.h * 0.98, sc = h/o.h, w = o.w*sc;
  var ground = rec.y + rec.h;
  var dir = (rec.cx < HX + HW/2) ? 1 : -1;          /* head for the nearest door */
  var door = doors.find(function(d){ return d.out === -dir }) || doors[0];
  var g = el("g", {"class":"catwalk"});
  g.dataset.kind = "cat_walking";
  g.style.setProperty("--coat", (CATS[rec.kind] && CATS[rec.kind].coat) || "#EFEBE4");
  /* found is found: the walk home is in its own colours, not the garden's */
  g.style.setProperty("--wash", "100%");
  var art = el("g", {"class":artCls("cat_walking","art"), "stroke-width":artW("cat_walking",sc)}, o.s);
  g.appendChild(art);
  document.getElementById("fx").appendChild(g);
  /* waitX: shoulder to the doorframe. tx: over the threshold. stopX: where it
     settles in the room behind the door, which is where it stays. */
  var waitX, tx;
  if(!door){ waitX = tx = (dir > 0 ? HX + 40 : HX + HW - 40 - w) }
  else if(door.out < 0){ waitX = door.hingeX - DOOR_W - w - 6; tx = door.hingeX }
  else               { waitX = door.hingeX + DOOR_W + 6;      tx = door.hingeX - w }
  var spot = door && homeSpot(rec, door), stopX = tx;
  if(spot) stopX = dir > 0 ? Math.max(tx, spot.cx - w/2) : Math.min(tx, spot.cx - w/2);
  walkers.push({
    g:g, art:art, s:sc, w:w, y:ground - h, dir:dir,
    x:rec.cx - w/2, door:door, waitX:waitX, tx:tx, stopX:stopX, spot:spot, rec:rec,
    name:CATS[rec.kind].name,
    spd: 150 + Math.random()*50, ph:0
  });
}

/* ---- cats who have come in stay in ----
   A cat let in from the garden used to step over the threshold and vanish.
   Now it walks on into the room behind the door and settles there, in its
   own pose and its own colours, for the rest of the night. Several coming in
   by the same door line up along the floor rather than on top of each other. */
var arrivals = {};
function doorRoom(door){
  var ground = ROOMS.filter(function(r){ return !r.outside && r.y + r.h >= GROUND - 2 });
  if(!ground.length) return null;
  return ground.reduce(function(a, r){
    return door.out < 0 ? (r.x < a.x ? r : a) : (r.x + r.w > a.x + a.w ? r : a);
  });
}
/* Shadow's own pose is two thirds of a face round the edge of something, and
   on an open floor that is a head coming up through the boards: he sits. */
function restKind(kind){ return kind === "cat_peek" ? "cat_highsit" : kind }
function homeSpot(rec, door){
  var room = doorRoom(door);
  if(!room) return null;
  var ri = ROOMS.indexOf(room), n = arrivals[ri] = (arrivals[ri] || 0) + 1;
  var o = OBJ[restKind(rec.kind)], sw = o.w * rec.h / o.h, gap = sw + 14;
  /* clear of the side wall, which slants in across the floor, and of the doorway */
  var inset = room.w/2 * (1 - SB) + 24;
  var fit = Math.max(1, Math.floor((room.w - 2*inset) / gap));
  var off = inset + sw/2 + ((n - 1) % fit) * gap;
  return {room:room, ri:ri, dir:-door.out,
          cx:door.out < 0 ? room.x + off : room.x + room.w - off};
}
function seatCat(rec, spot){
  var kind = restKind(rec.kind), o = OBJ[kind], s = rec.h / o.h, sw = o.w * s;
  var floor = spot.room.y + spot.room.h, x0 = spot.cx - sw/2;
  /* facing the way it walked in, whichever way its own drawing faces */
  var hd = /class="ct-hd" cx="([\d.]+)"/.exec(o.s);
  var flip = (spot.dir > 0) !== (!hd || parseFloat(hd[1]) >= o.w/2);
  var g = el("g", {"class":"cat-in"});
  g.dataset.kind = rec.kind;
  g.style.setProperty("--coat", (CATS[rec.kind] && CATS[rec.kind].coat) || "#EFEBE4");
  g.style.setProperty("--wash", "100%");
  var art = el("g", {"class":artCls(kind, "art"), "stroke-width":artW(kind, s),
    transform:"translate(" + (flip ? x0 + sw : x0).toFixed(1) + " " + (floor - rec.h).toFixed(1) +
              ") scale(" + (flip ? -s : s).toFixed(4) + " " + s.toFixed(4) + ")"});
  art.appendChild(el("g", {"class":"w"}, o.s));
  g.appendChild(art);
  document.getElementById("fx").appendChild(g);
  /* found is found, wherever it was found: the same tick as every other cat */
  markFound({x:x0, y:floor - rec.h, w:sw, h:rec.h});
}

/* Indoor finds get a short, local homecoming too. Unlike garden cats they do
   not need a door, but seeing the cat cross to a clear spot in its room makes
   a discovery change the house, not just the roll call. */
function settleIndoorCat(rec){
  var ri = Number(rec.g.dataset.room), room = ROOMS[ri];
  if(!room) return;
  var walk = OBJ.cat_walking, h = Math.min(42, rec.h * 1.12), sc = h / walk.h, w = walk.w * sc;
  var sx = rec.cx - w/2;
  var dx = Math.max(room.x + 24, Math.min(room.x + room.w - w - 24,
    room.x + room.w * (rec.cx < room.x + room.w/2 ? .68 : .26)));
  var dir = dx >= sx ? 1 : -1, y = room.y + room.h - h;
  var g = el("g", {"class":"catwalk"});
  g.dataset.kind = "cat_walking";
  g.style.setProperty("--coat", (CATS[rec.kind] && CATS[rec.kind].coat) || "#EFEBE4");
  var art = el("g", {"class":artCls("cat_walking","art"), "stroke-width":artW("cat_walking",sc)}, walk.s);
  g.appendChild(art); document.getElementById("fx").appendChild(g);
  var begun = performance.now(), duration = REDUCED ? 1 : 820;
  (function step(now){
    var t = Math.min(1, (now - begun) / duration), ease = 1 - Math.pow(1 - t, 3);
    var x = sx + (dx - sx) * ease, bob = REDUCED ? 0 : Math.abs(Math.sin(t * Math.PI * 5)) * 1.6;
    art.setAttribute("transform", "translate(" + (x + (dir > 0 ? w : 0)).toFixed(1) + " " +
      (y - bob).toFixed(1) + ") scale(" + (-dir * sc).toFixed(4) + " " + sc.toFixed(4) + ")");
    if(t < 1){ requestAnimationFrame(step); return; }
    if(g.parentNode) g.parentNode.removeChild(g);
    var settled = rec.art.cloneNode(true), own = OBJ[rec.kind], ownSc = Math.min(rec.h / own.h, .72);
    settled.setAttribute("class", "art pass2 home-settled");
    settled.setAttribute("transform", "translate(" + dx.toFixed(1) + " " + (room.y + room.h - own.h * ownSc).toFixed(1) + ") scale(" + ownSc.toFixed(4) + ")");
    document.getElementById("fx").appendChild(settled);
    /* One room settles down with its cat. This is local rather than the
       progress lighting rule, so the player can connect effect to cause. */
    var lamps = roomLamps[String(ri)] || [];
    if(lamps.length) lamps[0].classList.remove("lit");
  })(begun);
}

function folkTick(now){
  folkRAF = requestAnimationFrame(folkTick);
  var dt = Math.min(0.05, (now - folkLast)/1000) || 0;
  folkLast = now;

  for(var w = walkers.length - 1; w >= 0; w--){
    var c = walkers[w];
    c.x += c.dir * c.spd * dt;
    c.ph += dt * 9;
    /* A shut door opens for them. It used to stay shut until the player came
       and tapped it, with the cat knocking on the step, and the night would
       not end until they had; nobody understood why. Now the cat asks once
       and is let in, and the door shuts behind it. */
    if(c.door && !c.door.open && !c.inside &&
       ((c.dir > 0 && c.x >= c.waitX) || (c.dir < 0 && c.x <= c.waitX))){
      setDoor(c.door, true);
      c.opened = true;
      meow();
    }
    var bob = Math.abs(Math.sin(c.ph)) * 1.8;
    /* cat_walking is drawn facing left (head at x16, tail at x71), so it needs
       mirroring to head RIGHT — the opposite of the people, who face right. */
    c.art.setAttribute("transform",
      "translate(" + (c.x + (c.dir > 0 ? c.w : 0)).toFixed(1) + " " + (c.y - bob).toFixed(1) +
      ") scale(" + (-c.dir*c.s).toFixed(4) + " " + c.s.toFixed(4) + ")");
    if(!c.inside && ((c.dir > 0 && c.x >= c.tx) || (c.dir < 0 && c.x <= c.tx))){
      c.inside = true;                               /* in through the door */
      /* and shut it again once nobody else is on their way to it */
      if(c.opened) (function(d){ setTimeout(function(){
        if(!walkers.some(function(o){ return o.door === d && !o.inside })) setDoor(d, false);
      }, 500) })(c.door);
      beep(520, .09, "sine", .04);
      if(!c.spot){                                   /* no room to go to */
        c.g.style.opacity = "0";
        (function(n){ setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n) }, 560) })(c.g);
        walkers.splice(w, 1);
        if(wantFinish && !walkers.length) tryFinish();
        continue;
      }
    }
    if(c.inside && ((c.dir > 0 && c.x >= c.stopX) || (c.dir < 0 && c.x <= c.stopX))){
      if(c.g.parentNode) c.g.parentNode.removeChild(c.g);
      seatCat(c.rec, c.spot);
      walkers.splice(w, 1);
      if(wantFinish && !walkers.length) tryFinish();
    }
  }
  // The people are decorative. Skip their SVG writes while the camera moves
  // or the menu covers the house; cats walking home still advance above.
  if(camMoving || menuOpen || document.hidden) return;
  var vx0 = -view.x/view.k, vx1 = (cw-view.x)/view.k;
  var vy0 = -view.y/view.k, vy1 = (ch-view.y)/view.k;
  for(var i=0;i<folks.length;i++){
    var p = folks[i];
    // No decorative SVG writes for people outside the visible room.
    var margin = 14*p.s; // Include the oversized hair and head at the edge.
    if(p.x+p.w+margin < vx0 || p.x-margin > vx1 || p.top+100*p.s < vy0 || p.top-margin > vy1) continue;
    if(p.pause > 0){
      p.pause -= dt;
      if(!p.resting){ poseFolk(p, 0); p.resting = true }
      continue;
    }
    p.resting = false;
    p.x += p.dir * p.spd * dt;
    // Match a full cycle to two strides at this person's height and speed.
    p.ph += dt * p.spd * Math.PI/(2*p.rig.leg*p.s*Math.sin(SWING*Math.PI/180));
    if(p.x <= p.x0){ p.x = p.x0; p.dir = 1; p.pause = 0.5 + Math.random()*1.2 }
    else if(p.x >= p.x1){ p.x = p.x1; p.dir = -1; p.pause = 0.5 + Math.random()*1.2 }
    /* stop now and then to look at something */
    else if(Math.random() < dt * 0.09){ p.pause = 0.9 + Math.random()*2.6 }
    poseFolk(p, swingAt(p.ph), Math.cos(p.ph));
  }
}

/* ---- lightning ----
   Drawn fresh for every strike so no two are the same, and the thunder lags
   the flash the way it does outside. Both the bolt and the warm wash over the
   scene are one-shot CSS animations, re-triggered by removing and re-adding
   the class with a reflow in between. */
function startStorm(){
  clearInterval(stormTimer);
  if(!WEATHER[weather].bolts || REDUCED) return;
  stormTimer = setInterval(function(){
    if(document.hidden || Math.random() < 0.45) return;
    strike();
  }, 3400);
}

function strike(){
  var bolt = document.querySelector("#bg .bolt"), flash = document.querySelector("#bg .flash");
  if(!bolt) return;
  var x = Math.random() < 0.5 ? 140 + Math.random()*Math.max(60, GARDEN-320)
                              : HX + HW + 140 + Math.random()*Math.max(60, GARDEN-320);
  var d = "M" + x.toFixed(0) + " 30", cx = x, cy = 30;
  for(var i=0;i<4;i++){
    cx += Math.random()*96 - 48; cy += 70 + Math.random()*70;
    d += "L" + cx.toFixed(0) + " " + cy.toFixed(0);
  }
  bolt.setAttribute("d", d);
  [bolt, flash].forEach(function(n){
    if(!n) return;
    n.classList.remove("strike"); n.getBoundingClientRect(); n.classList.add("strike");
  });
  setTimeout(function(){
    beep(52, 1.2, "sawtooth", .045);
    beep(38, 1.6, "sine", .05);
  }, 260 + Math.random()*520);
}

/* ---- the house going to bed ----
   Each cat home puts another room's lights out, so progress is something you
   feel rather than read. Which room goes dark is deliberately RANDOM: tying it
   to the room a cat came from would light up exactly where the cats are and
   hand the player a map. Street lamps stay on, and the hall keeps one light
   burning until the very last cat is in. */
var lampTimer = null, roomLamps = {}, litRooms = [], hallIx = -1;

function startLampLife(){
  clearInterval(lampTimer);
  roomLamps = {}; litRooms = [];
  hallIx = -1;
  ROOMS.forEach(function(r, i){ if(r.id === "hall" && hallIx < 0) hallIx = i });

  Array.prototype.forEach.call(document.querySelectorAll("#objects .obj"), function(n){
    var k = n.dataset.kind;
    if(!LAMPS[k] || k === "streetlamp") return;      /* the street stays lit */
    var ri = n.dataset.room;
    if(ri === undefined) return;
    (roomLamps[ri] = roomLamps[ri] || []).push(n);
  });
  litRooms = Object.keys(roomLamps);
  /* keep the hall for last */
  litRooms.sort(function(a, b){ return (a == hallIx) - (b == hallIx) });

  if(!litRooms.length || REDUCED) return;
  lampTimer = setInterval(function(){
    if(document.hidden || !litRooms.length) return;
    /* only rooms still awake flicker */
    var ri = litRooms[Math.floor(Math.random()*Math.max(1, litRooms.length - 1))];
    var pool = roomLamps[ri] || [];
    if(pool.length) pool[Math.floor(Math.random()*pool.length)].classList.toggle("lit");
  }, 2800);
}

/* darken enough rooms that the house tracks how far through the evening we are */
function darkenProgress(){
  if(skyMode === "day") return;      /* you do not turn the lights off at lunchtime */
  if(!targets.length) return;
  var total = Object.keys(roomLamps).length;
  if(!total) return;
  var want = Math.round(total * (found/targets.length));
  if(found < targets.length) want = Math.min(want, total - 1);   /* never all out early */
  var dark = total - litRooms.length;
  while(dark < want && litRooms.length > 1){
    var ri = litRooms.shift();                                    /* hall is last */
    (roomLamps[ri] || []).forEach(function(el){ el.classList.remove("lit") });
    dark++;
  }
}

function populate(){
  if(folkRAF){ cancelAnimationFrame(folkRAF); folkRAF = null }
  folks = []; walkers = []; arrivals = {};
  document.getElementById("folks").innerHTML = "";
  /* one household, spread across rooms — never two in the same one */
  var pool = currentLocation.id === "harbour" ? ROOMS.filter(function(r){return r.id !== "harbourWater"}) : ROOMS.slice();
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t }
  var n = Math.min(pool.length, ri(4, 6));
  // Two children and a mixed adult cast, without duplicates or extra walkers.
  // Appearance uses its own stream and never changes the hiding places.
  var castRnd = mulberry32((seed ^ 0x6A09E667) | 0);
  var adults = FOLK_CAST.filter(function(v){ return !v.child });
  var kids = FOLK_CAST.filter(function(v){ return v.child });
  function shuffleCast(list){
    for(var j=list.length-1;j>0;j--){ var ix=Math.floor(castRnd()*(j+1)); var v=list[j]; list[j]=list[ix]; list[ix]=v }
    return list;
  }
  var women = shuffleCast(adults.filter(function(v){ return v.woman }));
  var otherAdults = shuffleCast(adults.filter(function(v){ return !v.woman }));
  var grownups = [women[0], otherAdults[0]];
  var remaining = shuffleCast(adults.filter(function(v){ return grownups.indexOf(v) < 0 }));
  var cast = shuffleCast(kids).slice(0,2).concat(grownups, remaining.slice(0,n-4));
  shuffleCast(cast);
  for(var k=0;k<n;k++){
    var floor=currentLocation.id === "onsen" ? (pool[k].id === "onsenGarden" ? 1315 : 1100) : currentLocation.id === "harbour" ? (pool[k].id === "harbourBeach" ? 1240 : 1070) : currentLocation.id === "shopping" ? (pool[k].id === "streetSquare" ? 1150 : 900) : pool[k].y+pool[k].h;
    spawnFolk(pool[k],floor,cast[k]);
  }
  if(!REDUCED){ folkLast = performance.now(); folkRAF = requestAnimationFrame(folkTick) }
}

/* ============================ 3. view: pan & zoom ============================ */

var app=document.getElementById("app");
var stage=document.getElementById("stage"), scene=document.getElementById("scene"),
    world=document.getElementById("world");
var view={x:0,y:0,k:1}, fitK=1, cw=0, ch=0;

/* Moving the camera repaints the whole house. The world is an SVG group and
   an SVG transform is not composited, so every path in it is rasterised again
   on the CPU for each frame of a drag — which is why the phone sits at 23ms a
   frame with the GPU idle at 2ms. Two things go off while the camera moves
   and come back the moment it stops:

     - anti-aliasing, which is the expensive half of painting a filled shape
     - the idle animations, all 230 of them, each invalidating on the same
       main thread the drag is trying to use

   Neither is perceptible during a gesture, with one exception: rain that
   stops dead in mid-air, so the rain is not SMIL and keeps falling. Both are obvious if left off, so
   the flag clears itself shortly after the last frame rather than relying on
   any one gesture remembering to. */
var camT = 0, camMoving = false;
function syncSceneMotion(){
  try{
    if(REDUCED || menuOpen || camMoving || document.hidden) scene.pauseAnimations();
    else scene.unpauseAnimations();
  }catch(e){}
}
document.addEventListener("visibilitychange", syncSceneMotion);
function settleCamera(){
  // On a slow frame the 150ms timer can fire between two movement updates.
  // Keep the cheap rendering mode until the drag, glide or camera animation ends.
  if((ptrs && ptrs.size) || glideRAF || viewAnim){
    camT = setTimeout(settleCamera, 150);
    return;
  }
  camMoving = false;
  stage.classList.remove("moving");
  syncSceneMotion();
}
function cameraMoving(){
  if(!camMoving){
    camMoving = true;
    stage.classList.add("moving");
    try{ scene.pauseAnimations() }catch(e){}
  }
  clearTimeout(camT);
  camT = setTimeout(settleCamera, 150);
}

function applyView(){
  world.setAttribute("transform","translate("+view.x.toFixed(2)+" "+view.y.toFixed(2)+") scale("+view.k.toFixed(4)+")");
  MANGA.lod(view.k);
  cameraMoving();
}
function clampView(){
  var minK = fitK*0.92, maxK = 4.2;
  view.k = Math.min(maxK, Math.max(minK, view.k));
  var sw = SW*view.k;
  if(isOpenLocation()){
    // Centre an overview; at closer zooms stop at the actual park boundary.
    var edgePad = Math.min(24, cw*.04);
    view.x = sw <= cw ? (cw-sw)/2 : Math.min(edgePad, Math.max(cw-edgePad-sw, view.x));
  }else{
    var mx = Math.min(cw*0.42, sw*0.42);
    view.x = Math.min(cw - mx, Math.max(mx - sw, view.x));
  }
  /* Bound the camera to the chimney and garden floor, with a small breathing
     margin. If the whole house fits, centre it instead of panning empty space. */
  var top = -16 * view.k, bottom = (GROUND + 32) * view.k;
  var height = bottom - top, pad = Math.min(24, ch * .04);
  if(height + pad * 2 <= ch) view.y = (ch - height) / 2 - top;
  else view.y = Math.min(pad - top, Math.max(ch - pad - bottom, view.y));
}
function zoomAt(px,py,nk){
  cancelWheelZoom();
  if(viewAnim){ cancelAnimationFrame(viewAnim); viewAnim = null }
  introDone = true;
  stopGlide();
  var wx=(px-view.x)/view.k, wy=(py-view.y)/view.k;
  view.k=nk; clampView();
  view.x=px-wx*view.k; view.y=py-wy*view.k; clampView(); applyView();
}
/* Trackpads send many tiny wheel events. A fixed zoom step per event made
   even a gentle Mac gesture jump across the entire zoom range. Use distance
   instead, and paint at most once per frame without a trailing zoom animation. */
var wheelZoomRAF = 0, wheelZoomLog = 0, wheelZoomX = 0, wheelZoomY = 0;
var nativePinch = null;
function cancelWheelZoom(){
  if(wheelZoomRAF) cancelAnimationFrame(wheelZoomRAF);
  wheelZoomRAF = 0; wheelZoomLog = 0;
}
function queueWheelZoom(e){
  if(!e.deltaY || nativePinch || ptrs.size) return;
  var units = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? ch : 1;
  var delta = Math.max(-80, Math.min(80, e.deltaY*units));
  wheelZoomLog -= delta * (e.ctrlKey ? .003 : .0012);
  var r = stage.getBoundingClientRect();
  wheelZoomX = e.clientX-r.left; wheelZoomY = e.clientY-r.top;
  if(wheelZoomRAF) return;
  cancelTap(); hideTitleCard(); sweepPopups(); stopGlide();
  wheelZoomRAF = requestAnimationFrame(function(){
    var factor = Math.exp(wheelZoomLog), x = wheelZoomX, y = wheelZoomY;
    wheelZoomRAF = 0; wheelZoomLog = 0;
    if(Math.abs(factor-1) > .000001) zoomAt(x,y,view.k*factor);
  });
}
function resize(){
  cancelWheelZoom();
  var r = stage.getBoundingClientRect();
  cw = r.width; ch = r.height;
  scene.setAttribute("viewBox","0 0 "+cw+" "+ch);
  fitK = Math.min(cw/SW, ch/SH);
  clampView(); applyView();
}
/* ---- camera ----
   The house opens as a whole: you see the shape of the evening before you see
   any detail. The first tap dives in to a level where a cat is actually
   findable, after which the player is on their own. */
var introDone = false, viewAnim = null;

function overviewK(){
  // Open on half of the wider park so it stays readable; the rest is a pan away.
  // The minimum zoom still allows an overview of the entire landscape.
  if(currentLocation.id === "onsen") return Math.min(1.2,cw/(SW*.30),ch/SH);
  if(currentLocation.id === "harbour") return Math.min(1.2,cw/(SW*.32),ch/SH);
  if(currentLocation.id === "shopping") return Math.min(1.2,cw/(SW*.3),ch/SH);
  if(currentLocation.id === "park") return Math.min(2.2, cw/(SW*.5), ch/SH);
  /* The establishing shot has to include the gardens. Two cats start outside
     and the doors are on the outside walls, so an opening frame cropped to the
     house hides both the problem and the means of solving it.

     On a portrait phone that is still not worth paying in full. Even with the
     ground trimmed to the plan the world is half again as wide as the screen,
     so fitting every last pixel of it leaves the house about 210 across with
     nearly half the screen empty above and below. Frame the house and the near
     half of each plot instead: both doors, both doorsteps and ground on both
     sides stay in shot, and only the far edges fall outside, one drag away. The height is never cropped,
     and zooming out to the whole world is still allowed. */
  var frame = (ch > cw) ? Math.min(SW, HW + GARDEN * 1.1) : SW;
  return Math.min(2.2, Math.min(cw / frame, ch / SH));
}
/* Where the first tap takes you. It used to dive in wherever the finger
   landed, which meant the opening frame was wherever you happened to touch —
   often empty sky. The same establishing shot every time is better for a daily
   game: you learn one starting view and orient from it.

   It lands on the room inside the garden door, fitted so that one room fills
   the screen edge to edge. It used to frame garden, doorstep and house
   together, and players pinched in to a single room every time, through two
   rounds of landing closer; the garden is now one drag away, with the door at
   the edge of the frame. Where the screen is taller than the room, the ground
   line is parked just above the bottom edge so none of the frame is wasted on
   empty paper.

   Then closer still: 15%, and then a further 20% on top of that (1.15 x 1.2), so
   the room is well bigger than the screen and a cat reads without a pinch; the
   door end is the edge of the frame and the far wall is a drag away. */
var OPEN_CLOSER = 1.15 * 1.2;
function openingView(){
  if(currentLocation.id === "onsen"){
    var village=ROOMS[0],ok=Math.min(1.1,Math.max(playK(),cw/(village.w+160)));
    return {k:ok,x:village.x+village.w*.72,y:1120};
  }
  if(currentLocation.id === "harbour"){
    var quay=ROOMS.filter(function(r){return r.id === "harbourQuay"})[0],hk=Math.min(1.15,Math.max(playK(),cw/(quay.w+90)));
    return {k:hk,x:quay.x+quay.w*.72,y:1040};
  }
  if(currentLocation.id === "shopping"){
    var shop=ROOMS[Math.floor(ROOMS.length*.25)],k=Math.min(1.15,Math.max(playK(),cw/(shop.w+90)));
    return {k:k,x:shop.x+shop.w/2,y:760};
  }
  if(currentLocation.id === "park"){
    // Frame a real landmark: a daily clearance check can leave the old
    // fixed starting coordinate on an empty stretch of lawn or path.
    var landmark=parkOpeningLandmark;
    if(landmark){
      var pk=Math.min(1.1,Math.max(playK(),Math.min(cw/(landmark.w+220),ch/(landmark.h+150))));
      return {k:pk,x:landmark.x+landmark.w*.5,y:landmark.y+landmark.h*.55};
    }
    var grove=ROOMS[0],pk=playK();
    return {k:pk,x:grove.x+grove.w*.2,y:grove.y+grove.h*.6};
  }
  var ground = ROOMS.filter(function(r){ return !r.outside && r.y + r.h >= GROUND - 2 });
  var hingeX = doors.length ? doors[0].hingeX : HX;
  var room = ground.filter(function(r){ return Math.abs(r.x - hingeX) < 2 })[0] || ground[0];
  var k = playK();
  if(!room){ k *= OPEN_CLOSER; return {k:k, x:hingeX + (cw/2)/k * 0.5, y:GROUND - (ch/2)/k + 120} }
  var pad = 24;
  k = Math.max(k, Math.min(2.2, cw / (room.w + pad), ch / (room.h + pad))) * OPEN_CLOSER;
  /* a room too wide to fit is shown from its door end */
  var viewW = cw / k;
  var x = (room.w + pad <= viewW) ? room.x + room.w/2 : room.x - pad/2 + viewW/2;
  var y = Math.min(room.y + room.h/2, GROUND + 120 - (ch/2)/k);
  return {k:k, x:x, y:y};
}

function playK(){
  /* enough that a cat (~45 units) reads clearly — a phone needs a little more
     than a desktop to stay legible. The dive-in now fits a room instead, and
     this is the furthest out it will ever land; the closing scene uses it too. */
  return Math.min(2.2, Math.max(fitK, cw < 520 ? 0.65 : 0.55));
}
function animateTo(k, wx, wy, ms){
  cancelWheelZoom();
  if(viewAnim) cancelAnimationFrame(viewAnim);
  stopGlide();
  var k0 = view.k, x0 = view.x, y0 = view.y, t0 = performance.now();
  function step(now){
    var t = Math.min(1, (now - t0)/ms);
    var e = 1 - Math.pow(1 - t, 3);          /* ease out, like a camera settling */
    view.k = k0 + (k - k0)*e;
    view.x = (cw/2 - wx*view.k) * e + x0 * (1-e);
    view.y = (ch/2 - wy*view.k) * e + y0 * (1-e);
    clampView(); applyView();
    viewAnim = t < 1 ? requestAnimationFrame(step) : null;
  }
  viewAnim = requestAnimationFrame(step);
}

function resetView(){
  cancelWheelZoom();
  cancelTap();
  introDone = false;
  var r = stage.getBoundingClientRect();
  cw=r.width; ch=r.height;
  fitK = Math.min(cw/SW, ch/SH);
  /* the night opens a tenth closer than the overview: the house fills more
     of the screen, and the whole of it is one pinch away */
  view.k = overviewK() * 1.1;
  view.x = cw/2 - (SW/2)*view.k;
  view.y = ch/2 - (SH/2)*view.k;
  clampView(); applyView();
}

var ptrs = new Map(), pinch = null, downPt = null, moved = false;
/* Wait briefly before acting on a single tap so a second tap can claim the
   gesture for zoom. Neither half of a double-tap pokes the house. */
var pendingTap = null, tapTimer = 0, DOUBLE_TAP_MS = 320;
function cancelTap(){
  clearTimeout(tapTimer); tapTimer = 0; pendingTap = null;
}
function commitTap(){
  var p = pendingTap;
  cancelTap();
  if(p) tap(p.x, p.y);
}
function queueTap(x, y){
  pendingTap = {x:x, y:y, t:Date.now()};
  tapTimer = setTimeout(commitTap, DOUBLE_TAP_MS);
}

/* iOS-style flick: carry the last pointer velocity on after release and let
   it decay, stopping dead at the edges of the house rather than sticking. */
var vel = {x:0, y:0}, glideRAF = null, lastMoveT = 0;
function stopGlide(){ if(glideRAF){ cancelAnimationFrame(glideRAF); glideRAF = null } vel.x = vel.y = 0 }
function glide(){
  glideRAF = requestAnimationFrame(glide);
  var bx = view.x, by = view.y;
  view.x += vel.x; view.y += vel.y;
  clampView(); applyView();
  if(view.x === bx) vel.x = 0;   /* hit the edge — kill that axis */
  if(view.y === by) vel.y = 0;
  vel.x *= 0.962; vel.y *= 0.962;
  if(Math.abs(vel.x) < 0.14 && Math.abs(vel.y) < 0.14) stopGlide();
}

stage.addEventListener("pointerdown", function(e){
  if(e.button !== 0) return;
  cancelWheelZoom();
  var secondTap = pendingTap && Date.now() - pendingTap.t <= DOUBLE_TAP_MS &&
    Math.hypot(e.clientX - pendingTap.x, e.clientY - pendingTap.y) <= 24;
  if(secondTap) cancelTap();
  else if(pendingTap) commitTap();
  dismissToast();
  hideTitleCard();                 /* the brief clears the moment you touch the house */
  stopGlide();
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 1){ downPt = {x:e.clientX, y:e.clientY, t:Date.now(), double:secondTap}; moved = false; lastMoveT = performance.now(); stage.classList.add("dragging"); }
  else if(ptrs.size === 2){
    cancelTap();
    var a = Array.from(ptrs.values());
    pinch = {d:Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y), k:view.k};
    sweepPopups();
    moved = true;
  }
});
stage.addEventListener("pointermove", function(e){
  if(!ptrs.has(e.pointerId)) return;
  var prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 1){
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    if(downPt && Math.hypot(e.clientX-downPt.x, e.clientY-downPt.y) > 7){ if(!moved) sweepPopups(); cancelTap(); moved = true }
    /* low-pass the pointer velocity so one jittery sample can't fling it */
    var now = performance.now(), dt = Math.max(8, now - lastMoveT);
    lastMoveT = now;
    /* a flick should carry you across the garden, not nudge you a room over */
    vel.x = Math.max(-110, Math.min(110, vel.x*0.7 + (dx/dt*26)*0.3));
    vel.y = Math.max(-110, Math.min(110, vel.y*0.7 + (dy/dt*26)*0.3));
    view.x += dx; view.y += dy; clampView(); applyView();
  } else if(ptrs.size === 2 && pinch){
    var a = Array.from(ptrs.values());
    var d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    var r = stage.getBoundingClientRect();
    zoomAt((a[0].x+a[1].x)/2 - r.left, (a[0].y+a[1].y)/2 - r.top, pinch.k * (d/pinch.d));
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size < 2) pinch = null;
  if(ptrs.size === 0){
    stage.classList.remove("dragging");
    if(e.type === "pointercancel"){ cancelTap(); stopGlide() }
    else if(downPt && !moved && Date.now()-downPt.t < 600){
      stopGlide();
      if(downPt.double){
        sweepPopups();
        var r = stage.getBoundingClientRect();
        zoomAt(downPt.x-r.left, downPt.y-r.top, view.k*1.7);
      } else queueTap(downPt.x, downPt.y);
    }
    else if(moved && performance.now() - lastMoveT < 90 && Math.hypot(vel.x, vel.y) > 0.9){
      if(!glideRAF) glideRAF = requestAnimationFrame(glide);   /* let it coast */
    } else stopGlide();
    downPt = null;
  }
}
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);
stage.addEventListener("wheel", function(e){
  e.preventDefault();
  queueWheelZoom(e);
}, {passive:false});
stage.addEventListener("dblclick", function(e){
  /* Pointer events handle both mouse and touch doubles, exactly once. */
  e.preventDefault();
});
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function(){ setTimeout(resize, 250) });
/* Safari's Mac trackpad uses gesture events. Damp those too; touch-pointer
   pinches retain their existing direct control and are never handled twice. */
stage.addEventListener("gesturestart", function(e){
  e.preventDefault();
  if(ptrs.size >= 2) return;
  cancelWheelZoom(); cancelTap(); stopGlide(); hideTitleCard(); sweepPopups();
  var r = stage.getBoundingClientRect();
  var x = e.clientX-r.left, y = e.clientY-r.top;
  nativePinch = {k:view.k, scale:e.scale || 1,
    x:x >= 0 && x <= cw ? x : cw/2, y:y >= 0 && y <= ch ? y : ch/2};
}, {passive:false});
stage.addEventListener("gesturechange", function(e){
  e.preventDefault();
  if(nativePinch && ptrs.size < 2 && e.scale > 0)
    zoomAt(nativePinch.x,nativePinch.y,nativePinch.k*Math.pow(e.scale/nativePinch.scale,.65));
}, {passive:false});
stage.addEventListener("gestureend", function(e){ e.preventDefault(); nativePinch = null }, {passive:false});
stage.addEventListener("contextmenu", function(e){ e.preventDefault() });

/* ============================ 5. sound ============================ */
/* Quiet until asked: the game starts muted, and whatever the speaker button
   was last set to is remembered from one launch to the next. */
var actx=null, soundOn=false;
try{ soundOn = localStorage.getItem("wtc-sound") === "1" }catch(e){}
function beep(freq, dur, type, gain){
  if(!soundOn) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(gain||0.09, actx.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur+0.02);
  }catch(err){}
}
function sfxFound(n){ beep(520+n*58, .16,"triangle",.1); setTimeout(function(){beep(780+n*70,.22,"sine",.08)},95) }
function sfxNudge(){ beep(150+Math.random()*70, .07,"square",.035) }
function sfxWin(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){beep(f,.3,"triangle",.09)}, i*115) }) }

/* ============================ 6. game ============================ */

var targets=[], found=0, t0=0, penalty=0, hints=0, misses=0, done=false, seed=0, houseNo=0, isDaily=true;
/* The cats' things: what is in tonight's house, how many have turned up, and
   whether the night is over and the player has stayed on to look for the rest.
   The night's time is kept so its card can be shown again. */
var things=[], thingsFound=0, afterHours=false, nightSecs=0;
var EPOCH = Date.UTC(2026,0,1);

function fmt(s){ var m=Math.floor(s/60); return m+":"+String(Math.floor(s%60)).padStart(2,"0") }
function elapsed(){ return Math.floor((Date.now()-t0)/1000) + penalty }

var stickyToast = false;
/* A line that stays up until the player does something, rather than timing out
   like a notification. The opening brief used this and now gets the title card
   instead; it is kept for anything else that needs to be read rather than
   noticed. Swap the titleCard() call in start() back to
   toastHold(targets.length + " cats to find \u2014 " + occasion.goal) to undo that. */
function toastHold(msg){
  var t = document.getElementById("toast");
  clearTimeout(toast._t);
  t.textContent = msg;
  t.classList.add("show");
  stickyToast = true;
}
function dismissToast(){
  if(!stickyToast) return;
  stickyToast = false;
  document.getElementById("toast").classList.remove("show");
}

function toast(msg, ms){
  var t=document.getElementById("toast");
  stickyToast = false;
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show")}, ms || 1600);
}

/* ---- the cards that open and close a night ----
   The brief used to be a toast, which is the right weight for "Pickle is in"
   and far too light for the reason you are standing in a dark house at all.
   The same sentence, at the size it deserves. Neither card costs a tap: the
   opener is the brief and clears the moment you touch the house, the closer
   rides the gather and is gone before the result card lands. */
var NUMWORD = ["no","one","two","three","four","five","six","seven","eight",
               "nine","ten","eleven","twelve"];

/* Every closing beat now waits for a tap instead of a timer. They were tuned
   to be read in under two seconds each, which they are not — the player has
   just spent a night on this and is handed the payoff and the count in a
   flicker. One scrim does the waiting for all of them. */
function awaitTap(after, delay){
  var w = document.createElement("div");
  w.className = "tap-wait";
  w.id = "tapWait";
  document.body.appendChild(w);
  var gone = false;
  function go(){
    if(gone) return;
    gone = true;
    document.removeEventListener("keydown", onKey, true);
    if(w.parentNode) w.parentNode.removeChild(w);
    if(after) after();
  }
  function onKey(e){
    if(e.key === "Escape" || e.key === "Enter" || e.key === " "){ e.preventDefault(); go() }
  }
  /* the tap that ended the night is still in flight */
  setTimeout(function(){
    w.addEventListener("click", go);
    document.addEventListener("keydown", onKey, true);
  }, delay === undefined ? 420 : delay);
  return go;
}

function titleCard(head, sub){
  var t = document.getElementById("titlecard");
  t.querySelector("h2").textContent = head || "";
  /* {n} is however many cats this house turned out to hold: nine most nights,
     ten on the one in twenty that Sixpence lets herself in */
  t.querySelector("p").textContent =
    (sub || "").replace("{n}", NUMWORD[targets.length] || targets.length);
  t.classList.add("show");
}
function hideTitleCard(){
  document.getElementById("titlecard").classList.remove("show");
}

/* The scene and the roll call show a cat at house scale. On a find we bring
   that exact silhouette forward for a beat: it makes the discovery feel like
   meeting somebody, rather than merely increasing a number. */
function foundFlourish(rec, unlocked, after){
  /* a second find while the first card is still up: finish that one now */
  if(foundFlourish._close) foundFlourish._close(true);
  var cat = CATS[rec.kind], art = OBJ[rec.kind];
  if(!cat || !art){ if(after) after(); return }
  var pad = 10;
  var pop = document.createElement("section");
  pop.className = "found-pop";
  pop.id = "foundPop";
  pop.setAttribute("role", "status");
  pop.setAttribute("aria-live", "polite");
  pop.setAttribute("aria-label", cat.name + " found.");
  /* hearts and sparkles thrown out from behind the card, each its own way */
  var burst = "";
  for(var b = 0; b < 10; b++){
    var ang = (b / 10) * Math.PI * 2 + (b % 2 ? 0.25 : -0.1), dist = 110 + (b % 3) * 26;
    burst += '<span class="fp-bit' + (b % 2 ? ' spark' : '') + '" style="--dx:' + (Math.cos(ang) * dist).toFixed(0) +
      'px;--dy:' + (Math.sin(ang) * dist * 0.8).toFixed(0) + 'px;--d:' + (0.06 + (b % 4) * 0.05).toFixed(2) + 's">' +
      (b % 2 ? '<svg viewBox="0 0 20 20"><path d="M10 1l2.4 6.6L19 10l-6.6 2.4L10 19l-2.4-6.6L1 10l6.6-2.4Z"/></svg>'
             : '<svg viewBox="0 0 20 20"><path d="M10 18S2 12.6 2 7.2C2 4.4 4.1 2.5 6.4 2.5c1.6 0 2.9.9 3.6 2.2.7-1.3 2-2.2 3.6-2.2C15.9 2.5 18 4.4 18 7.2 18 12.6 10 18 10 18Z"/></svg>') +
      '</span>';
  }
  pop.innerHTML =
    '<div class="fp-card" style="--found-coat:' + cat.coat + '">' +
      '<div class="fp-burst" aria-hidden="true">' + burst + '</div>' +
      '<div class="fp-top"><p class="fp-kicker">Cat found</p><span class="fp-count">' +
        found + ' / ' + targets.length + '</span></div>' +
      '<div class="fp-body"><svg class="fp-cat" viewBox="' + (-pad) + ' ' + (-pad) + ' ' +
        (art.w + pad*2) + ' ' + (art.h + pad*2) + '" aria-hidden="true"><g class="' + artCls(rec.kind,"p-art") + ' pa-' +
        rec.kind + '" style="--coat:' + (cat.coat || "#EFEBE4") + '">' +
        art.s + '</g></svg></div>' +
      '<h2 class="fp-name">' + cat.name + '</h2><p class="fp-sub">' + cat.trait + '</p>' +
      '<div class="fp-progress" aria-hidden="true">' + targets.map(function(t){ return '<span' + (t.found ? ' class="on"' : '') + '></span>' }).join("") + '</div>' +
      (unlocked ? '<div class="fp-unlock"><b>Their page grew</b><span>' +
        unlocked.label + '</span></div>' : '') +
    '</div>';
  document.body.appendChild(pop);
  if(unlocked) markSlotGrew(rec.kind);

  /* The card is a moment, not a door: it holds for a second, then flies down
     into the cat's place in the tray by itself. Nothing waits for a tap and
     the house stays live underneath. The clock is still handed back for the
     time it was up, so a find costs nothing on the board. */
  var shown = Date.now(), gone = false;
  var timer = setTimeout(function(){ close(false) }, 1000);

  function close(now){
    if(gone) return;
    gone = true;
    clearTimeout(timer);
    foundFlourish._close = null;
    t0 += Date.now() - shown;
    /* it flies to the next empty cell of the gauge and the gauge takes its colour there */
    var cell = document.querySelectorAll("#trCells i")[landed.length];
    /* the gauge is hidden now that the tray is a single line of cats: land on the line */
    if(!cell || !cell.getClientRects().length) cell = document.getElementById("slots");
    var card = pop.querySelector(".fp-card"), finished = false;
    function done(){
      if(finished) return;
      finished = true;
      if(pop.parentNode) pop.parentNode.removeChild(pop);
      trayLand(rec.kind);
      if(after) after();
    }
    if(now){ done(); return }
    if(REDUCED || !cell || !card || !card.animate){
      pop.classList.add("closing");
      setTimeout(done, 300);
      return;
    }
    /* a swipe can land while the card is still settling in: it leaves from wherever it has got to,
       measured from where it sits rather than from where the entrance has taken it */
    var cs = getComputedStyle(card), from = {transform:cs.transform, opacity:cs.opacity};
    card.style.animation = "none";
    var cr = card.getBoundingClientRect(), tr = cell.getBoundingClientRect();
    var dx = tr.left + tr.width/2 - (cr.left + cr.width/2), dy = tr.top + tr.height/2 - (cr.top + cr.height/2);
    var a = card.animate([
      from,
      {transform:"translate(" + (dx*0.12).toFixed(0) + "px," + (dy*0.12 - 14).toFixed(0) + "px) scale(1.04)", opacity:1, offset:0.22},
      {transform:"translate(" + dx.toFixed(0) + "px," + dy.toFixed(0) + "px) scale(.12)", opacity:.15}
    ], {duration:620, easing:"cubic-bezier(.5,0,.7,.4)", fill:"forwards"});
    a.onfinish = done;
    setTimeout(done, 1000);   /* a tab that never animates still finishes */
  }

  foundFlourish._close = close;
}

function tap(clientX, clientY){
  if(done && !afterHours) return;

  /* first tap: dive in on whatever the player pointed at */
  if(!introDone){
    introDone = true;
    var f = openingView();
    animateTo(f.k, f.x, f.y, 850);
    return;
  }
  /* Hit rects are bounding boxes but the art inside them is mostly empty, so
     whatever was drawn last wins the tap even where you can plainly see the
     cat through it. That was academic while every cat sat in a layer above
     the house; now that they are stacked in among the furniture, a cat under
     a tree would be untappable. So: everything under the finger, cat first. */
  var stack = document.elementsFromPoint ? document.elementsFromPoint(clientX, clientY)
                                         : [document.elementFromPoint(clientX, clientY)];
  var g = null, rec = null;
  for(var si=0; si<stack.length && !rec; si++){
    var n = stack[si], og = n && n.closest ? n.closest(".obj") : null;
    if(!og) continue;
    if(!g) g = og;                                   /* the topmost thing, cat or not */
    rec = targets.find(function(t){ return t.g === og && !t.found });
  }
  if(!g) return;
  if(rec){ reveal(rec); return; }

  /* not a cat, but perhaps one of theirs */
  var th = null;
  for(var sj=0; sj<stack.length && !th; sj++){
    var m = stack[sj], mg = m && m.closest ? m.closest(".obj") : null;
    if(mg) th = things.find(function(t){ return t.g === mg && !t.found });
  }
  if(th){ findThing(th); return; }
  if(g.classList.contains("found")) return;

  /* poke a person and they stop walking and wave back */
  if(g.dataset.folk){
    var p = folks.find(function(f){ return f.g === g });
    if(p){ p.pause = Math.max(p.pause, 1.9); p.wave = 1 }
    g.classList.remove("waving"); g.getBoundingClientRect(); g.classList.add("waving");
    setTimeout(function(){ g.classList.remove("waving") }, 1350);
    beep(620, .12, "sine", .05);
    setTimeout(function(){ beep(830, .14, "sine", .04) }, 130);
    misses++;
    return;
  }

  if(g.classList.contains("door")){ toggleDoor(g); return }

  if(LAMPS[g.dataset.kind]){
    g.classList.toggle("lit");
    beep(g.classList.contains("lit") ? 940 : 700, .04, "square", .035);
  }
